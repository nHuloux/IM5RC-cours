<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réseaux de capteurs IM5RC — Graphe de notions</title>
<meta name="description" content="Cours Réseaux de capteurs (MIRA 3A) : 57 notions liées, vue graphe et vue liste.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23179AAF'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23fff'/%3E%3Ccircle cx='8' cy='9' r='2.4' fill='%23fff' opacity='.85'/%3E%3Ccircle cx='24' cy='10' r='2.4' fill='%23fff' opacity='.85'/%3E%3Ccircle cx='23' cy='24' r='2.4' fill='%23fff' opacity='.85'/%3E%3Ccircle cx='9' cy='23' r='2.4' fill='%23fff' opacity='.85'/%3E%3Cg stroke='%23fff' stroke-width='1.3' opacity='.7'%3E%3Cline x1='16' y1='16' x2='8' y2='9'/%3E%3Cline x1='16' y1='16' x2='24' y2='10'/%3E%3Cline x1='16' y1='16' x2='23' y2='24'/%3E%3Cline x1='16' y1='16' x2='9' y2='23'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ============ tokens ============ */
:root{
  --bg:#f6f8f8; --bg-alt:#eceff0; --surface:#ffffff; --surface-2:#f1f4f4;
  --border:#dbe2e3; --border-strong:#c3cdcf;
  --text:#1e2426; --text-muted:#63747a; --text-faint:#93a2a6;
  --accent:#0e7b8c; --accent-hi:#179aaf; --accent-wash:#e4f0f2;
  --shadow:0 1px 2px rgba(20,40,44,.06),0 12px 28px -20px rgba(20,40,44,.35);
  --c-01:#0f8fa2; --c-02:#3f72c9; --c-03:#8259c4; --c-04:#a9760d; --c-05:#1f8f66; --c-00:#6a7b80;
  --graph-link:rgba(30,60,66,.20); --graph-label:#33454a;
  color-scheme:light;
}
:root[data-theme="dark"], :root.dark{
  --bg:#191d1e; --bg-alt:#141718; --surface:#202526; --surface-2:#252b2c;
  --border:#2f3739; --border-strong:#414c4f;
  --text:#dbe3e5; --text-muted:#8e9c9f; --text-faint:#6a787b;
  --accent:#35b8cb; --accent-hi:#5ccede; --accent-wash:#16333a;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 32px -22px rgba(0,0,0,.8);
  --c-01:#35b8cb; --c-02:#6ea8f5; --c-03:#b18cf0; --c-04:#e8b04b; --c-05:#5cc79a; --c-00:#8d9ba0;
  --graph-link:rgba(190,215,220,.16); --graph-label:#b9c6c9;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:1px;border-radius:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============ shell ============ */
#app{display:grid;grid-template-columns:44px 268px minmax(0,1fr) 258px;height:100vh}
#app.no-left{grid-template-columns:44px 0 minmax(0,1fr) 258px}
#app.no-right{grid-template-columns:44px 268px minmax(0,1fr) 0}
#app.no-left.no-right{grid-template-columns:44px 0 minmax(0,1fr) 0}

/* ribbon */
.ribbon{background:var(--bg-alt);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0}
.ribbon .logo{width:26px;height:26px;margin-bottom:10px;flex:0 0 auto}
.rb{width:30px;height:30px;border-radius:5px;display:grid;place-items:center;color:var(--text-faint)}
.rb:hover{background:var(--surface-2);color:var(--text)}
.rb.on{color:var(--accent);background:var(--accent-wash)}
.rb svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ribbon .sp{flex:1}

/* sidebars */
.side{background:var(--bg-alt);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.side.left{border-right:1px solid var(--border)}
.side.right{border-left:1px solid var(--border)}
.side-head{padding:11px 12px 9px;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.side-head h2{font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--text-faint)}
.side-body{overflow-y:auto;overflow-x:hidden;flex:1;padding:0 6px 24px}

/* search */
.searchwrap{padding:0 10px 10px;flex:0 0 auto}
.searchbox{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:6px 9px}
.searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-wash)}
.searchbox svg{width:14px;height:14px;stroke:var(--text-faint);fill:none;stroke-width:2;flex:0 0 auto}
.searchbox input{border:0;background:none;color:inherit;font:inherit;width:100%;outline:none}
.searchbox input::placeholder{color:var(--text-faint)}
.searchbox kbd{font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--text-faint);border:1px solid var(--border);border-radius:3px;padding:1px 4px;flex:0 0 auto}
.hitcount{font-size:11px;color:var(--text-faint);padding:6px 10px 2px}

/* explorer tree */
.tree{font-size:13px}
.folder>.frow{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:4px;color:var(--text-muted);cursor:pointer;font-weight:600;font-size:12px}
.folder>.frow:hover{background:var(--surface-2);color:var(--text)}
.folder>.frow .caret{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;transition:transform .12s;flex:0 0 auto}
.folder.closed>.frow .caret{transform:rotate(-90deg)}
.folder.closed>.fkids{display:none}
.folder>.frow .cnt{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--text-faint);font-weight:400}
.fkids{padding-left:13px;border-left:1px solid var(--border);margin-left:10px}
.leaf{display:block;width:100%;text-align:left;padding:4px 7px;border-radius:4px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.leaf:hover{background:var(--surface-2);color:var(--text)}
.leaf.on{background:var(--accent-wash);color:var(--accent);font-weight:600}
.leaf .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:1px}

/* main */
main{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.tabbar{display:flex;align-items:center;gap:2px;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--bg-alt);flex:0 0 auto;min-height:42px}
.iconbtn{width:28px;height:28px;border-radius:5px;display:grid;place-items:center;color:var(--text-faint);flex:0 0 auto}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.iconbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.iconbtn[disabled]{opacity:.32;cursor:default}
.iconbtn[disabled]:hover{background:none;color:var(--text-faint)}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;margin-left:4px;font-size:12.5px;color:var(--text-muted)}
.crumb b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb span{color:var(--text-faint);flex:0 0 auto}
.seg{margin-left:auto;display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:2px;gap:2px;flex:0 0 auto}
.seg button{padding:3px 11px;border-radius:4px;font-size:12px;font-weight:500;color:var(--text-muted);display:flex;align-items:center;gap:6px}
.seg button svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pane{flex:1;min-height:0;position:relative}
.pane>section{position:absolute;inset:0;overflow:auto;display:none}
.pane>section.on{display:block}

/* ---- note view ---- */
.note{max-width:760px;margin:0 auto;padding:38px 44px 120px}
.note .meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:16px}
.pill{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.05em;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--text-muted);background:var(--surface)}
.pill.chap{border-color:transparent;color:#fff}
.note h1{font-family:Figtree,sans-serif;font-size:2.05rem;font-weight:700;letter-spacing:-.024em;line-height:1.1;margin-bottom:20px;text-wrap:balance}
.md{font-family:"Source Serif 4",Georgia,serif;font-size:16.5px;line-height:1.68}
.md>*+*{margin-top:1em}
.md h2{font-family:Figtree,sans-serif;font-size:1.24rem;font-weight:600;letter-spacing:-.012em;margin-top:1.9em;padding-bottom:.32em;border-bottom:1px solid var(--border)}
.md h3{font-family:Figtree,sans-serif;font-size:1.06rem;font-weight:600;margin-top:1.5em}
.md blockquote{border-left:3px solid var(--accent);background:var(--accent-wash);padding:14px 18px;border-radius:0 4px 4px 0}
.md blockquote>*+*{margin-top:.7em}
.md ul,.md ol{padding-left:1.35em}
.md li+li{margin-top:.35em}
.md code{font-family:"JetBrains Mono",monospace;font-size:.83em;background:var(--surface-2);border:1px solid var(--border);border-radius:3px;padding:1px 5px}
.md pre{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:14px 16px;overflow-x:auto}
.md pre code{background:none;border:0;padding:0;font-size:12.5px;line-height:1.55}
.md hr{border:0;border-top:1px solid var(--border);margin:2em 0}
.md em{color:var(--text-muted)}
.md strong{font-weight:600;color:var(--text)}
.md a.wl{color:var(--accent);border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent);text-decoration:none}
.md a.wl:hover{background:var(--accent-wash);text-decoration:none}
.md a.wl.dead{color:var(--text-faint);border-bottom-style:dashed;cursor:not-allowed}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:6px;background:var(--surface)}
.md table{border-collapse:collapse;width:100%;font-family:Figtree,sans-serif;font-size:13.5px;min-width:460px}
.md th,.md td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.md thead th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);background:var(--surface-2);white-space:nowrap}
.md tbody tr:last-child td{border-bottom:0}
.mermaid-box{background:#f4f7f7;border:1px solid var(--border);border-radius:6px;padding:20px 14px;overflow-x:auto;text-align:center}
:root[data-theme="dark"] .mermaid-box{background:#eef2f2}
.mermaid-box svg{max-width:100%;height:auto}
.note-foot{margin-top:52px;padding-top:18px;border-top:1px solid var(--border);font-size:12px;color:var(--text-faint);display:flex;flex-wrap:wrap;gap:14px}

/* ---- graph view ---- */
.graphwrap{position:absolute;inset:0;overflow:hidden}
#gcanvas{display:block;width:100%;height:100%;cursor:grab}
#gcanvas.grabbing{cursor:grabbing}
.gpanel{position:absolute;top:14px;left:14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:12px 14px;width:222px;font-size:12.5px}
.gpanel h3{font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--text-faint);margin-bottom:9px}
.gpanel label{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;color:var(--text-muted)}
.gpanel label:hover{color:var(--text)}
.gpanel input[type=checkbox]{accent-color:var(--accent);width:13px;height:13px;flex:0 0 auto}
.gpanel .sw{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.gpanel .n{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--text-faint)}
.gsliders{margin-top:12px;padding-top:11px;border-top:1px solid var(--border)}
.gsliders div{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--text-muted);font-size:11.5px}
.gsliders input[type=range]{flex:1;accent-color:var(--accent);height:14px}
.ghint{position:absolute;bottom:14px;left:14px;font-size:11.5px;color:var(--text-faint);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:7px 11px;line-height:1.6;max-width:280px}
.gbtns{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:6px}
.gbtns button{width:30px;height:30px;background:var(--surface);border:1px solid var(--border);border-radius:6px;display:grid;place-items:center;color:var(--text-muted);box-shadow:var(--shadow)}
.gbtns button:hover{color:var(--accent);border-color:var(--accent)}
.gbtns svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* ---- list view ---- */
.listview{padding:26px 30px 90px;max-width:1080px;margin:0 auto}
.listview .lhead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:18px}
.listview h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.listview .sub{color:var(--text-muted);font-size:13px;margin-top:3px}
.filters{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px}
.chipf{font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);color:var(--text-muted);background:var(--surface);display:flex;align-items:center;gap:6px}
.chipf .sw{width:8px;height:8px;border-radius:50%}
.chipf:hover{border-color:var(--border-strong);color:var(--text)}
.chipf.off{opacity:.4}
.tbl{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.tblscroll{overflow-x:auto}
table.data{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
table.data th:nth-child(2),table.data td:nth-child(2){white-space:nowrap;width:96px}
table.data th:nth-child(3),table.data td:nth-child(3){white-space:nowrap;width:104px}
table.data th:nth-child(4),table.data td:nth-child(4){width:64px}
table.data th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);background:var(--surface-2);padding:9px 14px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0}
table.data th:hover{color:var(--text)}
table.data th .ar{color:var(--accent);font-size:9px;margin-left:3px}
table.data td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
table.data tbody tr{cursor:pointer}
table.data tbody tr:hover{background:var(--surface-2)}
table.data tbody tr:last-child td{border-bottom:0}
table.data td.t{font-weight:500;color:var(--text)}
table.data td.n{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;color:var(--text-muted);text-align:right}
table.data td .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}
.tdesc{color:var(--text-muted);font-size:12.5px;max-width:400px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:40px;text-align:center;color:var(--text-faint)}

/* right sidebar blocks */
.rblock{margin:0 4px 4px;padding:10px 8px 12px}
.rblock h3{font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--text-faint);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.rblock h3 .n{font-family:"JetBrains Mono",monospace;background:var(--surface-2);border-radius:3px;padding:0 5px;letter-spacing:0}
.rlink{display:block;width:100%;text-align:left;padding:5px 8px;border-radius:4px;color:var(--text-muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlink:hover{background:var(--surface-2);color:var(--accent)}
.rblock .none{color:var(--text-faint);font-size:12px;padding:2px 8px;font-style:italic}
.outline a{display:block;padding:4px 8px;border-radius:4px;color:var(--text-muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.outline a:hover{background:var(--surface-2);color:var(--accent);text-decoration:none}
.outline a.h3{padding-left:20px;font-size:12px;color:var(--text-faint)}
.minigraph{margin:2px 8px 0;border:1px solid var(--border);border-radius:6px;background:var(--surface);overflow:hidden}
.minigraph canvas{display:block;width:100%;height:170px;cursor:pointer}

/* mobile */
.mobbar{display:none}
@media (max-width:960px){
  #app{grid-template-columns:44px minmax(0,1fr)!important}
  .side.left,.side.right{position:fixed;top:0;bottom:0;width:min(280px,84vw);z-index:40;box-shadow:var(--shadow);transition:transform .18s}
  .side.left{left:0;transform:translateX(-100%)}
  .side.left.open{transform:translateX(44px)}
  .side.right{right:0;transform:translateX(100%)}
  .side.right.open{transform:none}
  .note{padding:26px 20px 90px}
  .listview{padding:20px 16px 80px}
  .gpanel{width:190px;font-size:12px}
  .ghint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">

  <nav class="ribbon" aria-label="Barre latérale">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--accent)"/><circle cx="16" cy="16" r="3.4" fill="#fff"/><g fill="#fff" opacity=".9"><circle cx="8" cy="9" r="2.4"/><circle cx="24" cy="10" r="2.4"/><circle cx="23" cy="24" r="2.4"/><circle cx="9" cy="23" r="2.4"/></g><g stroke="#fff" stroke-width="1.3" opacity=".7"><line x1="16" y1="16" x2="8" y2="9"/><line x1="16" y1="16" x2="24" y2="10"/><line x1="16" y1="16" x2="23" y2="24"/><line x1="16" y1="16" x2="9" y2="23"/></g></svg>
    <button class="rb on" id="rbFiles" title="Explorateur de fichiers"><svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
    <button class="rb" id="rbGraph" title="Vue graphe"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.6"/><circle cx="5" cy="5.5" r="2.1"/><circle cx="19" cy="6" r="2.1"/><circle cx="18" cy="19" r="2.1"/><circle cx="5.5" cy="18" r="2.1"/><path d="M10.2 10.4 6.6 7.1M13.8 10.5l3.5-2.8M13.6 13.7l3 3.6M10.4 13.6l-3.2 3"/></svg></button>
    <button class="rb" id="rbList" title="Vue liste"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></button>
    <span class="sp"></span>
    <button class="rb" id="rbTheme" title="Thème clair / sombre"><svg viewBox="0 0 24 24"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg></button>
  </nav>

  <aside class="side left" id="sideLeft">
    <div class="side-head"><h2>Notions</h2></div>
    <div class="searchwrap">
      <label class="searchbox">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Rechercher…" autocomplete="off" aria-label="Rechercher une notion">
        <kbd>⌘K</kbd>
      </label>
    </div>
    <div id="hits" class="hitcount" hidden></div>
    <div class="side-body"><div class="tree" id="tree"></div></div>
  </aside>

  <main>
    <div class="tabbar">
      <button class="iconbtn" id="mobLeft" title="Explorateur"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <button class="iconbtn" id="back" title="Précédent" disabled><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="iconbtn" id="fwd" title="Suivant" disabled><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <div class="crumb" id="crumb"></div>
      <div class="seg" role="tablist">
        <button data-v="note" class="on"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/></svg>Note</button>
        <button data-v="graph"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.4"/><circle cx="5" cy="6" r="1.9"/><circle cx="19" cy="7" r="1.9"/><circle cx="18" cy="18" r="1.9"/><path d="M10.3 10.6 6.5 7.4M13.7 10.7l3.5-2.5M13.6 13.5l3 3.2"/></svg>Graphe</button>
        <button data-v="list"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Liste</button>
      </div>
      <button class="iconbtn" id="mobRight" title="Liens"><svg viewBox="0 0 24 24"><path d="M9 15l6-6M8.5 9.5A3.5 3.5 0 1 1 12 13l-1 1"/><path d="M15.5 14.5A3.5 3.5 0 1 1 12 11l1-1"/></svg></button>
    </div>

    <div class="pane">
      <section id="vNote" class="on"><article class="note" id="noteBody"></article></section>
      <section id="vGraph">
        <div class="graphwrap">
          <canvas id="gcanvas"></canvas>
          <div class="gpanel">
            <h3>Chapitres</h3>
            <div id="gfilters"></div>
            <div class="gsliders">
              <div><span>Écartement</span><input type="range" id="sRep" min="400" max="5000" step="50" value="2200"></div>
              <div><span>Étiquettes</span><input type="range" id="sLab" min="0" max="100" step="1" value="30"></div>
            </div>
          </div>
          <div class="gbtns">
            <button id="gZin" title="Zoom avant"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
            <button id="gZout" title="Zoom arrière"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
            <button id="gFit" title="Recentrer"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          </div>
          <div class="ghint">Molette pour zoomer, glisser le fond pour déplacer, glisser un nœud pour le déplacer. Clic sur un nœud pour ouvrir la note.</div>
        </div>
      </section>
      <section id="vList"><div class="listview" id="listBody"></div></section>
    </div>
  </main>

  <aside class="side right" id="sideRight">
    <div class="side-head"><h2>Liens</h2></div>
    <div class="side-body" id="rightBody"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script>
/* =========================================================================
   Données injectées par build.py
   ========================================================================= */
const VAULT = /*__DATA__*/{"notes":[]}/*__ENDDATA__*/;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const norm = s => (s||"").normalize("NFC");
const deburr = s => norm(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const NOTES = VAULT.notes.map(n => ({...n, title: norm(n.title)}));
const BY_TITLE = new Map(NOTES.map(n => [n.title, n]));

/* ---------- chapitres / couleurs ---------- */
const GROUPS = [
  {key:"01", label:"1 · Introduction & architectures", css:"--c-01"},
  {key:"02", label:"2 · Adressage & IPv6",             css:"--c-02"},
  {key:"03", label:"3 · Communication & routage",      css:"--c-03"},
  {key:"04", label:"4 · Énergie & fiabilité",          css:"--c-04"},
  {key:"05", label:"5 · Compléments hors support",     css:"--c-05"},
  {key:"00", label:"Repères & accueil",                css:"--c-00"},
];
const groupOf = n => {
  const m = /^(\d\d)-/.exec(n.folder || "");
  return m ? m[1] : "00";
};
const colorOf = n => getComputedStyle(document.documentElement)
  .getPropertyValue((GROUPS.find(g => g.key === groupOf(n)) || GROUPS[5]).css).trim();

/* ---------- graphe : arêtes ---------- */
NOTES.forEach(n => { n.out = []; n.in = []; n.group = groupOf(n); });
NOTES.forEach(n => {
  const seen = new Set();
  (n.links || []).forEach(raw => {
    const t = norm(raw);
    if (t === n.title || seen.has(t)) return;
    seen.add(t);
    const tgt = BY_TITLE.get(t);
    if (tgt) { n.out.push(tgt.title); tgt.in.push(n.title); }
  });
});
NOTES.forEach(n => { n.in = [...new Set(n.in)]; n.degree = new Set([...n.out, ...n.in]).size; });

const EDGES = (() => {
  const s = new Set();
  NOTES.forEach(n => n.out.forEach(t => {
    const k = n.title < t ? n.title + "␀" + t : t + "␀" + n.title;
    s.add(k);
  }));
  return [...s].map(k => { const [a,b] = k.split("␀"); return {a,b}; });
})();

/* =========================================================================
   Thème
   ========================================================================= */
const THEME_KEY = "im5rc-theme";
function readTheme(){
  try { const v = localStorage.getItem(THEME_KEY); if (v === "dark" || v === "light") return v; } catch(e){}
  return window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
}
/* appliqué tout de suite pour éviter un flash, avant que le reste soit déclaré */
document.documentElement.setAttribute("data-theme", readTheme());

function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem(THEME_KEY, t); } catch(e){}
  if (window.mermaid) {
    mermaid.initialize({ startOnLoad:false, theme:"default", securityLevel:"loose",
                         fontFamily:'"JetBrains Mono", ui-monospace, monospace' });
  }
  if (state.view === "note" && state.current) renderNote(state.current, true);
  drawGraph(); drawMini();
}
$("#rbTheme").onclick = () =>
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");

/* =========================================================================
   Markdown
   ========================================================================= */
if (window.marked) {
  const renderer = new marked.Renderer();
  const baseCode = renderer.code.bind(renderer);
  renderer.code = (code, lang) => (lang === "mermaid")
    ? `<div class="mermaid-box"><pre class="mermaid">${esc(code)}</pre></div>`
    : baseCode(code, lang);
  const baseTable = renderer.table.bind(renderer);
  renderer.table = (...a) => `<div class="tablewrap">${baseTable(...a)}</div>`;
  marked.use({ renderer, gfm:true, breaks:false });
}
function mdToHtml(src){
  // wikilinks hors blocs de code
  const parts = src.split(/(```[\s\S]*?```|`[^`\n]*`)/g);
  const out = parts.map((chunk, i) => {
    if (i % 2 === 1) return chunk;
    return chunk.replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]+))?\]\]/g, (_, t, alias) => {
      const target = norm(t.trim()), label = esc((alias || t).trim());
      return BY_TITLE.has(target)
        ? `<a class="wl" href="#/n/${encodeURIComponent(target)}" data-t="${esc(target)}">${label}</a>`
        : `<a class="wl dead" title="Note absente du site">${label}</a>`;
    });
  }).join("");
  return window.marked ? marked.parse(out) : `<pre>${esc(out)}</pre>`;
}

/* =========================================================================
   État & navigation
   ========================================================================= */
const state = { view:"note", current:null, hist:[], pos:-1, filter:new Set(GROUPS.map(g=>g.key)), query:"" };
let graphShown = false;

function go(title, {push=true} = {}){
  const n = BY_TITLE.get(norm(title));
  if (!n) return;
  state.current = n.title;
  if (push) {
    state.hist = state.hist.slice(0, state.pos + 1);
    if (state.hist[state.pos] !== n.title) { state.hist.push(n.title); state.pos = state.hist.length - 1; }
  }
  if (location.hash !== "#/n/" + encodeURIComponent(n.title)) {
    history.replaceState(null, "", "#/n/" + encodeURIComponent(n.title));
  }
  setView("note");
  renderNote(n.title);
  renderTree();
  renderRight();
  updateNav();
}
function updateNav(){
  $("#back").disabled = state.pos <= 0;
  $("#fwd").disabled  = state.pos >= state.hist.length - 1;
}
$("#back").onclick = () => { if (state.pos > 0){ state.pos--; go(state.hist[state.pos], {push:false}); } };
$("#fwd").onclick  = () => { if (state.pos < state.hist.length-1){ state.pos++; go(state.hist[state.pos], {push:false}); } };

function setView(v){
  state.view = v;
  document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  $("#vNote").classList.toggle("on", v === "note");
  $("#vGraph").classList.toggle("on", v === "graph");
  $("#vList").classList.toggle("on", v === "list");
  $("#rbFiles").classList.toggle("on", v === "note");
  $("#rbGraph").classList.toggle("on", v === "graph");
  $("#rbList").classList.toggle("on", v === "list");
  if (v === "graph") {
    resizeGraph();
    if (!graphShown) { graphShown = true; fitGraph(); }
    sim.alpha = Math.max(sim.alpha, .22);
  }
  if (v === "list") renderList();
  const c = $("#crumb");
  if (v === "graph") c.innerHTML = `<b>Vue graphe</b><span>·</span>${NOTES.length} notions, ${EDGES.length} liens`;
  else if (v === "list") c.innerHTML = `<b>Vue liste</b><span>·</span>${NOTES.length} notions`;
  else if (state.current) {
    const n = BY_TITLE.get(state.current);
    c.innerHTML = `<span>${esc(n.folder || "racine")}</span><span>/</span><b>${esc(n.title)}</b>`;
  }
}
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => setView(b.dataset.v));
$("#rbFiles").onclick = () => { setView("note"); if (innerWidth <= 960) $("#sideLeft").classList.add("open"); };
$("#rbGraph").onclick = () => setView("graph");
$("#rbList").onclick  = () => setView("list");
$("#mobLeft").onclick  = () => $("#sideLeft").classList.toggle("open");
$("#mobRight").onclick = () => $("#sideRight").classList.toggle("open");

document.addEventListener("click", e => {
  const a = e.target.closest("a.wl[data-t]");
  if (a) { e.preventDefault(); go(a.dataset.t); if (innerWidth <= 960) $("#sideRight").classList.remove("open"); }
});
addEventListener("hashchange", () => {
  const m = /^#\/n\/(.+)$/.exec(location.hash);
  if (m) { const t = norm(decodeURIComponent(m[1])); if (BY_TITLE.has(t) && t !== state.current) go(t); }
});
addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#q").focus(); $("#q").select(); }
  else if (e.key === "Escape") { if (document.activeElement === $("#q")) { $("#q").value = ""; onSearch(); $("#q").blur(); } }
  else if (!e.metaKey && !e.ctrlKey && !e.altKey && !/input|textarea|select/i.test(document.activeElement.tagName)) {
    if (e.key === "g") setView("graph");
    else if (e.key === "l") setView("list");
    else if (e.key === "n") setView("note");
  }
});

/* =========================================================================
   Rendu de la note
   ========================================================================= */
function renderNote(title, keepScroll){
  const n = BY_TITLE.get(norm(title || "")); if (!n) return;
  const scroll = keepScroll ? $("#vNote").scrollTop : 0;
  const g = GROUPS.find(x => x.key === n.group) || GROUPS[5];
  const pills = [
    `<span class="pill chap" style="background:var(${g.css})">${esc(g.label)}</span>`,
    n.type ? `<span class="pill">${esc(n.type)}</span>` : "",
    `<span class="pill">${n.degree} lien${n.degree > 1 ? "s" : ""}</span>`,
  ].join("");
  $("#noteBody").innerHTML =
    `<div class="meta">${pills}</div><h1>${esc(n.title)}</h1><div class="md" id="mdBody">${mdToHtml(n.body)}</div>` +
    `<div class="note-foot"><span>${esc(n.folder || "racine")}/${esc(n.title)}.md</span>` +
    (n.tags && n.tags.length ? `<span>${n.tags.map(t => "#" + esc(t)).join(" ")}</span>` : "") + `</div>`;
  // le H1 markdown fait doublon avec le titre de la page
  const h1 = $("#mdBody").querySelector("h1"); if (h1) h1.remove();
  $("#vNote").scrollTop = scroll;
  if (window.mermaid) {
    const els = [...$("#mdBody").querySelectorAll("pre.mermaid")];
    if (els.length) mermaid.run({ nodes: els }).catch(() => {});
  }
}

/* =========================================================================
   Explorateur
   ========================================================================= */
function matches(n, q){
  if (!q) return true;
  const d = deburr(q);
  return deburr(n.title).includes(d) || deburr(n.body).includes(d);
}
function renderTree(){
  const q = state.query;
  const folders = new Map();
  NOTES.forEach(n => {
    if (!matches(n, q)) return;
    const f = n.folder || "";
    if (!folders.has(f)) folders.set(f, []);
    folders.get(f).push(n);
  });
  const keys = [...folders.keys()].sort((a,b) => (a===""?"~":a).localeCompare(b===""?"~":b, "fr"));
  const html = keys.map(f => {
    const list = folders.get(f).sort((a,b) => a.title.localeCompare(b.title, "fr"));
    const open = !q ? (openFolders.has(f) ? "" : "closed") : "";
    const label = f === "" ? "racine" : f;
    return `<div class="folder ${open}" data-f="${esc(f)}">
      <div class="frow"><svg class="caret" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>${esc(label)}<span class="cnt">${list.length}</span></div>
      <div class="fkids">${list.map(n => {
        const g = GROUPS.find(x => x.key === n.group) || GROUPS[5];
        return `<button class="leaf ${n.title===state.current?"on":""}" data-t="${esc(n.title)}" title="${esc(n.title)}"><span class="dot" style="background:var(${g.css})"></span>${esc(n.title)}</button>`;
      }).join("")}</div></div>`;
  }).join("") || `<div class="empty">Aucune notion.</div>`;
  $("#tree").innerHTML = html;
  $("#tree").querySelectorAll(".leaf").forEach(b => b.onclick = () => {
    go(b.dataset.t); if (innerWidth <= 960) $("#sideLeft").classList.remove("open");
  });
  $("#tree").querySelectorAll(".frow").forEach(r => r.onclick = () => {
    const f = r.parentElement.dataset.f;
    if (openFolders.has(f)) openFolders.delete(f); else openFolders.add(f);
    r.parentElement.classList.toggle("closed");
  });
}
const openFolders = new Set(NOTES.map(n => n.folder || ""));

function onSearch(){
  state.query = $("#q").value.trim();
  renderTree();
  const hits = NOTES.filter(n => matches(n, state.query)).length;
  const el = $("#hits");
  el.hidden = !state.query;
  el.textContent = `${hits} notion${hits>1?"s":""} sur ${NOTES.length}`;
  drawGraph();
  if (state.view === "list") renderList();
}
$("#q").addEventListener("input", onSearch);

/* =========================================================================
   Panneau droit
   ========================================================================= */
function renderRight(){
  const n = BY_TITLE.get(state.current || ""); if (!n) return;
  const link = t => `<button class="rlink" data-t="${esc(t)}">${esc(t)}</button>`;
  const outline = [...($("#mdBody") ? $("#mdBody").querySelectorAll("h2,h3") : [])]
    .map((h,i) => { h.id = "h" + i; return `<a href="#h${i}" class="${h.tagName.toLowerCase()}">${esc(h.textContent)}</a>`; }).join("");
  $("#rightBody").innerHTML = `
    <div class="minigraph"><canvas id="mini"></canvas></div>
    <div class="rblock"><h3>Liens sortants <span class="n">${n.out.length}</span></h3>
      ${n.out.length ? n.out.map(link).join("") : `<div class="none">aucun</div>`}</div>
    <div class="rblock"><h3>Liens entrants <span class="n">${n.in.length}</span></h3>
      ${n.in.length ? n.in.map(link).join("") : `<div class="none">aucun</div>`}</div>
    ${outline ? `<div class="rblock"><h3>Plan</h3><div class="outline">${outline}</div></div>` : ""}`;
  $("#rightBody").querySelectorAll(".rlink").forEach(b => b.onclick = () => {
    go(b.dataset.t); if (innerWidth <= 960) $("#sideRight").classList.remove("open");
  });
  drawMini();
}

/* =========================================================================
   Vue liste
   ========================================================================= */
let sortKey = "title", sortDir = 1;
const shortFolder = n => {
  const f = n.folder || "";
  if (!f) return "racine";
  if (f.startsWith("00")) return "repères";
  if (f.startsWith("05")) return "compléments";
  const m = /^(\d{1,2})-/.exec(f);
  return m ? "chap. " + Number(m[1]) : f;
};
function renderList(){
  const rows = NOTES
    .filter(n => state.filter.has(n.group) && matches(n, state.query))
    .sort((a,b) => {
      const va = sortKey === "degree" ? a.degree : (a[sortKey] || ""), vb = sortKey === "degree" ? b.degree : (b[sortKey] || "");
      return (typeof va === "number" ? va - vb : String(va).localeCompare(String(vb), "fr")) * sortDir;
    });
  const th = (k, l, cls="") => `<th data-k="${k}" class="${cls}">${l}${sortKey===k?`<span class="ar">${sortDir>0?"▲":"▼"}</span>`:""}</th>`;
  $("#listBody").innerHTML = `
    <div class="lhead">
      <div><h1>Toutes les notions</h1>
        <div class="sub">${rows.length} notion${rows.length>1?"s":""} affichée${rows.length>1?"s":""} sur ${NOTES.length} · ${EDGES.length} liens dans le graphe</div></div>
      <div class="filters">${GROUPS.map(g => {
        const c = NOTES.filter(n => n.group === g.key).length;
        return `<button class="chipf ${state.filter.has(g.key)?"":"off"}" data-g="${g.key}"><span class="sw" style="background:var(${g.css})"></span>${esc(g.label)} <span style="opacity:.6">${c}</span></button>`;
      }).join("")}</div>
    </div>
    <div class="tbl"><div class="tblscroll"><table class="data">
      <thead><tr>${th("title","Notion")}${th("folder","Dossier")}${th("type","Type")}${th("degree","Liens","style=text-align:right")}</tr></thead>
      <tbody>${rows.length ? rows.map(n => {
        const g = GROUPS.find(x => x.key === n.group) || GROUPS[5];
        return `<tr data-t="${esc(n.title)}">
          <td class="t"><span class="sw" style="background:var(${g.css})"></span>${esc(n.title)}
            <span class="tdesc">${esc(n.excerpt || "")}</span></td>
          <td style="color:var(--text-muted)">${esc(shortFolder(n))}</td>
          <td style="color:var(--text-muted)">${esc(n.type || "—")}</td>
          <td class="n">${n.degree}</td></tr>`;
      }).join("") : `<tr><td colspan="4" class="empty">Aucune notion ne correspond.</td></tr>`}</tbody>
    </table></div></div>`;
  $("#listBody").querySelectorAll("tbody tr[data-t]").forEach(tr => tr.onclick = () => go(tr.dataset.t));
  $("#listBody").querySelectorAll("th[data-k]").forEach(h => h.onclick = () => {
    if (sortKey === h.dataset.k) sortDir = -sortDir; else { sortKey = h.dataset.k; sortDir = 1; }
    renderList();
  });
  $("#listBody").querySelectorAll(".chipf").forEach(b => b.onclick = () => {
    const g = b.dataset.g;
    if (state.filter.has(g)) state.filter.delete(g); else state.filter.add(g);
    renderList(); renderFilters(); drawGraph();
  });
}

/* =========================================================================
   Vue graphe — simulation de forces sur canvas
   ========================================================================= */
const cv = $("#gcanvas"), ctx = cv.getContext("2d");
const nodes = NOTES.map((n, i) => {
  const a = (i / NOTES.length) * Math.PI * 2, r = 150 + 90 * Math.random();
  return { t:n.title, n, x:Math.cos(a)*r, y:Math.sin(a)*r, vx:0, vy:0, r:4 + 2.3*Math.sqrt(n.degree), fixed:false };
});
const NODE = new Map(nodes.map(o => [o.t, o]));
const links = EDGES.map(e => ({ s:NODE.get(e.a), t:NODE.get(e.b) })).filter(l => l.s && l.t);
const sim = { alpha:1, rep:2200, view:{ x:0, y:0, k:1 }, hover:null, drag:null, labelPct:.30 };

function visible(o){ return state.filter.has(o.n.group); }
function highlighted(o){ return state.query ? matches(o.n, state.query) : true; }

function physics(){
    const vis = nodes.filter(visible);
    for (let i = 0; i < vis.length; i++) for (let j = i+1; j < vis.length; j++) {
      const a = vis[i], b = vis[j];
      let dx = b.x - a.x, dy = b.y - a.y, d2 = dx*dx + dy*dy || .01;
      if (d2 > 900000) continue;
      const f = sim.rep / d2, d = Math.sqrt(d2), fx = f*dx/d, fy = f*dy/d;
      a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
    }
    const L = 78;
    links.forEach(l => {
      if (!visible(l.s) || !visible(l.t)) return;
      const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y, d = Math.hypot(dx, dy) || .01;
      const f = (d - L) * .012, fx = f*dx/d, fy = f*dy/d;
      l.s.vx += fx; l.s.vy += fy; l.t.vx -= fx; l.t.vy -= fy;
    });
    // anti-chevauchement : sépare les disques qui se touchent
    for (let i = 0; i < vis.length; i++) for (let j = i+1; j < vis.length; j++) {
      const a = vis[i], b = vis[j], min = a.r + b.r + 6;
      let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || .01;
      if (d < min) {
        const p = (min - d) / d * .5;
        a.x -= dx*p; a.y -= dy*p; b.x += dx*p; b.y += dy*p;
      }
    }
    vis.forEach(o => {
      o.vx -= o.x * .0022; o.vy -= o.y * .0022;      // gravité vers le centre
      if (o === sim.drag) { o.vx = o.vy = 0; return; }
      o.vx *= .82; o.vy *= .82;
      o.x += o.vx * sim.alpha; o.y += o.vy * sim.alpha;
    });
    sim.alpha *= .992;
}
function tick(){
  if (sim.alpha > .003) physics();
  drawGraph();
  requestAnimationFrame(tick);
}
function resizeGraph(){
  const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.max(1, r.width * dpr); cv.height = Math.max(1, r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", () => { resizeGraph(); resizeMini(); if (graphShown) fitGraph(); });

/* place la vue sur l'ensemble des nœuds visibles */
function fitGraph(){
  const r = cv.getBoundingClientRect();
  if (r.width < 40 || r.height < 40) return;      // panneau encore masqué
  const vis = nodes.filter(visible); if (!vis.length) return;
  const xs = vis.map(o => o.x), ys = vis.map(o => o.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const w = Math.max(80, maxX - minX), h = Math.max(80, maxY - minY);
  const panel = r.width > 620 ? 250 : 0;   // largeur du panneau « Chapitres »
  sim.view.k = Math.max(.25, Math.min(2.4, Math.min((r.width - panel) / (w + 180), r.height / (h + 140))));
  sim.view.x = -(minX + maxX) / 2 + (panel / 2) / sim.view.k;
  sim.view.y = -(minY + maxY) / 2;
}

function drawGraph(){
  if (!cv.width) return;
  const r = cv.getBoundingClientRect(), W = r.width, H = r.height, v = sim.view;
  ctx.clearRect(0, 0, W, H);
  const cs = getComputedStyle(document.documentElement);
  const linkC = cs.getPropertyValue("--graph-link").trim();
  const labelC = cs.getPropertyValue("--graph-label").trim();
  const accent = cs.getPropertyValue("--accent-hi").trim();
  const T = (x, y) => [W/2 + (x + v.x) * v.k, H/2 + (y + v.y) * v.k];
  const hov = sim.hover;
  const nbr = new Set();
  if (hov) { hov.n.out.forEach(t => nbr.add(t)); hov.n.in.forEach(t => nbr.add(t)); }

  ctx.lineWidth = Math.max(.6, 1 * v.k);
  links.forEach(l => {
    if (!visible(l.s) || !visible(l.t)) return;
    const on = hov && (l.s === hov || l.t === hov);
    ctx.strokeStyle = on ? accent : linkC;
    ctx.globalAlpha = on ? .85 : (hov ? .30 : 1);
    const [x1,y1] = T(l.s.x, l.s.y), [x2,y2] = T(l.t.x, l.t.y);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  });
  ctx.globalAlpha = 1;

  /* Étiquettes : les nœuds les mieux connectés sont nommés en priorité, et
     toute étiquette qui chevaucherait une étiquette déjà posée est omise.
     Résultat lisible à tous les niveaux de zoom. */
  const boxes = [];
  const fits = (x, y, w, h) => {
    for (const b of boxes) if (x < b.x2 && x + w > b.x1 && y < b.y2 && y + h > b.y1) return false;
    boxes.push({x1:x, y1:y, x2:x+w, y2:y+h});
    return true;
  };
  const order = nodes.slice().sort((a, b) => {
    const pa = (a.t === state.current ? 3 : 0) + (a === hov ? 4 : 0) + (nbr.has(a.t) ? 2 : 0);
    const pb = (b.t === state.current ? 3 : 0) + (b === hov ? 4 : 0) + (nbr.has(b.t) ? 2 : 0);
    return (pb - pa) || (b.n.degree - a.n.degree);
  });
  const labelBudget = Math.round(6 + sim.labelPct * 46 + v.k * 14);

  nodes.forEach(o => {
    if (!visible(o)) return;
    const [x,y] = T(o.x, o.y);
    const isCur = o.t === state.current, isHov = o === hov, isNbr = nbr.has(o.t);
    const dim = (hov && !isHov && !isNbr) || !highlighted(o);
    ctx.globalAlpha = dim ? .22 : 1;
    ctx.beginPath(); ctx.arc(x, y, Math.max(2, o.r * v.k), 0, 7);
    ctx.fillStyle = colorOf(o.n); ctx.fill();
    if (isCur || isHov) {
      ctx.lineWidth = 2; ctx.strokeStyle = accent;
      ctx.beginPath(); ctx.arc(x, y, Math.max(2, o.r*v.k) + 3.5, 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });

  /* seconde passe : les étiquettes, par ordre de priorité */
  const bgC = cs.getPropertyValue("--bg").trim();
  let placed = 0;
  for (const o of order) {
    if (!visible(o)) continue;
    const isCur = o.t === state.current, isHov = o === hov, isNbr = nbr.has(o.t);
    const forced = isHov || isCur || isNbr;
    if ((hov && !forced) || !highlighted(o)) continue;
    if (!forced && placed >= labelBudget) continue;
    const [x, y] = T(o.x, o.y);
    const strong = isHov || isCur;
    const size = Math.min(13, 9.5 + v.k * 1.7);
    ctx.font = `${strong ? 600 : 400} ${size}px Figtree, sans-serif`;
    const lab = o.t.length > 34 ? o.t.slice(0, 33) + "…" : o.t;
    const w = ctx.measureText(lab).width, h = size * 1.25;
    const ly = y + Math.max(2, o.r * v.k) + 4;
    if (!forced && !fits(x - w/2 - 2, ly - 1, w + 4, h)) continue;
    if (forced) fits(x - w/2 - 2, ly - 1, w + 4, h);
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.lineWidth = 3.2; ctx.strokeStyle = bgC;           // liseré de lisibilité
    ctx.strokeText(lab, x, ly);
    ctx.fillStyle = strong ? accent : labelC;
    ctx.globalAlpha = strong ? 1 : .9;
    ctx.fillText(lab, x, ly);
    ctx.globalAlpha = 1;
    if (!forced) placed++;
  }
}
function pick(mx, my){
  const r = cv.getBoundingClientRect(), v = sim.view;
  let best = null, bd = 1e9;
  nodes.forEach(o => {
    if (!visible(o)) return;
    const x = r.width/2 + (o.x + v.x)*v.k, y = r.height/2 + (o.y + v.y)*v.k;
    const d = Math.hypot(mx - x, my - y);
    if (d < Math.max(9, o.r*v.k + 7) && d < bd) { bd = d; best = o; }
  });
  return best;
}
let panning = null;
cv.addEventListener("mousemove", e => {
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  if (sim.drag) {
    sim.drag.x = (mx - r.width/2)/sim.view.k - sim.view.x;
    sim.drag.y = (my - r.height/2)/sim.view.k - sim.view.y;
    sim.alpha = Math.max(sim.alpha, .22); return;
  }
  if (panning) { sim.view.x += (mx - panning.x)/sim.view.k; sim.view.y += (my - panning.y)/sim.view.k; panning = {x:mx, y:my}; return; }
  const h = pick(mx, my);
  if (h !== sim.hover) { sim.hover = h; cv.style.cursor = h ? "pointer" : "grab"; cv.title = h ? h.t : ""; }
});
cv.addEventListener("mousedown", e => {
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const h = pick(mx, my);
  if (h) { sim.drag = h; h.moved = false; } else { panning = {x:mx, y:my}; cv.classList.add("grabbing"); }
});
addEventListener("mouseup", e => {
  if (sim.drag) {
    const r = cv.getBoundingClientRect();
    const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    if (inside && pick(e.clientX - r.left, e.clientY - r.top) === sim.drag) go(sim.drag.t);
    sim.drag = null;
  }
  panning = null; cv.classList.remove("grabbing");
});
cv.addEventListener("mouseleave", () => { sim.hover = null; });
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.12 : 1/1.12;
  sim.view.k = Math.min(6, Math.max(.25, sim.view.k * f));
}, {passive:false});
$("#gZin").onclick  = () => sim.view.k = Math.min(6, sim.view.k * 1.25);
$("#gZout").onclick = () => sim.view.k = Math.max(.25, sim.view.k / 1.25);
$("#gFit").onclick  = () => fitGraph();
$("#sRep").oninput = e => { sim.rep = +e.target.value; sim.alpha = Math.max(sim.alpha, .4); };
$("#sLab").oninput = e => { sim.labelPct = +e.target.value / 100; };

function renderFilters(){
  $("#gfilters").innerHTML = GROUPS.map(g => {
    const c = NOTES.filter(n => n.group === g.key).length;
    return `<label><input type="checkbox" data-g="${g.key}" ${state.filter.has(g.key)?"checked":""}>
      <span class="sw" style="background:var(${g.css})"></span>${esc(g.label)}<span class="n">${c}</span></label>`;
  }).join("");
  $("#gfilters").querySelectorAll("input").forEach(i => i.onchange = () => {
    if (i.checked) state.filter.add(i.dataset.g); else state.filter.delete(i.dataset.g);
    sim.alpha = Math.max(sim.alpha, .35); drawGraph();
    if (state.view === "list") renderList();
  });
}

/* ---------- mini graphe local (panneau droit) ---------- */
function resizeMini(){
  const c = document.getElementById("mini"); if (!c) return;
  const r = c.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  c.width = Math.max(1, r.width*dpr); c.height = Math.max(1, r.height*dpr);
  c.getContext("2d").setTransform(dpr,0,0,dpr,0,0);
}
function drawMini(){
  const c = document.getElementById("mini"); if (!c) return;
  if (!c.width) resizeMini();
  const g = c.getContext("2d"), r = c.getBoundingClientRect(), W = r.width, H = r.height;
  g.clearRect(0,0,W,H);
  const n = BY_TITLE.get(state.current || ""); if (!n) return;
  const cs = getComputedStyle(document.documentElement);
  const nb = [...new Set([...n.out, ...n.in])].map(t => BY_TITLE.get(t)).filter(Boolean);
  const cx = W/2, cy = H/2, R = Math.min(W, H)/2 - 26;
  g.strokeStyle = cs.getPropertyValue("--graph-link").trim(); g.lineWidth = 1;
  const pts = nb.map((m, i) => {
    const a = -Math.PI/2 + (i/Math.max(1, nb.length))*Math.PI*2;
    return { m, x: cx + Math.cos(a)*R, y: cy + Math.sin(a)*R };
  });
  pts.forEach(p => { g.beginPath(); g.moveTo(cx, cy); g.lineTo(p.x, p.y); g.stroke(); });
  pts.forEach(p => {
    g.beginPath(); g.arc(p.x, p.y, 4, 0, 7); g.fillStyle = colorOf(p.m); g.fill();
  });
  g.beginPath(); g.arc(cx, cy, 6.5, 0, 7); g.fillStyle = colorOf(n); g.fill();
  g.lineWidth = 2; g.strokeStyle = cs.getPropertyValue("--accent-hi").trim();
  g.beginPath(); g.arc(cx, cy, 10, 0, 7); g.stroke();
  g.font = "600 10px Figtree, sans-serif"; g.fillStyle = cs.getPropertyValue("--text-faint").trim();
  g.textAlign = "center"; g.textBaseline = "bottom";
  g.fillText(`graphe local · ${nb.length} voisin${nb.length>1?"s":""}`, W/2, H - 6);
  c.onclick = () => setView("graph");
}

/* =========================================================================
   Démarrage
   ========================================================================= */
if (window.mermaid) {
  mermaid.initialize({ startOnLoad:false, theme:"default", securityLevel:"loose",
                       fontFamily:'"JetBrains Mono", ui-monospace, monospace' });
}
renderFilters();
renderTree();
resizeGraph();
/* pré-calcul de la disposition : le graphe est déjà déplié à la première ouverture */
for (let i = 0; i < 420; i++) physics();
sim.alpha = .12;
requestAnimationFrame(tick);
const m0 = /^#\/n\/(.+)$/.exec(location.hash);
const start = m0 && BY_TITLE.has(norm(decodeURIComponent(m0[1]))) ? norm(decodeURIComponent(m0[1]))
            : (BY_TITLE.has("Accueil") ? "Accueil" : NOTES[0].title);
go(start);
</script>
