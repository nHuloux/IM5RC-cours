F pour les réseaux IPv6/6LoWPAN contraints, organisé en arbre orienté (DODAG) enraciné sur la passerelle.\n\n## Compléments rattachés à ce chapitre\n\n- [[Couche MAC et accès au canal (CSMA-CA)]] — le problème des collisions, prérequis non énoncé du chapitre.\n- [[Qualité de lien (PRR, ETX, RSSI, LQI)]] — ce que mesure réellement la fonction d'objectif de RPL.\n- [[TSCH]] — la variante déterministe de 802.15.4, celle des réseaux industriels.\n- [[Sécurité des réseaux de capteurs]] — attaques sur le routage, en particulier sur RPL.\n\n## Voir aussi\n\n- [[Accueil]]\n- [[Chapitre 1 - Introduction, architectures et applications]]\n- [[Chapitre 2 - Adressage et protocole IPv6]]\n- [[Chapitre 4 - Économie d'énergie et tolérance aux pannes]]\n- [[Compléments hors support]]","excerpt":"Notions du chapitre 3 — La communication dans les réseaux de capteurs.","links":["Compromis portée-débit-consommation","Comparaison des technologies radio","IEEE 802.15.4","Zigbee","Thread","Bluetooth Low Energy (BLE)","LoRa et LoRaWAN","NB-IoT et LTE-M","Nœuds fixes et nœuds mobiles","Réseau ad-hoc (MANET)","Routage dans les réseaux ad-hoc","Protocoles proactifs (OLSR)","Protocoles réactifs (AODV)","Protocoles hybrides (ZRP)","RPL","Couche MAC et accès au canal (CSMA-CA)","Qualité de lien (PRR, ETX, RSSI, LQI)","TSCH","Sécurité des réseaux de capteurs","Accueil","Chapitre 1 - Introduction, architectures et applications","Chapitre 2 - Adressage et protocole IPv6","Chapitre 4 - Économie d'énergie et tolérance aux pannes","Compléments hors support"]},{"title":"Comparaison des technologies radio","folder":"03-Communication-et-routage","type":"concept","chapter":"3 - La communication dans les réseaux de capteurs","tags":["reseaux-de-capteurs","chapitre-3","concept","synthese"],"body":"# Comparaison des technologies radio\n\n> **Définition.** Tableau de synthèse des cinq familles de technologies radio étudiées, à lire comme un outil de choix plutôt que comme une liste de caractéristiques.\n\n## Le tableau\n\n| Techno | Bande | Débit | Portée | Topologie | Courant en émission | Usage typique |\n|---|---|---|---|---|---|---|\n| **BLE** | 2,4 GHz, 40 canaux de 2 MHz | 125 kbit/s (Coded S=8) à 2 Mbit/s (LE 2M) | 10 à 100 m | étoile ; mesh depuis 2017 | quelques mA | capteurs corporels, balises |\n| **802.15.4** (Zigbee, Thread) | 2,4 GHz, canaux 11 à 26 ; 868 MHz | 250 kbit/s ; 20 à 100 kbit/s en 868 | 10 à 100 m par saut | maillée multi-saut | 7 mA (CC2652R) à 24 mA (CC2538) | domotique, bâtiment, industrie |\n| **LoRa / LoRaWAN** | 868 MHz, sous-bande g1 | 250 bit/s (SF12) à 5,5 kbit/s (SF7) ; 11 kbit/s en DR6 | 2 à 15 km | étoile de passerelles | 29 mA à +13 dBm ; 120 mA à +20 dBm | agriculture, environnement, ville |\n| **NB-IoT** | LTE, 180 kHz | ≈ 227 kbit/s descendant ; 250 kbit/s montant multi-tone, ≈ 20 kbit/s single-tone | couverture opérateur, bonne pénétration en intérieur | étoile cellulaire | pics de 100 à 200 mA | compteurs enterrés, nœuds fixes |\n| **LTE-M** | LTE, 1,4 MHz | ≈ 1 Mbit/s | couverture opérateur | étoile cellulaire | élevé | logistique, mobilité, voix |\n\n## Comment s'en servir\n\nLe tableau ne dit pas quelle technologie est la meilleure — il n'y en a pas. Il sert à écarter, dans l'ordre :\n\n1. **La zone à couvrir** élimine d'abord. Au-delà de quelques centaines de mètres sans relais possible, seuls les LPWAN restent.\n2. **Le volume de données** élimine ensuite. Une image, même compressée, sort LoRaWAN du jeu ; quelques octets par heure l'y font entrer.\n3. **La disponibilité d'une infrastructure** tranche entre cellulaire et réseau privé : NB-IoT et LTE-M évitent de déployer des passerelles, au prix d'un abonnement et d'une dépendance à la couverture.\n4. **La mobilité** écarte NB-IoT, qui ne gère pas le transfert intercellulaire en mode connecté (Release 13) — LTE-M, oui.\n5. **La contrainte réglementaire** finit le travail : le rapport cyclique ETSI plafonne le nombre de messages en LoRaWAN, voir [[LoRa et LoRaWAN]].\n\n**À retenir.** Deux erreurs de conception classiques : choisir une technologie sur sa portée annoncée sans vérifier le débit qu'il reste à cette portée, et oublier que le courant d'émission du tableau est un courant de **pic** — c'est le courant moyen, calculé dans [[Budget énergétique d'un nœud]], qui détermine l'autonomie.\n\n## Notions liées\n\n- [[Compromis portée-débit-consommation]]\n- [[IEEE 802.15.4]]\n- [[Zigbee]]\n- [[Thread]]\n- [[Bluetooth Low Energy (BLE)]]\n- [[LoRa et LoRaWAN]]\n- [[NB-IoT et LTE-M]]\n- [[Budget énergétique d'un nœud]]\n\n---\n*Chapitre 3 — La communication dans les réseaux de capteurs. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Tableau de synthèse des cinq familles de technologies radio étudiées, à lire comme un outil de choix plutôt que comme une liste de caractéristiques.","links":["LoRa et LoRaWAN","Budget énergétique d'un nœud","Compromis portée-débit-consommation","IEEE 802.15.4","Zigbee","Thread","Bluetooth Low Energy (BLE)","NB-IoT et LTE-M"]},{"title":"Compromis portée-débit-consommation","folder":"03-Communication-et-routage","type":"concept","chapter":"3 - La communication dans les réseaux de capteurs","tags":["reseaux-de-capteurs","chapitre-3","concept"],"body":"# Compromis portée-débit-consommation\n\n> **Définition.** Toute communication sans fil repose sur un compromis entre portée, débit, consommation et coût, qu'on ne peut pas tous optimiser en même temps.\n\nAugmenter la portée demande d'augmenter la puissance d'émission (donc la consommation) ou de baisser le débit (une modulation plus robuste transporte moins d'information mais porte plus loin). C'est pourquoi les technologies « longue portée » sont aussi « bas débit », et inversement : il n'existe pas de technologie universelle, on choisit en fonction du besoin.\n\n## Schéma\n\n```mermaid\nquadrantChart\n    title Technologies radio pour capteurs\n    x-axis \"Courte portée (10 m)\" --> \"Longue portée (10 km)\"\n    y-axis \"Bas débit (kbit/s)\" --> \"Haut débit (Mbit/s)\"\n    quadrant-1 \"Coûteux en énergie\"\n    quadrant-2 \"Réseaux locaux rapides\"\n    quadrant-3 \"WPAN basse conso\"\n    quadrant-4 \"LPWAN : le compromis\"\n    \"BLE\": [0.15, 0.72]\n    \"Wi-Fi (référence)\": [0.30, 0.95]\n    \"802.15.4 / Zigbee / Thread\": [0.22, 0.30]\n    \"LTE-M\": [0.78, 0.55]\n    \"NB-IoT\": [0.80, 0.20]\n    \"LoRaWAN\": [0.90, 0.05]\n```\n\nLe quadrant en haut à droite — longue portée **et** haut débit — est vide pour les capteurs : y aller demande une puissance d'émission incompatible avec une pile. Les technologies de capteurs se répartissent donc sur les deux autres bords, et choisir revient à décider de quel côté on se place.\n\n**Illustration chiffrée sur une seule technologie.** En LoRa, passer de SF7 à SF12 multiplie la portée mais fait tomber le débit de 5,5 kbit/s à 250 bit/s, et allonge le temps d'antenne d'un facteur d'environ 25 (62 ms à 1,5 s pour 20 octets). L'énergie par message suit : voir le calcul dans [[Budget énergétique d'un nœud]]. Le compromis n'est pas seulement un choix entre technologies, il se rejoue à l'intérieur de chacune.\n\n**À retenir.** On ne peut avoir simultanément longue portée, haut débit et basse consommation. Toute technologie de communication pour capteurs est un point de compromis sur ce triangle. Choisir une technologie, c'est décider quelle grandeur on sacrifie.\n\n## Notions liées\n\n- [[Comparaison des technologies radio]]\n- [[IEEE 802.15.4]]\n- [[Bluetooth Low Energy (BLE)]]\n- [[LoRa et LoRaWAN]]\n- [[NB-IoT et LTE-M]]\n- [[Budget énergétique d'un nœud]]\n\n---\n*Chapitre 3 — La communication dans les réseaux de capteurs. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Toute communication sans fil repose sur un compromis entre portée, débit, consommation et coût, qu'on ne peut pas tous optimiser en même temps.","links":["Budget énergétique d'un nœud","Comparaison des technologies radio","IEEE 802.15.4","Bluetooth Low Energy (BLE)","LoRa et LoRaWAN","NB-IoT et LTE-M"]},{"title":"IEEE 802.15.4","folder":"03-Communication-et-routage","type":"technologie","chapter":"3 - La communication dans les réseaux de capteurs","tags":["reseaux-de-capteurs","chapitre-3","technologie"],"body":"# IEEE 802.15.4\n\n> **Définition.** Norme qui définit les couches physique et liaison des réseaux personnels sans fil basse consommation (LR-WPAN). Bande 2,4 GHz, ~250 kbit/s, portée de quelques dizaines de mètres.\n\nC'est la base sur laquelle se construisent Zigbee et Thread. Sa trame ne fait que 127 octets au total, contrainte majeure qui justifie l'existence de 6LoWPAN pour y faire transiter IPv6.\n\n## Repères chiffrés\n\n| | Valeur |\n|---|---|\n| Trame PHY maximale | 127 octets |\n| Charge utile MAC disponible | 102 octets, ou 81 octets avec AES-CCM* et MIC de 128 bits |\n| Bande 2,4 GHz | 250 kbit/s, 16 canaux (numérotés 11 à 26), modulation O-QPSK/DSSS |\n| Bande 868 MHz (Europe) | 20 kbit/s en BPSK, ou 100 kbit/s en O-QPSK |\n| Période de backoff CSMA-CA | 20 symboles, soit 320 µs à 2,4 GHz et 400 µs à 868 MHz |\n\n## Deux modes de fonctionnement\n\n- **Non-beacon** (`macBeaconOrder = 15`) : accès au canal par CSMA-CA non fenêtré. C'est le mode retenu par Zigbee et par les piles 6LoWPAN, donc celui que l'on rencontre en pratique.\n- **Beacon-enabled** : le coordinateur émet des balises qui découpent le temps en *superframes* — période d'accès par contention (CAP) puis période sans contention (CFP) avec créneaux garantis (GTS). Utile quand une latence bornée est exigée.\n\nLe détail de l'accès au canal, et la raison pour laquelle il ne suffit pas, sont traités dans [[Couche MAC et accès au canal (CSMA-CA)]]. La variante à créneaux synchronisés et saut de canal, utilisée dans l'industrie, est [[TSCH]].\n\n## Notions liées\n\n- [[Zigbee]]\n- [[Thread]]\n- [[6LoWPAN]]\n- [[Compromis portée-débit-consommation]]\n- [[Comparaison des technologies radio]]\n- [[Couche MAC et accès au canal (CSMA-CA)]]\n- [[TSCH]]\n- [[Sécurité des réseaux de capteurs]]\n\n---\n*Chapitre 3 — La communication dans les réseaux de capteurs. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Norme qui définit les couches physique et liaison des réseaux personnels sans fil basse consommation (LR-WPAN). Bande 2,4 GHz, ~250 kbit/s, portée de quelques dizaines de mètres.","links":["Couche MAC et accès au canal (CSMA-CA)","TSCH","Zigbee","Thread","6LoWPAN","Compromis portée-débit-consommation","Comparaison des technologies radio","Sécurité des réseaux de capteurs"]},{"title":"LoRa et LoRaWAN","folder":"03-Communication-et-routage","type":"technologie","chapter":"3 - La communication dans les réseaux de capteurs","tags":["reseaux-de-capteurs","chapitre-3","technologie"],"body":"# LoRa et LoRaWAN\n\n> **Définition.** LoRa : modulation longue portée en bande sub-gigahertz libre (868 MHz en Europe), plusieurs kilomètres de portée, débit très faible. LoRaWAN : protocole réseau construit au-dessus, organisé en étoile.\n\nChaque capteur émet vers des passerelles qui relaient vers un serveur de réseau central. LoRaWAN définit trois classes de terminaux (A, B, C) selon leur compromis réactivité/consommation. C'est la technologie de référence pour les déploiements étendus en extérieur (agriculture, environnement, ville).\n\n**Exemple.** Vignoble étendu : capteurs dispersés sur des hectares, quelques mesures par heure → LoRaWAN (longue portée, très basse consommation, faible débit suffisant). Massif forestier isolé sans couverture : LoRa en réseau privé, éventuellement relais multi-saut.\n\n## Repères chiffrés (région EU868)\n\n| Facteur d'étalement | Débit | Charge utile applicative max |\n|---|---|---|\n| SF12 (DR0) | 250 bit/s | 51 octets |\n| SF11 (DR1) | 440 bit/s | 51 octets |\n| SF10 (DR2) | 980 bit/s | 51 octets |\n| SF9 (DR3) | 1 760 bit/s | 115 octets |\n| SF8 (DR4) | 3 125 bit/s | 222 octets |\n| SF7 (DR5) | 5 470 bit/s | 222 octets |\n| SF7 / BW250 (DR6) | 11 000 bit/s | 222 octets |\n\nConsommation du transceiver de référence SX1276 : environ **29 mA à +13 dBm** sur la sortie RFO, jusqu'à 120 mA à +20 dBm sur PA_BOOST ; 10,8 mA en réception ; 0,2 µA en sommeil.\n\n## La contrainte qui décide vraiment : le rapport cyclique\n\nEn Europe, l'ETSI impose un **rapport cyclique par sous-bande**, indépendamment de la batterie :\n\n| Sous-bande | Rapport cyclique autorisé |\n|---|---|\n| 863–865 MHz | 0,1 % |\n| 868–868,6 MHz (sous-bande principale) | 1 % |\n| 869,4–869,65 MHz | 10 % |\n\n**À retenir.** Ce plafond réglementaire, et non l'autonomie, est souvent ce qui limite le nombre de messages par jour. À 1 % dans la sous-bande principale, un message de 1 s de temps d'antenne interdit toute nouvelle émission pendant 99 s sur ce canal. C'est un point de dimensionnement que les projets découvrent en général trop tard : il se calcule avant de choisir la période de mesure, pas après.\n\nDeuxième conséquence, à croiser avec [[Compromis portée-débit-consommation]] : monter en facteur d'étalement pour gagner de la portée allonge le temps d'antenne, donc consomme plus vite le quota de rapport cyclique **et** l'énergie de la pile.\n\n## Notions liées\n\n- [[Topologie en étoile]]\n- [[Compromis portée-débit-consommation]]\n- [[Comparaison des technologies radio]]\n- [[Domaines d'application des WSN]]\n- [[Budget énergétique d'un nœud]]\n- [[Sécurité des réseaux de capteurs]]\n\n---\n*Chapitre 3 — La communication dans les réseaux de capteurs. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"LoRa : modulation longue portée en bande sub-gigahertz libre (868 MHz en Europe), plusieurs kilomètres de portée, débit très faible. LoRaWAN : protocole réseau construit au-dessus,","links":["Compromis portée-débit-consommation","Topologie en étoile","Comparaison des technologies radio","Domaines d'application des WSN","Budget énergétique d'un nœud","Sécurité des réseaux de capteurs"]},{"title":"NB-IoT et LTE-M","folder":"03-Communication-et-routage","type":"technologie","chapter":"3 - La communication dans les réseaux de capteurs","tags":["reseaux-de-capteurs","chapitre-3","technologie"],"body":"# NB-IoT et LTE-M\n\n> **Définition.** Technologies LPWAN cellulaires, appuyées sur les infrastructures des opérateurs mobiles (4G/5G).\n\n**NB-IoT** vise les objets très bas débit, fixes, avec une excellente pénétration en intérieur (compteurs enterrés, par exemple). **LTE-M** autorise un débit plus élevé et la mobilité. Avantage commun : pas d'infrastructure à déployer soi-même ; inconvénient : abonnement opérateur et couverture dépendante du réseau.\n\n## Notions liées\n\n- [[Compromis portée-débit-consommation]]\n- [[Nœuds fixes et nœuds mobiles]]\n\n---\n*Chapitre 3 — La communication dans les réseaux de capteurs. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Technologies LPWAN cellulaires, appuyées sur les infrastructures des opérateurs mobiles (4G/5G).","links":["Compromis portée-débit-consommation","Nœuds fixes et nœuds mobiles"]},{"title":"Nœuds fixes et nœuds mobiles","folder":"03-Communication-et-routage","type":"concept","chapter":"3 - La communication dans les réseaux de capteurs","tags":["reseaux-de-capteurs","chapitre-3","concept"],"body":"# Nœuds fixes et nœuds mobiles\n\n> **Définition.** Un nœud fixe, posé une fois, donne une topologie stable ; un nœud mobile rend la topologie dynamique et le routage difficile.\n\nDans la majorité des déploiements (agriculture, bâtiment, surveillance), les nœuds sont **fixes** : les routes changent peu, la principale cause de changement est la défaillance d'un nœud, pas son déplacement.\n\nCertains nœuds se **déplacent** (animaux, véhicules, personnes, drones) : la topologie devient dynamique, les voisins changent en permanence, les routes se rompent et doivent être reconstruites sans cesse — ce qui coûte des messages de contrôle et de l'énergie.\n\nOn distingue aussi la **mobilité de la passerelle** : un collecteur mobile (véhicule, drone) qui parcourt la zone pour récolter les données des nœuds fixes au passage (*data mule*), économisant l'énergie des nœuds au prix d'une latence de collecte plus élevée.\n\n**À retenir.** Nœuds fixes ⇒ topologie stable, routes durables, optimisation possible. Nœuds mobiles ⇒ topologie changeante, routes à reconstruire fréquemment, protocoles réactifs indispensables. La mobilité est le facteur qui rend le routage difficile.\n\n## Notions liées\n\n- [[Nœud capteur (mote)]]\n- [[Réseau ad-hoc (MANET)]]\n- [[Protocoles réactifs (AODV)]]\n- [[RPL]]\n\n## Mentionné par\n\n- [[NB-IoT et LTE-M]]\n\n---\n*Chapitre 3 — La communication dans les réseaux de capteurs. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Un nœud fixe, posé une fois, donne une topologie stable ; un nœud mobile rend la topologie dynamique et le routage difficile.","links":["Nœud capteur (mote)","Réseau ad-hoc (MANET)","Protocoles réactifs (AODV)","RPL","NB-IoT et LTE-M"]},{"title":"Protocoles hybrides (ZRP)","folder":"03-Communication-et-routage","type":"protocole","chapter":"3 - La communication dans les réseaux de capteurs","tags":["reseaux-de-capteurs","chapitre-3","protocole"],"body":"# Protocoles hybrides (ZRP)\n\n> **Définition.** Combinent les deux approches : proactif à l'intérieur d'une zone locale, réactif au-delà, pour les destinations lointaines et rares.\n\nExemple : **ZRP** (Zone Routing Protocol). L'idée est de profiter de la faible latence du proactif là où les routes servent souvent (le voisinage immédiat), tout en évitant le coût permanent du proactif pour des destinations lointaines et rarement sollicitées.\n\n**Statut à connaître.** Contrairement à AODV (RFC 3561) et OLSR (RFC 3626), ZRP n'a **jamais été publié en RFC** : le document IETF correspondant est resté à l'état de draft et a expiré en 2002. C'est une précision utile — elle explique pourquoi les protocoles hybrides restent surtout une catégorie conceptuelle, commode pour classer les approches, plutôt qu'un choix d'ingénierie que l'on rencontre sur le terrain. Dans l'IoT contraint, la place qu'ils visaient est occupée par [[RPL]].\n\n## Notions liées\n\n- [[Routage dans les réseaux ad-hoc]]\n- [[Protocoles proactifs (OLSR)]]\n- [[Protocoles réactifs (AODV)]]\n- [[RPL]]\n\n---\n*Chapitre 3 — La communication dans les réseaux de capteurs. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Combinent les deux approches : proactif à l'intérieur d'une zone locale, réactif au-delà, pour les destinations lointaines et rares.","links":["RPL","Routage dans les réseaux ad-hoc","Protocoles proactifs (OLSR)","Protocoles réactifs (AODV)"]},{"title":"Protocoles proactifs (OLSR)","folder":"03-Communication-et-routage","type":"protocole","chapter":"3 - La communication dans les réseaux de capteurs","tags":["reseaux-de-capteurs","chapitre-3","protocole"],"body":"# Protocoles proactifs (OLSR)\n\n> **Définition.** Protocoles table-driven qui maintiennent en permanence, dans chaque nœud, une table de routage à jour vers toutes les destinations possibles.\n\n**Avantage** : la route est immédiatement disponible, latence minimale. **Inconvénient** : le maintien permanent des tables consomme bande passante et énergie même sans trafic — peu efficace si les communications sont rares. **Exemple : OLSR** (Optimized Link State Routing), qui optimise la diffusion des messages de contrôle grâce aux relais multipoints (MPR).\n\n## Comment choisir entre proactif et réactif\n\n| Situation | Famille adaptée | Pourquoi |\n|---|---|---|\n| Trafic dense et continu | proactif | les tables entretenues sont amorties par l'usage |\n| Trafic sporadique, quelques messages par heure | réactif | rien ne circule quand rien n'a besoin de circuler |\n| Topologie stable (nœuds fixes) | proactif, ou RPL | les routes calculées restent valables longtemps |\n| Topologie mobile (drones, véhicules) | réactif | les tables proactives seraient périmées avant d'être utiles |\n| Trafic essentiellement montant vers une passerelle | **RPL** | l'arbre de collecte est la structure exacte du besoin |\n| Latence critique sur un voisinage restreint | hybride (ZRP) | proactif localement, réactif au loin |\n\n**À retenir.** Le critère n'est pas « quel protocole est le meilleur » mais le rapport entre le coût du trafic de contrôle et le volume de trafic utile. Pour les WSN, où le trafic est rare et monte vers un unique point, ce raisonnement conduit presque toujours à [[RPL]].\n\n## Références\n\n- RFC 3626 — OLSR. Révisé par la RFC 7181 (OLSRv2).\n\n## Notions liées\n\n- [[Routage dans les réseaux ad-hoc]]\n- [[Protocoles réactifs (AODV)]]\n- [[Protocoles hybrides (ZRP)]]\n- [[RPL]]\n\n---\n*Chapitre 3 — La communication dans les réseaux de capteurs. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Protocoles table-driven qui maintiennent en permanence, dans chaque nœud, une table de routage à jour vers toutes les destinations possibles.","links":["RPL","Routage dans les réseaux ad-hoc","Protocoles réactifs (AODV)","Protocoles hybrides (ZRP)"]},{"title":"Protocoles réactifs (AODV)","folder":"03-Communication-et-routage","type":"protocole","chapter":"3 - La communication dans les réseaux de capteurs","tags":["reseaux-de-capteurs","chapitre-3","protocole"],"body":"# Protocoles réactifs (AODV)\n\n> **Définition.** Protocoles on-demand qui ne calculent une route que lorsqu'un nœud a effectivement quelque chose à envoyer.\n\nLa recherche de route se fait par inondation d'une requête (*Route Request*) jusqu'à atteindre la destination, qui répond (*Route Reply*). **Avantage** : pas de trafic de contrôle inutile en l'absence de communication, économe quand le trafic est sporadique. **Inconvénient** : latence initiale à chaque nouvelle route, l'inondation coûte de l'énergie. **Exemple : AODV** (Ad-hoc On-demand Distance Vector), qui ne conserve que les routes actives.\n\n## Schéma\n\n```mermaid\nsequenceDiagram\n    participant S as S (source)\n    participant R1 as Relais 1\n    participant R2 as Relais 2\n    participant D as D (destination)\n    S->>R1: RREQ diffusé\n    S->>R2: RREQ diffusé\n    R1->>D: RREQ ré-inondé\n    R2->>D: RREQ dupliqué, ignoré\n    D-->>R1: RREP unicast sur la route inverse\n    R1-->>S: RREP\n    Note over S,D: Latence initiale = prix du réactif, puis la route sert directement\n```\n\nLe diagramme rend visibles les deux inconvénients annoncés : le RREQ atteint la destination par plusieurs chemins et une partie des copies est jetée — c'est l'énergie dépensée par l'inondation — et rien ne circule utilement avant le retour du RREP.\n\n## Références\n\n- RFC 3561 — AODV.\n\n## Notions liées\n\n- [[Routage dans les réseaux ad-hoc]]\n- [[Protocoles proactifs (OLSR)]]\n- [[Protocoles hybrides (ZRP)]]\n- [[Nœuds fixes et nœuds mobiles]]\n\n---\n*Chapitre 3 — La communication dans les réseaux de capteurs. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Protocoles on-demand qui ne calculent une route que lorsqu'un nœud a effectivement quelque chose à envoyer.","links":["Routage dans les réseaux ad-hoc","Protocoles proactifs (OLSR)","Protocoles hybrides (ZRP)","Nœuds fixes et nœuds mobiles"]},{"title":"RPL","folder":"03-Communication-et-routage","type":"protocole","chapter":"3 - La communication dans les réseaux de capteurs","tags":["reseaux-de-capteurs","chapitre-3","protocole"],"body":"# RPL\n\n> **Définition.** Routing Protocol for Low-power and Lossy networks : protocole de routage standardisé par l'IETF pour les réseaux IPv6/6LoWPAN contraints, organisé en arbre orienté (DODAG) enraciné sur la passerelle.\n\nChaque nœud choisit un « parent » vers la racine selon une fonction d'objectif (qualité de lien, nombre de sauts, énergie résiduelle). RPL est particulièrement adapté au schéma dominant des WSN, où l'essentiel du trafic remonte des capteurs vers la passerelle (arbre de collecte).\n\n## Schéma\n\n```mermaid\nflowchart BT\n    E[\"E · rank 4\"] -->|parent préféré| D[\"D · rank 3\"]\n    C[\"C · rank 3\"] --> A[\"A · rank 2\"]\n    D --> A\n    A --> ROOT([Racine = passerelle · rank 1])\n    B[\"B · rank 2\"] --> ROOT\n    D -.->|parent de secours| B\n    E -.-> C\n```\n\nTrait plein : parent préféré, choisi par la fonction d'objectif. Trait pointillé : parent de secours, utilisé si le lien préféré se dégrade — c'est la redondance des chemins décrite dans [[Mécanismes de résilience]].\n\nLe **rank** croît à mesure qu'on s'éloigne de la racine ; il interdit les boucles, puisqu'un nœud ne choisit jamais un parent de rank supérieur au sien.\n\n## Les quatre messages de contrôle\n\n| Message | Sens | Rôle |\n|---|---|---|\n| **DIO** — DODAG Information Object | descend de la racine | construit et entretient l'arbre, diffuse le rank et la fonction d'objectif |\n| **DIS** — DODAG Information Solicitation | émis par un nœud | demande un DIO pour rejoindre un DODAG existant |\n| **DAO** — Destination Advertisement Object | remonte vers la racine | installe les routes descendantes vers un nœud |\n| **DAO-ACK** | descend | acquitte un DAO |\n\nLa diffusion des DIO est régulée par un **timer Trickle** : très fréquent quand la topologie bouge, il s'espace exponentiellement quand le réseau est stable — un mécanisme d'économie d'énergie à part entière.\n\nDeux modes de fonctionnement : **storing**, où chaque routeur mémorise les routes de son sous-arbre, et **non-storing**, où seule la racine tient la table complète et insère un en-tête de routage source. Le mode non-storing économise la mémoire des nœuds, au prix d'en-têtes plus gros.\n\n**Exemple.** Un réseau de prévention incendie composé de capteurs fixes remontant périodiquement des mesures vers une passerelle relève d'un routage de type arbre de collecte (RPL) ou d'une simple étoile LoRaWAN. Un scénario avec des drones de surveillance mobiles relève au contraire d'un routage réactif (AODV), car la topologie change à chaque passage.\n\n## Références\n\n- RFC 6550 — RPL.\n- RFC 6552 — fonction d'objectif OF0 (nombre de sauts).\n- RFC 6719 — fonction d'objectif MRHOF, qui utilise par défaut la métrique ETX.\n- RFC 6206 — algorithme Trickle.\n\n## Notions liées\n\n- [[6LoWPAN]]\n- [[Routage dans les réseaux ad-hoc]]\n- [[Passerelle (gateway)]]\n- [[Nœuds fixes et nœuds mobiles]]\n- [[Mécanismes de résilience]]\n- [[Qualité de lien (PRR, ETX, RSSI, LQI)]]\n- [[Sécurité des réseaux de capteurs]]\n\n---\n*Chapitre 3 — La communication dans les réseaux de capteurs. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Routing Protocol for Low-power and Lossy networks : protocole de routage standardisé par l'IETF pour les réseaux IPv6/6LoWPAN contraints, organisé en arbre orienté (DODAG) enraciné","links":["Mécanismes de résilience","6LoWPAN","Routage dans les réseaux ad-hoc","Passerelle (gateway)","Nœuds fixes et nœuds mobiles","Qualité de lien (PRR, ETX, RSSI, LQI)","Sécurité des réseaux de capteurs"]},{"title":"Routage dans les réseaux ad-hoc","folder":"03-Communication-et-routage","type":"concept","chapter":"3 - La communication dans les réseaux de capteurs","tags":["reseaux-de-capteurs","chapitre-3","concept"],"body":"# Routage dans les réseaux ad-hoc\n\n> **Définition.** Détermination du chemin de nœuds relais qu'un paquet doit emprunter pour atteindre sa destination, rendue difficile par une topologie changeante et des ressources rares.\n\nOn classe les protocoles en deux grandes familles, plus une hybride : les protocoles **proactifs** (tables toujours à jour), **réactifs** (routes calculées à la demande) et **hybrides** (proactif localement, réactif au loin). Pour l'IoT IPv6 contraint, le protocole de référence est **RPL**.\n\n## Notions liées\n\n- [[Réseau ad-hoc (MANET)]]\n- [[Protocoles proactifs (OLSR)]]\n- [[Protocoles réactifs (AODV)]]\n- [[Protocoles hybrides (ZRP)]]\n- [[RPL]]\n\n---\n*Chapitre 3 — La communication dans les réseaux de capteurs. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Détermination du chemin de nœuds relais qu'un paquet doit emprunter pour atteindre sa destination, rendue difficile par une topologie changeante et des ressources rares.","links":["Réseau ad-hoc (MANET)","Protocoles proactifs (OLSR)","Protocoles réactifs (AODV)","Protocoles hybrides (ZRP)","RPL"]},{"title":"Réseau ad-hoc (MANET)","folder":"03-Communication-et-routage","type":"concept","chapter":"3 - La communication dans les réseaux de capteurs","tags":["reseaux-de-capteurs","chapitre-3","concept"],"body":"# Réseau ad-hoc (MANET)\n\n> **Définition.** Réseau sans fil qui se forme spontanément, sans infrastructure préexistante, les nœuds jouant eux-mêmes le rôle de routeurs. Mobile Ad-hoc NETwork (MANET) quand les nœuds sont mobiles.\n\nLes réseaux de capteurs sont, par nature, très proches des réseaux ad-hoc :\n- **Auto-organisation** : découverte de voisins, construction des routes sans intervention humaine.\n- **Absence d'infrastructure** : chaque nœud est terminal *et* routeur.\n- **Topologie dynamique** : les liens apparaissent et disparaissent (mobilité, pannes, variations radio).\n- **Communication multi-saut** : deux nœuds éloignés dialoguent via une chaîne de relais intermédiaires.\n\n## Notions liées\n\n- [[Topologie maillée (mesh)]]\n- [[Nœuds fixes et nœuds mobiles]]\n- [[Routage dans les réseaux ad-hoc]]\n\n## Mentionné par\n\n- [[Mécanismes de résilience]]\n\n---\n*Chapitre 3 — La communication dans les réseaux de capteurs. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Réseau sans fil qui se forme spontanément, sans infrastructure préexistante, les nœuds jouant eux-mêmes le rôle de routeurs. Mobile Ad-hoc NETwork (MANET) quand les nœuds sont mobi","links":["Topologie maillée (mesh)","Nœuds fixes et nœuds mobiles","Routage dans les réseaux ad-hoc","Mécanismes de résilience"]},{"title":"Thread","folder":"03-Communication-et-routage","type":"technologie","chapter":"3 - La communication dans les réseaux de capteurs","tags":["reseaux-de-capteurs","chapitre-3","technologie"],"body":"# Thread\n\n> **Définition.** Technologie plus récente, construite sur 802.15.4 et 6LoWPAN, qui offre un maillage IPv6 natif sans point unique de défaillance.\n\nElle gagne du terrain dans la maison connectée, en s'appuyant directement sur l'adressabilité IPv6 apportée par 6LoWPAN plutôt que sur une pile propriétaire comme Zigbee.\n\n## Notions liées\n\n- [[IEEE 802.15.4]]\n- [[6LoWPAN]]\n- [[Topologie maillée (mesh)]]\n- [[Zigbee]]\n\n---\n*Chapitre 3 — La communication dans les réseaux de capteurs. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Technologie plus récente, construite sur 802.15.4 et 6LoWPAN, qui offre un maillage IPv6 natif sans point unique de défaillance.","links":["IEEE 802.15.4","6LoWPAN","Topologie maillée (mesh)","Zigbee"]},{"title":"Zigbee","folder":"03-Communication-et-routage","type":"technologie","chapter":"3 - La communication dans les réseaux de capteurs","tags":["reseaux-de-capteurs","chapitre-3","technologie"],"body":"# Zigbee\n\n> **Définition.** Pile réseau construite sur IEEE 802.15.4, ajoutant les couches réseau et application avec un routage mesh.\n\nTrès utilisée en domotique et en automatisation de bâtiment. Faible débit, faible portée individuelle, mais réseau maillé étendu et très basse consommation.\n\n## Notions liées\n\n- [[IEEE 802.15.4]]\n- [[Topologie maillée (mesh)]]\n- [[Thread]]\n\n---\n*Chapitre 3 — La communication dans les réseaux de capteurs. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Pile réseau construite sur IEEE 802.15.4, ajoutant les couches réseau et application avec un routage mesh.","links":["IEEE 802.15.4","Topologie maillée (mesh)","Thread"]},{"title":"Agrégation de données","folder":"04-Energie-et-fiabilite","type":"concept","chapter":"4 - Économie d'énergie et tolérance aux pannes","tags":["reseaux-de-capteurs","chapitre-4","concept"],"body":"# Agrégation de données\n\n> **Définition.** Plutôt que de faire remonter chaque mesure brute, un nœud (ou un chef de cluster) combine les mesures de plusieurs sources en une valeur synthétique et ne transmet que celle-ci.\n\nC'est l'un des grands intérêts de la topologie hiérarchique. Second levier voisin : la **compression et le filtrage local**, qui consiste à ne transmettre que ce qui change (transmission événementielle plutôt que périodique) ou à compresser les données avant envoi. On peut aussi économiser en ajustant la puissance d'émission au strict nécessaire, et en choisissant des routes économes en énergie qui ménagent les nœuds à faible batterie plutôt que le plus court chemin.\n\n**Exemple.** Dans un vignoble, plutôt que d'envoyer chaque minute la mesure de 20 capteurs d'humidité d'une même parcelle, le chef de cluster peut n'envoyer que la moyenne et l'écart-type par quart d'heure, plus une alerte immédiate si un capteur passe sous un seuil critique. Le volume transmis — et donc l'énergie — est divisé par un facteur important, sans perte d'information utile à la décision.\n\n**À retenir.** Trois leviers d'économie à connaître : duty cycling (éteindre la radio au maximum), agrégation (calculer localement pour transmettre moins) et energy harvesting (recharger depuis l'environnement). Le premier est le plus universel et le plus puissant.\n\n## Notions liées\n\n- [[Topologie hiérarchique (clusters)]]\n- [[Unité de traitement]]\n- [[Duty cycling]]\n- [[Mécanismes de résilience]]\n\n---\n*Chapitre 4 — Économie d'énergie et tolérance aux pannes. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Plutôt que de faire remonter chaque mesure brute, un nœud (ou un chef de cluster) combine les mesures de plusieurs sources en une valeur synthétique et ne transmet que celle-ci.","links":["Topologie hiérarchique (clusters)","Unité de traitement","Duty cycling","Mécanismes de résilience"]},{"title":"Budget énergétique d'un nœud","folder":"04-Energie-et-fiabilite","type":"concept","chapter":"4 - Économie d'énergie et tolérance aux pannes","tags":["reseaux-de-capteurs","chapitre-4","concept"],"body":"# Budget énergétique d'un nœud\n\n> **Définition.** Estimation de l'autonomie d'un nœud à partir de la capacité de sa source d'énergie et de sa consommation moyenne : T_vie ≈ C / I_moy.\n\nUn nœud consomme dans quatre activités, très inégalement : la **communication radio** (de loin le premier poste, en émission comme en écoute), la **capture** (variable selon le capteur), le **calcul** (relativement peu coûteux) et les **fuites au repos** (faible mais permanent).\n\nLe courant moyen se calcule en pondérant les courants de chaque état (émission, écoute, mesure, sommeil) par le temps passé dans chacun : I_moy = Σ(Iᵢ·tᵢ) / Σtᵢ.\n\n## Le calcul complet, avec des valeurs de datasheet\n\nNœud LoRa équipé d'un SX1276, une mesure par minute, pile de 2400 mAh.\n\n| État | Courant | Durée par cycle | Charge |\n|---|---|---|---|\n| Sommeil profond | 0,005 mA | 59,79 s | 0,299 mA·s |\n| Mesure (MCU + capteur) | 5 mA | 100 ms | 0,500 mA·s |\n| Émission SF7, 20 octets, +13 dBm | 29 mA | 62 ms | 1,798 mA·s |\n| Fenêtres de réception, classe A | 10,8 mA | 50 ms | 0,540 mA·s |\n| **Total sur un cycle de 60 s** | | **60 s** | **3,137 mA·s** |\n\n- I_moy = 3,137 / 60 ≈ **0,052 mA**\n- T_vie = 2400 mAh / 0,052 mA ≈ 46 000 h ≈ **5,2 ans**\n- Rapport cyclique hors sommeil ≈ **0,35 %**\n\nCe que le tableau montre et que la formule seule ne montre pas : le sommeil occupe 99,65 % du temps mais moins de 10 % de la charge, tandis que la radio occupe 0,18 % du temps et près de 75 % de la charge. Voir le graphique dans [[Duty cycling]].\n\n**Contre-exemple à faire calculer.** Si on laissait la radio en écoute permanente à 10,8 mA, l'autonomie tomberait à 2400 / 10,8 ≈ 222 h, soit **neuf jours** au lieu de cinq ans. Le rapport est de plus de deux cents : voilà pourquoi le duty cycling est vital.\n\n**Variante à faire calculer.** Passer en SF12 pour gagner de la portée allonge le temps d'antenne de 62 ms à environ 1,5 s. La charge d'émission passe de 1,8 à 43,5 mA·s, I_moy à ≈ 0,74 mA, et l'autonomie tombe sous les **quatre mois**. La portée se paie en énergie — la boucle est refermée avec [[Compromis portée-débit-consommation]].\n\n**À retenir.** Le poste dominant est la radio — non seulement en émission, mais aussi en écoute. Une radio allumée « au cas où » vide la batterie aussi sûrement qu'une radio qui émet. Toute la stratégie d'économie d'énergie consiste donc à éteindre la radio le plus souvent possible.\n\n## Notions liées\n\n- [[Unité de communication (transceiver)]]\n- [[Unité d'alimentation]]\n- [[Duty cycling]]\n- [[Compromis portée-débit-consommation]]\n- [[Le fil rouge de l'énergie]]\n\n---\n*Chapitre 4 — Économie d'énergie et tolérance aux pannes. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Estimation de l'autonomie d'un nœud à partir de la capacité de sa source d'énergie et de sa consommation moyenne : Tvie ≈ C / Imoy.","links":["Duty cycling","Compromis portée-débit-consommation","Unité de communication (transceiver)","Unité d'alimentation","Le fil rouge de l'énergie"]},{"title":"Chapitre 4 - Économie d'énergie et tolérance aux pannes","folder":"04-Energie-et-fiabilite","type":"moc","chapter":"","tags":["reseaux-de-capteurs","moc","chapitre-4"],"body":"# Chapitre 4 - Économie d'énergie et tolérance aux pannes\n\nNotions du chapitre 4 — *Économie d'énergie et tolérance aux pannes*.\n\n- [[Budget énergétique d'un nœud]] — Estimation de l'autonomie d'un nœud à partir de la capacité de sa source d'énergie et de sa consommation moyenne : T_vie ≈ C / I_moy.\n- [[Duty cycling]] — Fait alterner le nœud entre un état actif (radio et capteurs allumés) et un état de sommeil profond, en maximisant le temps de sommeil. Le rapport cyclique (duty cycle) est la fraction de temps passée en état actif.\n- [[Agrégation de données]] — Plutôt que de faire remonter chaque mesure brute, un nœud (ou un chef de cluster) combine les mesures de plusieurs sources en une valeur synthétique et ne transmet que celle-ci.\n- [[Récupération d'énergie (energy harvesting)]] — Capter de l'énergie dans l'environnement du nœud pour recharger sa réserve : solaire, cinétique, thermique, ou radiofréquence.\n- [[Tolérance aux pannes]] — Capacité d'un réseau à continuer de fournir son service, éventuellement en mode dégradé, en dépit de la défaillance d'une partie de ses composants (nœuds, liens, passerelle).\n- [[Mécanismes de résilience]] — Ensemble des parades qui permettent à un WSN d'encaisser la perte de composants : redondance spatiale, redondance des chemins, auto-guérison, redondance de la passerelle, agrégation résiliente.\n\n## Compléments rattachés à ce chapitre\n\n- [[Le fil rouge de l'énergie]] — note transversale : tous les endroits où le cours revient sur son principe directeur.\n- [[Couche MAC et accès au canal (CSMA-CA)]] — pourquoi faire dormir un nœud n'est pas gratuit.\n- [[TSCH]] — rendre le rapport cyclique déterministe.\n- [[LEACH]] — faire tourner un rôle coûteux en énergie plutôt que mieux le choisir.\n- [[Sécurité des réseaux de capteurs]] — le *denial of sleep*, attaque qui vise directement le budget énergétique.\n\n## Voir aussi\n\n- [[Accueil]]\n- [[Chapitre 1 - Introduction, architectures et applications]]\n- [[Chapitre 2 - Adressage et protocole IPv6]]\n- [[Chapitre 3 - La communication dans les réseaux de capteurs]]\n- [[Compléments hors support]]","excerpt":"Notions du chapitre 4 — Économie d'énergie et tolérance aux pannes.","links":["Budget énergétique d'un nœud","Duty cycling","Agrégation de données","Récupération d'énergie (energy harvesting)","Tolérance aux pannes","Mécanismes de résilience","Le fil rouge de l'énergie","Couche MAC et accès au canal (CSMA-CA)","TSCH","LEACH","Sécurité des réseaux de capteurs","Accueil","Chapitre 1 - Introduction, architectures et applications","Chapitre 2 - Adressage et protocole IPv6","Chapitre 3 - La communication dans les réseaux de capteurs","Compléments hors support"]},{"title":"Duty cycling","folder":"04-Energie-et-fiabilite","type":"concept","chapter":"4 - Économie d'énergie et tolérance aux pannes","tags":["reseaux-de-capteurs","chapitre-4","concept"],"body":"# Duty cycling\n\n> **Définition.** Fait alterner le nœud entre un état actif (radio et capteurs allumés) et un état de sommeil profond, en maximisant le temps de sommeil. Le rapport cyclique (duty cycle) est la fraction de temps passée en état actif.\n\nOn cherche à rendre le duty cycle le plus faible possible (souvent bien en dessous de 1 %). La difficulté est la **coordination** : si un nœud dort, ses voisins ne peuvent pas lui parler — il faut synchroniser les réveils. Les protocoles MAC dédiés aux WSN gèrent ce problème par :\n- **l'échantillonnage du canal** (*Low-Power Listening*) : réveil très bref à intervalles réguliers pour vérifier si quelqu'un veut parler au nœud ;\n- **l'ordonnancement synchronisé** : les nœuds s'accordent sur des créneaux communs de réveil (S-MAC, ou [[TSCH]] — Time-Slotted Channel Hopping — utilisé dans l'industrie).\n\n## Schéma\n\n```mermaid\nxychart-beta\n    title \"Part de l'énergie consommée par état, sur un cycle de 60 s\"\n    x-axis [\"Sommeil 99,65 % du temps\", \"Mesure 0,17 %\", \"Réception 0,08 %\", \"Émission 0,10 %\"]\n    y-axis \"% de l'énergie du cycle\" 0 --> 60\n    bar [9.5, 15.9, 17.2, 57.3]\n```\n\nLes barres donnent la part de l'**énergie** ; l'étiquette sous chaque barre donne la part du **temps**. Lire les deux ensemble : le sommeil occupe 99,65 % du temps pour moins de 10 % de l'énergie, la radio 0,18 % du temps pour **74 % de l'énergie**. Les valeurs viennent du calcul détaillé dans [[Budget énergétique d'un nœud]].\n\nC'est ce renversement qui justifie tout le chapitre : optimiser ce qui occupe le temps ne sert à rien, il faut optimiser ce qui consomme la charge.\n\n**Le coût caché de la coordination.** Faire dormir un nœud ne suffit pas : il faut que l'émetteur sache quand il écoute. Le Low-Power Listening reporte le coût sur l'émetteur, qui doit envoyer un préambule assez long pour couvrir la période de réveil du récepteur. L'ordonnancement synchronisé supprime ce préambule mais exige une synchronisation d'horloges, donc un trafic de contrôle périodique. Il n'y a pas de repas gratuit — voir [[Couche MAC et accès au canal (CSMA-CA)]].\n\n## Notions liées\n\n- [[Budget énergétique d'un nœud]]\n- [[Unité de communication (transceiver)]]\n- [[Agrégation de données]]\n- [[Récupération d'énergie (energy harvesting)]]\n- [[Couche MAC et accès au canal (CSMA-CA)]]\n- [[TSCH]]\n\n---\n*Chapitre 4 — Économie d'énergie et tolérance aux pannes. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Fait alterner le nœud entre un état actif (radio et capteurs allumés) et un état de sommeil profond, en maximisant le temps de sommeil. Le rapport cyclique (duty cycle) est la frac","links":["TSCH","Budget énergétique d'un nœud","Couche MAC et accès au canal (CSMA-CA)","Unité de communication (transceiver)","Agrégation de données","Récupération d'énergie (energy harvesting)"]},{"title":"Mécanismes de résilience","folder":"04-Energie-et-fiabilite","type":"concept","chapter":"4 - Économie d'énergie et tolérance aux pannes","tags":["reseaux-de-capteurs","chapitre-4","concept"],"body":"# Mécanismes de résilience\n\n> **Définition.** Ensemble des parades qui permettent à un WSN d'encaisser la perte de composants : redondance spatiale, redondance des chemins, auto-guérison, redondance de la passerelle, agrégation résiliente.\n\n- **Redondance spatiale** : déployer plus de nœuds que le strict minimum, avec recouvrement des zones de mesure, pour que la perte d'un nœud ne crée pas de « trou » de couverture. La parade la plus directe, au prix du surcoût matériel.\n- **Redondance des chemins** : dans une topologie maillée, maintenir plusieurs routes possibles vers la passerelle. Si un relais tombe, le trafic bascule sur une route alternative — l'atout majeur du mesh sur l'étoile.\n- **Auto-guérison (self-healing)** : le réseau détecte automatiquement la disparition d'un nœud (absence de réponse, *keep-alive* manquants) et réorganise ses routes ou reconstitue ses clusters sans intervention humaine. Les protocoles ad-hoc et RPL intègrent cette reconfiguration.\n- **Redondance de la passerelle** : point critique du réseau ; on prévoit une passerelle de secours ou plusieurs passerelles pour les systèmes critiques (comme en LoRaWAN, où un même message peut être reçu par plusieurs gateways).\n- **Agrégation résiliente** : concevoir l'agrégation pour qu'elle reste correcte même si quelques nœuds manquent (une moyenne sur 18 capteurs au lieu de 20 reste exploitable).\n\n## Schéma — panne, puis parade\n\n```mermaid\nflowchart LR\n    P1[Batterie épuisée\u003cbr/>ou nœud détruit] --> R1[Redondance spatiale\u003cbr/>+ recouvrement de couverture]\n    P2[Lien radio dégradé\u003cbr/>ou relais perdu] --> R2[Redondance des chemins\u003cbr/>parent de secours RPL]\n    P3[Topologie modifiée] --> R3[Auto-guérison :\u003cbr/>keep-alive + reconfiguration]\n    P4[Passerelle en panne] --> R4[Passerelle de secours\u003cbr/>ou passerelles multiples]\n    P5[Nœuds manquants\u003cbr/>dans un cluster] --> R5[Agrégation résiliente :\u003cbr/>moyenne sur 18 au lieu de 20]\n```\n\nLu de gauche à droite, le schéma est une grille de conception : pour chaque mode de défaillance identifié, une parade et son coût. Lu en masquant la colonne de droite, c'est un exercice.\n\n**Ce que la résilience ne couvre pas.** Toutes ces parades traitent la panne **accidentelle**. Un nœud capturé et reprogrammé par un attaquant reste, lui, parfaitement vivant du point de vue du réseau : il répond aux keep-alive, il annonce des routes. L'auto-guérison ne le détectera pas — voir [[Sécurité des réseaux de capteurs]].\n\n## Notions liées\n\n- [[Tolérance aux pannes]]\n- [[Topologie maillée (mesh)]]\n- [[Passerelle (gateway)]]\n- [[RPL]]\n- [[Agrégation de données]]\n- [[Réseau ad-hoc (MANET)]]\n- [[Sécurité des réseaux de capteurs]]\n\n---\n*Chapitre 4 — Économie d'énergie et tolérance aux pannes. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Ensemble des parades qui permettent à un WSN d'encaisser la perte de composants : redondance spatiale, redondance des chemins, auto-guérison, redondance de la passerelle, agrégatio","links":["Sécurité des réseaux de capteurs","Tolérance aux pannes","Topologie maillée (mesh)","Passerelle (gateway)","RPL","Agrégation de données","Réseau ad-hoc (MANET)"]},{"title":"Récupération d'énergie (energy harvesting)","folder":"04-Energie-et-fiabilite","type":"concept","chapter":"4 - Économie d'énergie et tolérance aux pannes","tags":["reseaux-de-capteurs","chapitre-4","concept"],"body":"# Récupération d'énergie (energy harvesting)\n\n> **Définition.** Capter de l'énergie dans l'environnement du nœud pour recharger sa réserve : solaire, cinétique, thermique, ou radiofréquence.\n\nBien dimensionnée, elle peut rendre un nœud énergétiquement autonome à vie. Elle change la logique de conception : on ne cherche plus seulement à minimiser la consommation, mais à équilibrer la consommation moyenne avec l'énergie récoltée disponible, qui varie (la nuit, un capteur solaire ne récolte rien). Le nœud doit alors adapter son activité à son budget énergétique instantané (*energy-aware* / *energy-neutral operation*).\n\n## Notions liées\n\n- [[Unité d'alimentation]]\n- [[Budget énergétique d'un nœud]]\n- [[Duty cycling]]\n\n---\n*Chapitre 4 — Économie d'énergie et tolérance aux pannes. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Capter de l'énergie dans l'environnement du nœud pour recharger sa réserve : solaire, cinétique, thermique, ou radiofréquence.","links":["Unité d'alimentation","Budget énergétique d'un nœud","Duty cycling"]},{"title":"Tolérance aux pannes","folder":"04-Energie-et-fiabilite","type":"concept","chapter":"4 - Économie d'énergie et tolérance aux pannes","tags":["reseaux-de-capteurs","chapitre-4","concept"],"body":"# Tolérance aux pannes\n\n> **Définition.** Capacité d'un réseau à continuer de fournir son service, éventuellement en mode dégradé, en dépit de la défaillance d'une partie de ses composants (nœuds, liens, passerelle).\n\nDans un WSN, la panne n'est pas l'exception mais la **règle statistique** : avec des centaines de nœuds bon marché, déployés en environnement hostile, il est certain qu'à tout instant certains seront hors service (batterie épuisée, destruction physique, défaillance matérielle, perte temporaire du lien radio). La tolérance aux pannes n'est pas gratuite : la redondance augmente le nombre de nœuds (coût) et le trafic de surveillance (énergie) — l'ingénieur doit doser le niveau de résilience selon la **criticité** de l'application.\n\n**Exemple.** Vignoble : la perte ponctuelle de quelques capteurs d'humidité n'est pas grave (on interpole) — redondance légère suffisante. Prévention incendie : application critique, un trou de couverture peut laisser passer un départ de feu — forte redondance, chemins multiples, passerelle de secours indispensables. Site industriel : la maintenance prédictive tolère une perte temporaire, mais une alarme de sécurité doit être garantie.\n\n**À retenir.** Dans un WSN, on conçoit pour la panne, pas contre elle. Les parades : redondance (des nœuds, des chemins, de la passerelle) et auto-guérison (détection + reconfiguration automatique). Le bon niveau de tolérance se règle sur la criticité de l'application et se paie en coût et en énergie.\n\n## Notions liées\n\n- [[Mécanismes de résilience]]\n- [[Topologie maillée (mesh)]]\n\n---\n*Chapitre 4 — Économie d'énergie et tolérance aux pannes. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Capacité d'un réseau à continuer de fournir son service, éventuellement en mode dégradé, en dépit de la défaillance d'une partie de ses composants (nœuds, liens, passerelle).","links":["Mécanismes de résilience","Topologie maillée (mesh)"]},{"title":"CoAP","folder":"05-Complements","type":"protocole","chapter":"Compléments hors support","tags":["reseaux-de-capteurs","complement","protocole"],"body":"# CoAP\n\n> **Définition.** Constrained Application Protocol (RFC 7252) : protocole applicatif de type REST pour objets contraints, transporté sur UDP, avec un en-tête fixe de 4 octets. L'équivalent allégé de HTTP.\n\nCoAP est le dernier étage de la [[Pile protocolaire de l'IoT contraint]]. Il reprend le modèle de HTTP — des ressources identifiées par URI, manipulées par des méthodes — mais en supprimant tout ce qui ne tient pas dans une trame de 127 octets.\n\n## Ce qui change par rapport à HTTP\n\n| | HTTP/1.1 | CoAP |\n|---|---|---|\n| Transport | TCP | UDP |\n| En-tête | textuel, quelques centaines d'octets | binaire, 4 octets fixes |\n| Fiabilité | assurée par TCP | optionnelle, gérée par CoAP lui-même |\n| Découverte de ressources | hors protocole | `/.well-known/core` |\n| Notification de changement | polling ou WebSocket | *Observe* |\n| Sécurité | TLS | DTLS ou OSCORE |\n| Port par défaut | 80 / 443 | 5683 / 5684 (coaps) |\n\nLe choix d'UDP est le point clé : établir une connexion TCP demande trois échanges avant la première donnée utile, ce qui est prohibitif quand chaque transmission radio est le poste énergétique dominant.\n\n## Les quatre types de messages\n\n| Type | Sigle | Comportement |\n|---|---|---|\n| Confirmable | CON | retransmis avec repli exponentiel jusqu'à réception d'un ACK |\n| Non-confirmable | NON | émis une fois, sans garantie — pour une mesure périodique qu'un autre relèvement remplacera |\n| Acquittement | ACK | confirme un CON |\n| Reset | RST | signale un message reçu mais non traitable |\n\nCoAP reconstruit ainsi, en quelques octets, une fiabilité **à la carte** : c'est l'application qui décide message par message si la retransmission vaut son coût énergétique.\n\n## Deux extensions indispensables aux capteurs\n\n- **Observe** (RFC 7641) : le client s'abonne à une ressource, le serveur pousse une notification à chaque changement. Cela remplace le *polling*, donc supprime des transmissions inutiles — un gain énergétique direct.\n- **Transfert par blocs** (RFC 7959) : découpe une représentation trop grosse pour une trame en une série de blocs numérotés, au niveau applicatif. À ne pas confondre avec la fragmentation de [[6LoWPAN]], qui opère à la couche d'adaptation : le découpage par blocs est plus robuste, car la perte d'un bloc ne condamne pas tout le message.\n\n**À retenir.** CoAP applique au niveau applicatif la même logique que 6LoWPAN au niveau réseau : garder le modèle (REST, IPv6) et supprimer le poids. Sa vraie valeur pour un WSN n'est pas d'être « du HTTP en petit », c'est de rendre la fiabilité et la notification **négociables**, donc facturables en énergie.\n\n## Notions liées\n\n- [[Pile protocolaire de l'IoT contraint]]\n- [[6LoWPAN]]\n- [[IPv6]]\n- [[Sécurité des réseaux de capteurs]]\n\n---\n*Complément hors support. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Constrained Application Protocol (RFC 7252) : protocole applicatif de type REST pour objets contraints, transporté sur UDP, avec un en-tête fixe de 4 octets. L'équivalent allégé de","links":["Pile protocolaire de l'IoT contraint","6LoWPAN","IPv6","Sécurité des réseaux de capteurs"]},{"title":"Compléments hors support","folder":"05-Complements","type":"moc","chapter":"","tags":["reseaux-de-capteurs","moc","complement"],"body":"# Compléments hors support\n\nCes notions **ne figurent pas dans le support de cours** `26-27_COURS_IPG_INGE_Reseaux-capteurs-IM5RC-Support-complet.tex`. Elles ont été ajoutées au vault parce que le reste du cours les mobilise sans les avoir posées : la pile protocolaire cite CoAP, le duty cycling cite TSCH, la topologie hiérarchique cite LEACH, RPL cite la qualité de lien — et la sécurité n'apparaissait nulle part.\n\nElles sont regroupées ici plutôt que dispersées dans les quatre chapitres pour rester repérables, et pour que la structure du support reste lisible dans le vault. Si l'une d'elles rejoint le support LaTeX, sa note peut être déplacée dans le chapitre correspondant.\n\n## Les notions\n\n- [[Sécurité des réseaux de capteurs]] — confidentialité, intégrité, disponibilité sous contrainte d'octets et de microampères. AES-CCM\\* de 802.15.4, clés LoRaWAN, attaques génériques et attaques RPL, DTLS et OSCORE. **Le manque le plus net du support actuel.**\n- [[Couche MAC et accès au canal (CSMA-CA)]] — le problème des collisions, que le cours suppose sans l'énoncer. Prérequis du duty cycling et de TSCH.\n- [[CoAP]] — le dernier étage de la pile contrainte, cité dans deux notes sans avoir de page.\n- [[Qualité de lien (PRR, ETX, RSSI, LQI)]] — ce que mesure réellement la fonction d'objectif de RPL, et comment valider un déploiement.\n- [[TSCH]] — créneaux synchronisés et saut de canal : la variante déterministe de 802.15.4, celle des réseaux industriels.\n- [[LEACH]] — la rotation du rôle de chef de cluster, réponse au défaut de la topologie hiérarchique.\n- [[Le fil rouge de l'énergie]] — note transversale : tous les endroits où le cours revient sur son principe directeur.\n\n## Rattachement aux chapitres\n\n| Complément | Se greffe sur |\n|---|---|\n| Sécurité des réseaux de capteurs | chapitres 2, 3 et 4 |\n| Couche MAC et accès au canal | chapitres 3 et 4 |\n| CoAP | chapitre 2 |\n| Qualité de lien | chapitre 3 |\n| TSCH | chapitres 3 et 4 |\n| LEACH | chapitres 1 et 4 |\n| Le fil rouge de l'énergie | les quatre chapitres |\n\n## Voir aussi\n\n- [[Accueil]]\n- [[Chapitre 1 - Introduction, architectures et applications]]\n- [[Chapitre 2 - Adressage et protocole IPv6]]\n- [[Chapitre 3 - La communication dans les réseaux de capteurs]]\n- [[Chapitre 4 - Économie d'énergie et tolérance aux pannes]]","excerpt":"Ces notions ne figurent pas dans le support de cours 26-27COURSIPGINGEReseaux-capteurs-IM5RC-Support-complet.tex. Elles ont été ajoutées au vault parce que le reste du cours les mo","links":["Sécurité des réseaux de capteurs","Couche MAC et accès au canal (CSMA-CA)","CoAP","Qualité de lien (PRR, ETX, RSSI, LQI)","TSCH","LEACH","Le fil rouge de l'énergie","Accueil","Chapitre 1 - Introduction, architectures et applications","Chapitre 2 - Adressage et protocole IPv6","Chapitre 3 - La communication dans les réseaux de capteurs","Chapitre 4 - Économie d'énergie et tolérance aux pannes"]},{"title":"Couche MAC et accès au canal (CSMA-CA)","folder":"05-Complements","type":"concept","chapter":"Compléments hors support","tags":["reseaux-de-capteurs","complement","concept"],"body":"# Couche MAC et accès au canal (CSMA-CA)\n\n> **Définition.** La couche MAC arbitre l'accès à un canal radio partagé entre plusieurs nœuds. En IEEE 802.15.4, cet arbitrage repose sur CSMA-CA : écouter avant d'émettre, et attendre un délai aléatoire en cas de canal occupé.\n\nC'est la brique que le cours suppose sans l'énoncer : le [[Duty cycling]] et [[TSCH]] n'ont de sens que si l'on a d'abord posé le problème des **collisions**.\n\n## Le problème\n\nUne radio ne peut pas émettre et recevoir en même temps, et deux nœuds qui émettent simultanément dans la même zone produisent une **collision** : les deux trames sont perdues. Contrairement à Ethernet, une radio ne peut pas détecter la collision pendant qu'elle émet — d'où le « CA », *Collision Avoidance* : on cherche à les **éviter** plutôt qu'à les détecter.\n\n## CSMA-CA en 802.15.4\n\nLe mécanisme, dans le mode non fenêtré (*unslotted*), le plus courant en pratique :\n\n1. Tirer un délai d'attente aléatoire dans `[0, 2^BE − 1]` périodes de backoff.\n2. Attendre ce délai.\n3. Écouter le canal (CCA, *Clear Channel Assessment*).\n4. Si le canal est libre, émettre. Sinon, incrémenter `BE` et recommencer.\n5. Au bout de `macMaxCSMABackoffs` échecs, abandonner et remonter l'échec à la couche supérieure.\n\n| Paramètre | Valeur par défaut |\n|---|---|\n| `macMinBE` — exposant de backoff initial | 3 |\n| `macMaxBE` — exposant maximal | 5 |\n| `macMaxCSMABackoffs` | 4 |\n| `aUnitBackoffPeriod` | 20 symboles, soit 320 µs à 2,4 GHz et 400 µs à 868 MHz |\n\n## Deux modes, deux compromis\n\n- **Non-beacon** (`macBeaconOrder = 15`) : CSMA-CA non fenêtré, pas de synchronisation. Simple, mais latence non bornée. C'est le mode de Zigbee et des piles 6LoWPAN.\n- **Beacon-enabled** : le coordinateur découpe le temps en *superframes* — une balise, puis une période d'accès par contention (CAP) en CSMA-CA fenêtré, puis une période sans contention (CFP) où des créneaux garantis (GTS) sont réservés à des nœuds nommés. Latence bornée pour les nœuds qui ont un GTS, au prix d'une synchronisation permanente sur les balises.\n\n## Deux limites à connaître\n\n**Le terminal caché.** Deux nœuds A et C hors de portée l'un de l'autre, mais tous deux à portée de B : leurs CCA se déclarent libres, ils émettent, et B ne reçoit qu'une collision. 802.15.4 **n'implémente pas RTS/CTS**, donc ne résout pas ce problème au niveau MAC. C'est un argument fort pour les approches à créneaux comme [[TSCH]].\n\n**L'incompatibilité avec le sommeil.** CSMA-CA suppose un récepteur à l'écoute. Or un nœud en duty cycling dort. Deux réponses, deux coûts :\n\n| Approche | Le coût est porté par | Coût |\n|---|---|---|\n| *Low-Power Listening* — le récepteur échantillonne le canal | l'émetteur | préambule long, couvrant la période de réveil |\n| Ordonnancement synchronisé (S-MAC, TSCH) | tous les nœuds | synchronisation d'horloges, donc trafic de contrôle |\n\n**À retenir.** L'accès au canal et l'économie d'énergie tirent dans des directions opposées : écouter avant d'émettre suppose d'écouter, et écouter est le poste dominant du [[Budget énergétique d'un nœud]]. Tout protocole MAC de WSN est un arbitrage entre ces deux exigences.\n\n## Notions liées\n\n- [[IEEE 802.15.4]]\n- [[Duty cycling]]\n- [[TSCH]]\n- [[Budget énergétique d'un nœud]]\n- [[Qualité de lien (PRR, ETX, RSSI, LQI)]]\n- [[Pile protocolaire de l'IoT contraint]]\n\n---\n*Complément hors support. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"La couche MAC arbitre l'accès à un canal radio partagé entre plusieurs nœuds. En IEEE 802.15.4, cet arbitrage repose sur CSMA-CA : écouter avant d'émettre, et attendre un délai alé","links":["Duty cycling","TSCH","Budget énergétique d'un nœud","IEEE 802.15.4","Qualité de lien (PRR, ETX, RSSI, LQI)","Pile protocolaire de l'IoT contraint"]},{"title":"LEACH","folder":"05-Complements","type":"protocole","chapter":"Compléments hors support","tags":["reseaux-de-capteurs","complement","protocole"],"body":"# LEACH\n\n> **Définition.** Low-Energy Adaptive Clustering Hierarchy : protocole de clustering pour WSN qui fait **tourner** le rôle de chef de cluster entre les nœuds, par tirage aléatoire renouvelé à chaque *round*.\n\nLEACH est la réponse au défaut annoncé dans [[Topologie hiérarchique (clusters)]] : le chef de cluster agrège et transmet plus loin, donc se décharge plus vite. Si le rôle est fixe, le réseau meurt par ses chefs.\n\n## Le cycle\n\nChaque **round** comporte deux phases.\n\n**Phase de mise en place (setup).**\n1. Chaque nœud tire un nombre aléatoire et se déclare chef de cluster si ce nombre passe un seuil qui dépend du nombre de rounds déjà écoulés depuis sa dernière élection.\n2. Les chefs élus s'annoncent par diffusion.\n3. Chaque nœud restant rejoint le chef qu'il reçoit le mieux.\n4. Le chef construit un planning **TDMA** et l'envoie à ses membres.\n\n**Phase de régime établi (steady-state).**\nChaque membre émet dans son créneau TDMA — et dort le reste du temps, ce qui est le gain énergétique principal. Le chef agrège les mesures de son cluster et transmet le résultat directement à la station de base, à puissance plus élevée.\n\nPuis un nouveau round commence, avec de nouveaux chefs.\n\n## Les paramètres et les limites\n\nLe pourcentage souhaité de chefs de cluster est un paramètre du protocole : l'article d'origine retient **5 %** comme valeur optimale pour son modèle.\n\nLimites à connaître :\n- L'élection est **aléatoire**, donc ne tient compte ni de l'énergie résiduelle réelle, ni de la position : un nœud presque vide peut être élu, un cluster peut se retrouver sans chef bien placé.\n- Le chef transmet **directement** à la station de base : LEACH suppose donc que tout nœud peut l'atteindre, ce qui borne la taille du réseau.\n- Le coût de l'élection et de la reconstruction des clusters se paie à chaque round.\n\nCes limites ont produit une large descendance (LEACH-C, HEED, etc.) qui pondère l'élection par l'énergie restante.\n\n## Référence\n\nW. R. Heinzelman, A. Chandrakasan, H. Balakrishnan, « Energy-Efficient Communication Protocol for Wireless Microsensor Networks », *Proc. 33rd Hawaii International Conference on System Sciences* (HICSS-33), janvier 2000.\n\n**À retenir.** L'idée transposable au-delà de LEACH : quand un rôle coûte cher en énergie, la parade n'est pas de mieux choisir qui le tient, c'est de **le faire tourner**.\n\n## Notions liées\n\n- [[Topologie hiérarchique (clusters)]]\n- [[Agrégation de données]]\n- [[Budget énergétique d'un nœud]]\n- [[Mécanismes de résilience]]\n\n---\n*Complément hors support. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Low-Energy Adaptive Clustering Hierarchy : protocole de clustering pour WSN qui fait tourner le rôle de chef de cluster entre les nœuds, par tirage aléatoire renouvelé à chaque rou","links":["Topologie hiérarchique (clusters)","Agrégation de données","Budget énergétique d'un nœud","Mécanismes de résilience"]},{"title":"Le fil rouge de l'énergie","folder":"05-Complements","type":"moc","chapter":"Compléments hors support","tags":["reseaux-de-capteurs","complement","moc","transversal"],"body":"# Le fil rouge de l'énergie\n\n> **Idée directrice du cours.** Sur un nœud capteur, l'énergie est *la* ressource critique, et la radio en est le poste dominant. Presque toutes les décisions techniques du cours découlent de ce seul fait.\n\nCette note n'introduit aucune notion nouvelle : elle rassemble les endroits où le cours revient sur le même principe, chapitre après chapitre. À lire en fin de parcours, ou comme trame de révision.\n\n## Chapitre 1 — le constat\n\n- [[Unité de communication (transceiver)]] — l'émission coûte cher, **mais l'écoute presque autant**. C'est le point contre-intuitif d'où tout part.\n- [[Contraintes des réseaux de capteurs]] — l'énergie est posée comme la première des six contraintes.\n- [[Topologie hiérarchique (clusters)]] — la topologie la plus économe est celle qui permet d'agréger.\n\n## Chapitre 2 — l'adressage y répond déjà\n\n- [[6LoWPAN]] — comprimer les en-têtes, c'est transmettre moins d'octets, donc dépenser moins d'énergie. La compression n'est pas une élégance protocolaire, c'est une mesure d'économie.\n- [[Types d'adresses IPv6]] — IPv6 supprime le broadcast au profit du multicast, précisément pour ne pas réveiller inutilement tous les nœuds.\n- [[SLAAC]] — l'auto-configuration évite un serveur, donc du dialogue, donc des transmissions.\n\n## Chapitre 3 — le choix radio est un choix énergétique\n\n- [[Compromis portée-débit-consommation]] — le triangle : la portée se paie en puissance ou en temps d'antenne.\n- [[LoRa et LoRaWAN]] — monter en facteur d'étalement allonge le temps d'antenne, donc l'énergie par message.\n- [[RPL]] — le timer Trickle espace les messages de contrôle quand le réseau est stable ; la fonction d'objectif peut prendre l'énergie résiduelle comme critère.\n- [[Qualité de lien (PRR, ETX, RSSI, LQI)]] — minimiser l'ETX total revient à minimiser le nombre de transmissions, donc l'énergie.\n\n## Chapitre 4 — la stratégie\n\n- [[Budget énergétique d'un nœud]] — le calcul qui chiffre tout : 5 ans en dormant, 9 jours en écoutant.\n- [[Duty cycling]] — le levier le plus puissant, et le plus universel.\n- [[Agrégation de données]] — calculer localement pour transmettre moins.\n- [[Récupération d'énergie (energy harvesting)]] — changer de logique : équilibrer la consommation avec ce qu'on récolte.\n\n## Compléments — les limites du principe\n\n- [[Couche MAC et accès au canal (CSMA-CA)]] — écouter avant d'émettre suppose d'écouter : l'accès au canal et l'économie d'énergie s'opposent frontalement.\n- [[TSCH]] — rendre le rapport cyclique déterministe, au prix d'une synchronisation permanente.\n- [[Sécurité des réseaux de capteurs]] — la sécurité coûte des octets à transmettre ; et le *denial of sleep* est une attaque qui vise directement le budget énergétique.\n\n## La question à se poser sur toute décision de conception\n\n> Combien d'octets cela fait-il transmettre, et combien de temps cela laisse-t-il la radio allumée ?\n\nToutes les réponses du cours se ramènent à ces deux questions.\n\n## Notions liées\n\n- [[Réseau de capteurs sans fil (WSN)]]\n- [[Budget énergétique d'un nœud]]\n- [[Duty cycling]]\n- [[Compromis portée-débit-consommation]]\n\n---\n*Complément hors support. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Idée directrice du cours. Sur un nœud capteur, l'énergie est la ressource critique, et la radio en est le poste dominant. Presque toutes les décisions techniques du cours découlent","links":["Unité de communication (transceiver)","Contraintes des réseaux de capteurs","Topologie hiérarchique (clusters)","6LoWPAN","Types d'adresses IPv6","SLAAC","Compromis portée-débit-consommation","LoRa et LoRaWAN","RPL","Qualité de lien (PRR, ETX, RSSI, LQI)","Budget énergétique d'un nœud","Duty cycling","Agrégation de données","Récupération d'énergie (energy harvesting)","Couche MAC et accès au canal (CSMA-CA)","TSCH","Sécurité des réseaux de capteurs","Réseau de capteurs sans fil (WSN)"]},{"title":"Qualité de lien (PRR, ETX, RSSI, LQI)","folder":"05-Complements","type":"concept","chapter":"Compléments hors support","tags":["reseaux-de-capteurs","complement","concept"],"body":"# Qualité de lien (PRR, ETX, RSSI, LQI)\n\n> **Définition.** Ensemble des métriques qui quantifient la fiabilité d'un lien radio. Elles servent à choisir un parent de routage, à décider d'un placement de nœud, et à diagnostiquer un déploiement.\n\nLe cours parle de « qualité de lien » comme critère de la fonction d'objectif de [[RPL]] sans dire ce qui se mesure. Or c'est mesurable, et c'est ce qu'on lit sur le terrain.\n\n## Les quatre métriques\n\n| Métrique | Ce qu'elle mesure | Unité / plage | Limite |\n|---|---|---|---|\n| **RSSI** | puissance du signal reçu | dBm, typiquement −100 à −20 | ne dit rien du bruit ni des interférences |\n| **LQI** | qualité de la modulation reçue (802.15.4) | entier de 0 à 255 | définition laissée au constructeur, donc peu comparable |\n| **PRR** | taux de trames effectivement reçues | 0 à 1, ou % | statistique : demande du temps et du trafic |\n| **ETX** | nombre attendu de transmissions pour faire passer une trame | ≥ 1 | ne capte pas l'asymétrie de latence |\n\n**ETX** est la métrique de référence du routage :\n\n> ETX = 1 / (D_f × D_r)\n\noù `D_f` est la probabilité de succès aller et `D_r` la probabilité de succès retour. Un lien parfait vaut 1 ; un lien qui passe une fois sur deux dans chaque sens vaut 4. Sur un chemin multi-saut, les ETX **s'additionnent**, ce qui donne le bon critère : minimiser le nombre total de transmissions, donc l'énergie.\n\nC'est précisément la métrique que la fonction d'objectif **MRHOF** de RPL (RFC 6719) utilise par défaut, en l'absence d'autre métrique annoncée dans le DIO.\n\n## Pourquoi le nombre de sauts est un mauvais critère\n\nUn chemin de 2 sauts sur des liens médiocres (ETX 4 chacun, total 8) coûte plus cher qu'un chemin de 4 sauts sur de bons liens (ETX 1,2 chacun, total 4,8). Router au plus court nombre de sauts pousse justement vers les liens **longs**, donc faibles, donc coûteux en retransmissions. C'est le piège classique du déploiement de WSN, et la raison pour laquelle OF0 (nombre de sauts, RFC 6552) sert surtout de référence pédagogique.\n\n## La zone de transition\n\nEntre la zone où le lien passe presque toujours et celle où il ne passe jamais, il existe une **zone grise** (*transitional region*) où le PRR fluctue fortement d'un instant à l'autre, sans que le RSSI change beaucoup. Elle peut représenter une part importante de la portée nominale.\n\nConséquence pratique : un lien mesuré une fois à un instant donné n'est pas un lien caractérisé. Deux règles de déploiement en découlent — mesurer le PRR sur une durée, et **ne jamais dimensionner un réseau à la limite de portée annoncée**, mais avec une marge qui place les liens hors de la zone de transition.\n\n**À retenir.** RSSI est instantané et facile, ETX est statistique et pertinent. Un déploiement se valide au PRR mesuré dans le temps, pas au niveau de signal relevé une fois lors de la pose.\n\n## Notions liées\n\n- [[RPL]]\n- [[Couche MAC et accès au canal (CSMA-CA)]]\n- [[IEEE 802.15.4]]\n- [[Topologie maillée (mesh)]]\n- [[Contraintes des réseaux de capteurs]]\n\n---\n*Complément hors support. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Ensemble des métriques qui quantifient la fiabilité d'un lien radio. Elles servent à choisir un parent de routage, à décider d'un placement de nœud, et à diagnostiquer un déploieme","links":["RPL","Couche MAC et accès au canal (CSMA-CA)","IEEE 802.15.4","Topologie maillée (mesh)","Contraintes des réseaux de capteurs"]},{"title":"Sécurité des réseaux de capteurs","folder":"05-Complements","type":"concept","chapter":"Compléments hors support","tags":["reseaux-de-capteurs","complement","concept","securite"],"body":"# Sécurité des réseaux de capteurs\n\n> **Définition.** Ensemble des mécanismes qui garantissent la confidentialité, l'intégrité, l'authenticité et la disponibilité des données d'un WSN, sous la contrainte que chaque octet et chaque microampère comptent.\n\nUn WSN cumule les facteurs de risque : les nœuds sont **physiquement accessibles** (un capteur dans un vignoble se démonte à la pince), le médium radio est **écoutable et brouillable par nature**, et les ressources sont trop faibles pour la cryptographie asymétrique classique. La sécurité y est donc un problème de dimensionnement autant que de cryptographie.\n\n## Le coût de la sécurité, en octets\n\nC'est la particularité du domaine : le chiffrement ne coûte presque rien en calcul — AES est accéléré en matériel sur la quasi-totalité des transceivers modernes — mais il coûte cher en **place dans la trame**.\n\n| Poste | Coût |\n|---|---|\n| En-tête auxiliaire de sécurité 802.15.4 | 5 à 14 octets (contrôle, compteur de trames, identifiant de clé) |\n| MIC (code d'intégrité) | 4, 8 ou 16 octets |\n| **Surcoût courant** | **21 octets** sur les 127 de la trame |\n| Surcoût maximal | 30 octets |\n\nSur une trame de 127 octets, activer la sécurité consomme donc environ un sixième du budget. À croiser directement avec le tableau de [[6LoWPAN]] : c'est ce qui fait passer les données applicatives de 91 à 70 octets, et de 54 à 33 octets sans compression. **La sécurité et la compression d'en-tête ne sont pas deux sujets séparés : elles se disputent la même trame.**\n\n## Ce que fait IEEE 802.15.4\n\nLa sécurité est assurée au niveau MAC par **AES-CCM\\*** avec une clé AES-128, selon huit niveaux de sécurité configurables :\n\n| Niveau | Chiffrement | Authentification |\n|---|---|---|\n| 0x00 | non | non |\n| 0x01 à 0x03 | non | MIC de 32, 64 ou 128 bits |\n| 0x04 | oui (CTR) | non |\n| 0x05 à 0x07 | oui | MIC de 32, 64 ou 128 bits |\n\nLa protection contre le **rejeu** repose sur un compteur de trames monotone de 4 octets : un paquet dont le compteur est inférieur ou égal au dernier reçu est rejeté.\n\n## Ce que fait LoRaWAN\n\nDeux clés de session, ce qui donne une propriété importante : l'opérateur du réseau vérifie l'intégrité sans pouvoir lire les données.\n\n| Clé (LoRaWAN 1.0.x) | Rôle |\n|---|---|\n| **NwkSKey** | intégrité et authenticité du message au niveau réseau |\n| **AppSKey** | chiffrement de la charge utile, de bout en bout jusqu'au serveur applicatif |\n\nLes deux sont dérivées de l'**AppKey** racine lors du *join* OTAA, ou préprogrammées en ABP — mode plus simple mais nettement moins sûr, puisque les clés de session ne changent jamais. LoRaWAN 1.1 sépare les racines (NwkKey et AppKey) et introduit trois clés réseau distinctes (FNwkSIntKey, SNwkSIntKey, NwkSEncKey).\n\nAnti-rejeu : **DevNonce** côté terminal et **JoinNonce** côté serveur pour la procédure de join, compteurs **FCntUp** et **FCntDown** pour les messages de données.\n\n## Les attaques à connaître\n\n**Génériques aux WSN :**\n- **Brouillage** (*jamming*) — saturer le canal. Peu élégant, très efficace, indétectable par la cryptographie.\n- **Rejeu** — réémettre un message valide capté plus tôt. Contré par les compteurs de trames.\n- **Capture physique / nœud compromis** — récupérer un nœud, en extraire les clés, le reprogrammer. C'est l'attaque la plus spécifique au domaine, et celle contre laquelle la résilience classique ne protège pas : le nœud reste vivant aux yeux du réseau.\n- **Sybil** — un nœud se présente sous plusieurs identités pour peser plus lourd dans un vote ou une agrégation.\n- **Wormhole** — deux attaquants reliés par un lien rapide créent un raccourci artificiel et attirent le trafic.\n- **Selective forwarding** — un relais compromis transmet la plupart des paquets et jette silencieusement ceux qui le dérangent (par exemple les alarmes).\n- **Denial of sleep** — attaque proprement énergétique : maintenir la radio du nœud éveillée pour vider sa pile. Le nœud n'est jamais compromis, seulement épuisé. Elle vise exactement ce que le [[Duty cycling]] cherche à protéger.\n\n**Spécifiques à [[RPL]] :**\n- **Sinkhole** — un nœud annonce un rank artificiellement bas pour attirer tout le trafic du sous-arbre.\n- **Version number attack** — incrémenter le numéro de version du DODAG force une reconstruction complète de l'arbre, à répétition : coût énergétique massif.\n- **Rank attack** — manipuler son rank pour dégrader les routes.\n- **DAO insider attack** — injecter de faux DAO pour polluer les routes descendantes.\n\nRPL définit trois modes de sécurité (*unsecured*, *preinstalled*, *authenticated*), mais le mode authentifié n'a pas de mécanisme de gestion de clés spécifié, et ces modes sont rarement implémentés dans les piles courantes.\n\n## Sécuriser la couche application\n\n- **DTLS** — TLS adapté à UDP. DTLS 1.2 : RFC 6347 ; DTLS 1.3 : RFC 9147. CoAP sur DTLS s'appelle *coaps* et écoute sur le port **5684**.\n- **OSCORE** — RFC 8613, *Object Security for Constrained RESTful Environments*. Protège le message lui-même plutôt que le canal, ce qui lui permet de **traverser les proxies** : indispensable dès qu'une passerelle traduit CoAP en HTTP, là où DTLS s'arrête.\n\n## À retenir\n\nTrois idées à emporter :\n1. Le coût de la sécurité dans un WSN n'est pas le calcul, c'est **la place dans la trame et l'énergie de la transmettre**.\n2. Le chiffrement ne protège ni du brouillage ni du *denial of sleep* : la **disponibilité** se traite par la redondance, pas par la cryptographie.\n3. Un nœud physiquement accessible doit être considéré comme potentiellement compromis. Le vrai travail est alors la **gestion des clés** — clé par nœud plutôt que clé de réseau unique, et capacité à révoquer.\n\n## Notions liées\n\n- [[6LoWPAN]]\n- [[IEEE 802.15.4]]\n- [[LoRa et LoRaWAN]]\n- [[RPL]]\n- [[CoAP]]\n- [[Mécanismes de résilience]]\n- [[Duty cycling]]\n- [[Contraintes des réseaux de capteurs]]\n\n---\n*Complément hors support. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Ensemble des mécanismes qui garantissent la confidentialité, l'intégrité, l'authenticité et la disponibilité des données d'un WSN, sous la contrainte que chaque octet et chaque mic","links":["6LoWPAN","Duty cycling","RPL","IEEE 802.15.4","LoRa et LoRaWAN","CoAP","Mécanismes de résilience","Contraintes des réseaux de capteurs"]},{"title":"TSCH","folder":"05-Complements","type":"protocole","chapter":"Compléments hors support","tags":["reseaux-de-capteurs","complement","protocole"],"body":"# TSCH\n\n> **Définition.** Time-Slotted Channel Hopping : mode d'accès au canal de IEEE 802.15.4e (2012, intégré à la révision 802.15.4-2015) qui combine des créneaux temporels synchronisés et un saut de canal systématique. C'est le mode retenu pour les réseaux industriels.\n\nTSCH répond aux deux faiblesses de [[Couche MAC et accès au canal (CSMA-CA)]] : la latence non bornée et l'exposition aux interférences sur un canal fixe.\n\n## Les deux idées\n\n**Créneaux synchronisés.** Le temps est découpé en *timeslots* — typiquement 10 ms — regroupés en une *slotframe* qui se répète. Chaque cellule est identifiée par un couple **(décalage de créneau, décalage de canal)**, et l'ordonnancement attribue les cellules aux paires de nœuds. Un nœud sait donc à l'avance quand il émet, quand il écoute, et quand il peut dormir : le rapport cyclique devient **déterministe**, et la latence bornée.\n\n**Saut de canal.** À chaque répétition de la slotframe, la même cellule utilise un canal physique différent, calculé à partir de l'ASN (*Absolute Slot Number*, compteur global partagé) et du décalage de canal. Une interférence permanente sur un canal — un réseau Wi-Fi voisin, par exemple — ne dégrade donc plus qu'une fraction des transmissions au lieu de couper le lien.\n\n## Ce que ça change\n\n| | CSMA-CA non fenêtré | TSCH |\n|---|---|---|\n| Latence | non bornée | bornée par la slotframe |\n| Rapport cyclique | subi | choisi et calculable |\n| Interférences | subies sur un canal fixe | diluées par le saut de canal |\n| Terminal caché | non résolu | résolu par l'ordonnancement |\n| Prérequis | aucun | synchronisation d'horloges, ordonnancement à construire |\n\nLe prix est réel : il faut maintenir la synchronisation entre tous les nœuds, et construire l'ordonnancement — de façon centralisée, ou distribuée.\n\n## Références\n\n- IEEE 802.15.4e (2012), repris dans IEEE 802.15.4-2015.\n- RFC 7554 — énoncé du problème 6TiSCH (utiliser TSCH dans l'IoT IPv6).\n- RFC 8180 — configuration minimale 6TiSCH.\n\n**À retenir.** TSCH est le point où le WSN cesse d'être « au mieux » pour devenir déterministe. C'est ce qui le rend acceptable en milieu industriel, et c'est pourquoi on le retrouve derrière WirelessHART et ISA100.11a.\n\n## Notion
