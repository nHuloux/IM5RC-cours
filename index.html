<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réseaux de capteurs IM5RC — Graphe de notions</title>
<meta name="description" content="Cours Réseaux de capteurs (MIRA 3A) : 57 notions liées, vue graphe et vue liste.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23179AAF'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23fff'/%3E%3Ccircle cx='8' cy='9' r='2.4' fill='%23fff' opacity='.85'/%3E%3Ccircle cx='24' cy='10' r='2.4' fill='%23fff' opacity='.85'/%3E%3Ccircle cx='23' cy='24' r='2.4' fill='%23fff' opacity='.85'/%3E%3Ccircle cx='9' cy='23' r='2.4' fill='%23fff' opacity='.85'/%3E%3Cg stroke='%23fff' stroke-width='1.3' opacity='.7'%3E%3Cline x1='16' y1='16' x2='8' y2='9'/%3E%3Cline x1='16' y1='16' x2='24' y2='10'/%3E%3Cline x1='16' y1='16' x2='23' y2='24'/%3E%3Cline x1='16' y1='16' x2='9' y2='23'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ============ tokens ============ */
:root{
  --bg:#f6f8f8; --bg-alt:#eceff0; --surface:#ffffff; --surface-2:#f1f4f4;
  --border:#dbe2e3; --border-strong:#c3cdcf;
  --text:#1e2426; --text-muted:#63747a; --text-faint:#93a2a6;
  --accent:#0e7b8c; --accent-hi:#179aaf; --accent-wash:#e4f0f2;
  --shadow:0 1px 2px rgba(20,40,44,.06),0 12px 28px -20px rgba(20,40,44,.35);
  --c-01:#0f8fa2; --c-02:#3f72c9; --c-03:#8259c4; --c-04:#a9760d; --c-05:#1f8f66; --c-00:#6a7b80;
  --graph-link:rgba(30,60,66,.20); --graph-label:#33454a;
  color-scheme:light;
}
:root[data-theme="dark"], :root.dark{
  --bg:#191d1e; --bg-alt:#141718; --surface:#202526; --surface-2:#252b2c;
  --border:#2f3739; --border-strong:#414c4f;
  --text:#dbe3e5; --text-muted:#8e9c9f; --text-faint:#6a787b;
  --accent:#35b8cb; --accent-hi:#5ccede; --accent-wash:#16333a;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 32px -22px rgba(0,0,0,.8);
  --c-01:#35b8cb; --c-02:#6ea8f5; --c-03:#b18cf0; --c-04:#e8b04b; --c-05:#5cc79a; --c-00:#8d9ba0;
  --graph-link:rgba(190,215,220,.16); --graph-label:#b9c6c9;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:1px;border-radius:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============ shell ============ */
#app{display:grid;grid-template-columns:44px 268px minmax(0,1fr) 258px;height:100vh}
#app.no-left{grid-template-columns:44px 0 minmax(0,1fr) 258px}
#app.no-right{grid-template-columns:44px 268px minmax(0,1fr) 0}
#app.no-left.no-right{grid-template-columns:44px 0 minmax(0,1fr) 0}

/* ribbon */
.ribbon{background:var(--bg-alt);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0}
.ribbon .logo{width:26px;height:26px;margin-bottom:10px;flex:0 0 auto}
.rb{width:30px;height:30px;border-radius:5px;display:grid;place-items:center;color:var(--text-faint)}
.rb:hover{background:var(--surface-2);color:var(--text)}
.rb.on{color:var(--accent);background:var(--accent-wash)}
.rb svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ribbon .sp{flex:1}

/* sidebars */
.side{background:var(--bg-alt);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.side.left{border-right:1px solid var(--border)}
.side.right{border-left:1px solid var(--border)}
.side-head{padding:11px 12px 9px;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.side-head h2{font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--text-faint)}
.side-body{overflow-y:auto;overflow-x:hidden;flex:1;padding:0 6px 24px}

/* search */
.searchwrap{padding:0 10px 10px;flex:0 0 auto}
.searchbox{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:6px 9px}
.searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-wash)}
.searchbox svg{width:14px;height:14px;stroke:var(--text-faint);fill:none;stroke-width:2;flex:0 0 auto}
.searchbox input{border:0;background:none;color:inherit;font:inherit;width:100%;outline:none}
.searchbox input::placeholder{color:var(--text-faint)}
.searchbox kbd{font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--text-faint);border:1px solid var(--border);border-radius:3px;padding:1px 4px;flex:0 0 auto}
.hitcount{font-size:11px;color:var(--text-faint);padding:6px 10px 2px}

/* explorer tree */
.tree{font-size:13px}
.folder>.frow{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:4px;color:var(--text-muted);cursor:pointer;font-weight:600;font-size:12px}
.folder>.frow:hover{background:var(--surface-2);color:var(--text)}
.folder>.frow .caret{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;transition:transform .12s;flex:0 0 auto}
.folder.closed>.frow .caret{transform:rotate(-90deg)}
.folder.closed>.fkids{display:none}
.folder>.frow .cnt{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--text-faint);font-weight:400}
.fkids{padding-left:13px;border-left:1px solid var(--border);margin-left:10px}
.leaf{display:block;width:100%;text-align:left;padding:4px 7px;border-radius:4px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.leaf:hover{background:var(--surface-2);color:var(--text)}
.leaf.on{background:var(--accent-wash);color:var(--accent);font-weight:600}
.leaf .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:1px}

/* main */
main{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.tabbar{display:flex;align-items:center;gap:2px;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--bg-alt);flex:0 0 auto;min-height:42px}
.iconbtn{width:28px;height:28px;border-radius:5px;display:grid;place-items:center;color:var(--text-faint);flex:0 0 auto}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.iconbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.iconbtn[disabled]{opacity:.32;cursor:default}
.iconbtn[disabled]:hover{background:none;color:var(--text-faint)}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;margin-left:4px;font-size:12.5px;color:var(--text-muted)}
.crumb b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb span{color:var(--text-faint);flex:0 0 auto}
.seg{margin-left:auto;display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:2px;gap:2px;flex:0 0 auto}
.seg button{padding:3px 11px;border-radius:4px;font-size:12px;font-weight:500;color:var(--text-muted);display:flex;align-items:center;gap:6px}
.seg button svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pane{flex:1;min-height:0;position:relative}
.pane>section{position:absolute;inset:0;overflow:auto;display:none}
.pane>section.on{display:block}

/* ---- note view ---- */
.note{max-width:760px;margin:0 auto;padding:38px 44px 120px}
.note .meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:16px}
.pill{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.05em;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--text-muted);background:var(--surface)}
.pill.chap{border-color:transparent;color:#fff}
.note h1{font-family:Figtree,sans-serif;font-size:2.05rem;font-weight:700;letter-spacing:-.024em;line-height:1.1;margin-bottom:20px;text-wrap:balance}
.md{font-family:"Source Serif 4",Georgia,serif;font-size:16.5px;line-height:1.68}
.md>*+*{margin-top:1em}
.md h2{font-family:Figtree,sans-serif;font-size:1.24rem;font-weight:600;letter-spacing:-.012em;margin-top:1.9em;padding-bottom:.32em;border-bottom:1px solid var(--border)}
.md h3{font-family:Figtree,sans-serif;font-size:1.06rem;font-weight:600;margin-top:1.5em}
.md blockquote{border-left:3px solid var(--accent);background:var(--accent-wash);padding:14px 18px;border-radius:0 4px 4px 0}
.md blockquote>*+*{margin-top:.7em}
.md ul,.md ol{padding-left:1.35em}
.md li+li{margin-top:.35em}
.md code{font-family:"JetBrains Mono",monospace;font-size:.83em;background:var(--surface-2);border:1px solid var(--border);border-radius:3px;padding:1px 5px}
.md pre{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:14px 16px;overflow-x:auto}
.md pre code{background:none;border:0;padding:0;font-size:12.5px;line-height:1.55}
.md hr{border:0;border-top:1px solid var(--border);margin:2em 0}
.md em{color:var(--text-muted)}
.md strong{font-weight:600;color:var(--text)}
.md a.wl{color:var(--accent);border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent);text-decoration:none}
.md a.wl:hover{background:var(--accent-wash);text-decoration:none}
.md a.wl.dead{color:var(--text-faint);border-bottom-style:dashed;cursor:not-allowed}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:6px;background:var(--surface)}
.md table{border-collapse:collapse;width:100%;font-family:Figtree,sans-serif;font-size:13.5px;min-width:460px}
.md th,.md td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.md thead th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);background:var(--surface-2);white-space:nowrap}
.md tbody tr:last-child td{border-bottom:0}
/* Les schémas sont toujours rendus sur fond blanc, en thème clair : le thème du
   site (ou celui du navigateur) ne doit pas influer sur leur lisibilité. */
.mermaid-box{background:#fff;color:#1f2328;color-scheme:light;border:1px solid var(--border);border-radius:6px;padding:20px 14px;overflow-x:auto;text-align:center}
:root[data-theme="dark"] .mermaid-box{background:#fff;color:#1f2328}
.mermaid-box svg{max-width:100%;height:auto;background:transparent}
/* mermaid pose ses libellés dans des <span>/<div> HTML : sans cette règle ils
   héritent de la couleur de texte du thème sombre et deviennent illisibles. */
.mermaid-box .nodeLabel,.mermaid-box .edgeLabel,.mermaid-box .label,
.mermaid-box foreignObject div,.mermaid-box foreignObject span,
.mermaid-box p{color:#1f2328}
.mermaid-box .edgeLabel,.mermaid-box .edgeLabel span,
.mermaid-box .edgeLabel div{background-color:#fff}
.mermaid-box .edgeLabel rect,.mermaid-box rect.labelBkg{fill:#fff}
/* les numéros d'étape (autonumber) sont blancs et n'ont pas de pastille derrière */
.mermaid-box text.sequenceNumber{fill:#1f2328!important}
.note-foot{margin-top:52px;padding-top:18px;border-top:1px solid var(--border);font-size:12px;color:var(--text-faint);display:flex;flex-wrap:wrap;gap:14px}

/* ---- graph view ---- */
.graphwrap{position:absolute;inset:0;overflow:hidden}
#gcanvas{display:block;width:100%;height:100%;cursor:grab}
#gcanvas.grabbing{cursor:grabbing}
.gpanel{position:absolute;top:14px;left:14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:12px 14px;width:222px;font-size:12.5px}
.gpanel h3{font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--text-faint);margin-bottom:9px}
.gpanel label{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;color:var(--text-muted)}
.gpanel label:hover{color:var(--text)}
.gpanel input[type=checkbox]{accent-color:var(--accent);width:13px;height:13px;flex:0 0 auto}
.gpanel .sw{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.gpanel .n{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--text-faint)}
.gsliders{margin-top:12px;padding-top:11px;border-top:1px solid var(--border)}
.gsliders div{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--text-muted);font-size:11.5px}
.gsliders input[type=range]{flex:1;accent-color:var(--accent);height:14px}
.ghint{position:absolute;bottom:14px;left:14px;font-size:11.5px;color:var(--text-faint);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:7px 11px;line-height:1.6;max-width:280px}
.gbtns{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:6px}
.gbtns button{width:30px;height:30px;background:var(--surface);border:1px solid var(--border);border-radius:6px;display:grid;place-items:center;color:var(--text-muted);box-shadow:var(--shadow)}
.gbtns button:hover{color:var(--accent);border-color:var(--accent)}
.gbtns svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* ---- list view ---- */
.listview{padding:26px 30px 90px;max-width:1080px;margin:0 auto}
.listview .lhead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:18px}
.listview h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.listview .sub{color:var(--text-muted);font-size:13px;margin-top:3px}
.filters{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px}
.chipf{font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);color:var(--text-muted);background:var(--surface);display:flex;align-items:center;gap:6px}
.chipf .sw{width:8px;height:8px;border-radius:50%}
.chipf:hover{border-color:var(--border-strong);color:var(--text)}
.chipf.off{opacity:.4}
.tbl{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.tblscroll{overflow-x:auto}
table.data{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
table.data th:nth-child(2),table.data td:nth-child(2){white-space:nowrap;width:96px}
table.data th:nth-child(3),table.data td:nth-child(3){white-space:nowrap;width:104px}
table.data th:nth-child(4),table.data td:nth-child(4){width:64px}
table.data th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);background:var(--surface-2);padding:9px 14px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0}
table.data th:hover{color:var(--text)}
table.data th .ar{color:var(--accent);font-size:9px;margin-left:3px}
table.data td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
table.data tbody tr{cursor:pointer}
table.data tbody tr:hover{background:var(--surface-2)}
table.data tbody tr:last-child td{border-bottom:0}
table.data td.t{font-weight:500;color:var(--text)}
table.data td.n{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;color:var(--text-muted);text-align:right}
table.data td .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}
.tdesc{color:var(--text-muted);font-size:12.5px;max-width:400px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:40px;text-align:center;color:var(--text-faint)}

/* right sidebar blocks */
.rblock{margin:0 4px 4px;padding:10px 8px 12px}
.rblock h3{font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--text-faint);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.rblock h3 .n{font-family:"JetBrains Mono",monospace;background:var(--surface-2);border-radius:3px;padding:0 5px;letter-spacing:0}
.rlink{display:block;width:100%;text-align:left;padding:5px 8px;border-radius:4px;color:var(--text-muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlink:hover{background:var(--surface-2);color:var(--accent)}
.rblock .none{color:var(--text-faint);font-size:12px;padding:2px 8px;font-style:italic}
.outline a{display:block;padding:4px 8px;border-radius:4px;color:var(--text-muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.outline a:hover{background:var(--surface-2);color:var(--accent);text-decoration:none}
.outline a.h3{padding-left:20px;font-size:12px;color:var(--text-faint)}
.minigraph{margin:2px 8px 0;border:1px solid var(--border);border-radius:6px;background:var(--surface);overflow:hidden}
.minigraph canvas{display:block;width:100%;height:170px;cursor:pointer}

/* mobile */
.mobbar{display:none}
@media (max-width:960px){
  #app{grid-template-columns:44px minmax(0,1fr)!important}
  .side.left,.side.right{position:fixed;top:0;bottom:0;width:min(280px,84vw);z-index:40;box-shadow:var(--shadow);transition:transform .18s}
  .side.left{left:0;transform:translateX(-100%)}
  .side.left.open{transform:translateX(44px)}
  .side.right{right:0;transform:translateX(100%)}
  .side.right.open{transform:none}
  .note{padding:26px 20px 90px}
  .listview{padding:20px 16px 80px}
  .gpanel{width:190px;font-size:12px}
  .ghint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">

  <nav class="ribbon" aria-label="Barre latérale">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--accent)"/><circle cx="16" cy="16" r="3.4" fill="#fff"/><g fill="#fff" opacity=".9"><circle cx="8" cy="9" r="2.4"/><circle cx="24" cy="10" r="2.4"/><circle cx="23" cy="24" r="2.4"/><circle cx="9" cy="23" r="2.4"/></g><g stroke="#fff" stroke-width="1.3" opacity=".7"><line x1="16" y1="16" x2="8" y2="9"/><line x1="16" y1="16" x2="24" y2="10"/><line x1="16" y1="16" x2="23" y2="24"/><line x1="16" y1="16" x2="9" y2="23"/></g></svg>
    <button class="rb on" id="rbFiles" title="Explorateur de fichiers"><svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
    <button class="rb" id="rbGraph" title="Vue graphe"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.6"/><circle cx="5" cy="5.5" r="2.1"/><circle cx="19" cy="6" r="2.1"/><circle cx="18" cy="19" r="2.1"/><circle cx="5.5" cy="18" r="2.1"/><path d="M10.2 10.4 6.6 7.1M13.8 10.5l3.5-2.8M13.6 13.7l3 3.6M10.4 13.6l-3.2 3"/></svg></button>
    <button class="rb" id="rbList" title="Vue liste"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></button>
    <span class="sp"></span>
    <button class="rb" id="rbTheme" title="Thème clair / sombre"><svg viewBox="0 0 24 24"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg></button>
  </nav>

  <aside class="side left" id="sideLeft">
    <div class="side-head"><h2>Notions</h2></div>
    <div class="searchwrap">

const VAULT = /*__DATA__*/{"notes":[{"title":"Glossaire","folder":"00-Reperes","type":"moc","chapter":"","tags":["reseaux-de-capteurs","glossaire"],"body":"# Glossaire\n\nSigles et acronymes clés du cours, avec un lien vers leur notion. Vue condensée du glossaire du support de cours, complétée des sigles introduits par les notes du dossier `05-Complements`.\n\n## Notions du support\n\n- [[6LoWPAN]] — IPv6 over Low-power Wireless Personal Area Networks : couche d'adaptation, définie par l'IETF, qui permet de faire transiter des paquets IPv6 sur des réseaux radio contraints de type IEEE 802.15.4.\n- [[Protocoles réactifs (AODV)]] — Protocoles on-demand qui ne calculent une route que lorsqu'un nœud a effectivement quelque chose à envoyer.\n- [[Bluetooth Low Energy (BLE)]] — Technologie radio à 2,4 GHz, débit de l'ordre du Mbit/s sur courte portée (quelques mètres à quelques dizaines de mètres), consommation très faible au repos.\n- [[Pile protocolaire de l'IoT contraint]] — Empilement protocolaire typique d'un capteur IPv6 moderne : IEEE 802.15.4 → 6LoWPAN → IPv6 → UDP → CoAP, avec RPL pour le routage multi-saut.\n- [[RPL]] — Routing Protocol for Low-power and Lossy networks : protocole de routage standardisé par l'IETF pour les réseaux IPv6/6LoWPAN contraints, organisé en arbre orienté (DODAG) enraciné sur la passerelle.\n- [[IEEE 802.15.4]] — Norme qui définit les couches physique et liaison des réseaux personnels sans fil basse consommation (LR-WPAN). Bande 2,4 GHz, ~250 kbit/s, portée de quelques dizaines de mètres.\n- [[IPv6]] — Protocole d'adressage successeur d'IPv4, sur 128 bits (≈ 3,4 × 10³⁸ adresses), qui permet d'attribuer une adresse unique et publique à chaque objet, même à l'échelle de milliards de capteurs.\n- [[LoRa et LoRaWAN]] — LoRa : modulation longue portée en bande sub-gigahertz libre (868 MHz en Europe), plusieurs kilomètres de portée, débit très faible. LoRaWAN : protocole réseau construit au-dessus, organisé en étoile.\n- [[NB-IoT et LTE-M]] — Technologies LPWAN cellulaires, appuyées sur les infrastructures des opérateurs mobiles (4G/5G).\n- [[Réseau ad-hoc (MANET)]] — Réseau sans fil qui se forme spontanément, sans infrastructure préexistante, les nœuds jouant eux-mêmes le rôle de routeurs. Mobile Ad-hoc NETwork (MANET) quand les nœuds sont mobiles.\n- [[Protocoles proactifs (OLSR)]] — Protocoles table-driven qui maintiennent en permanence, dans chaque nœud, une table de routage à jour vers toutes les destinations possibles.\n- [[Duty cycling]] — Fait alterner le nœud entre un état actif (radio et capteurs allumés) et un état de sommeil profond, en maximisant le temps de sommeil. Le rapport cyclique (duty cycle) est la fraction de temps passée en état actif.\n- [[Récupération d'énergie (energy harvesting)]] — Capter de l'énergie dans l'environnement du nœud pour recharger sa réserve : solaire, cinétique, thermique, ou radiofréquence.\n- [[SLAAC]] — StateLess Address AutoConfiguration : mécanisme qui permet à un nœud de se fabriquer lui-même une adresse IPv6, sans serveur central.\n- [[Zigbee]] — Pile réseau construite sur IEEE 802.15.4, ajoutant les couches réseau et application avec un routage mesh.\n- [[Thread]] — Technologie plus récente, construite sur 802.15.4 et 6LoWPAN, qui offre un maillage IPv6 natif sans point unique de défaillance.\n- [[NDP (Neighbor Discovery Protocol)]] — Protocole central d'IPv6, transporté par ICMPv6, qui remplace et étend ARP d'IPv4.\n- [[Passerelle (gateway)]] — Nœud particulier (sink/gateway) disposant de plus de ressources (alimentation secteur, liaison Internet, IP publique), qui fait le pont entre le réseau de capteurs et une infrastructure classique.\n\n## Sigles des compléments\n\n- [[CoAP]] — Constrained Application Protocol (RFC 7252) : équivalent allégé de HTTP pour objets contraints, sur UDP, en-tête fixe de 4 octets.\n- [[Couche MAC et accès au canal (CSMA-CA)]] — Carrier Sense Multiple Access with Collision **Avoidance** : écouter le canal avant d'émettre, et attendre un délai aléatoire s'il est occupé. Évite les collisions au lieu de les détecter, puisqu'une radio ne peut pas les détecter en émettant.\n- [[TSCH]] — Time-Slotted Channel Hopping (IEEE 802.15.4e) : créneaux temporels synchronisés et saut de canal. La variante déterministe, utilisée en milieu industriel.\n- [[LEACH]] — Low-Energy Adaptive Clustering Hierarchy : protocole qui fait tourner le rôle de chef de cluster par tirage aléatoire, à chaque *round*.\n- [[Qualité de lien (PRR, ETX, RSSI, LQI)]] — **PRR** : taux de trames reçues. **ETX** : nombre attendu de transmissions pour faire passer une trame, métrique par défaut de MRHOF. **RSSI** : puissance reçue, en dBm. **LQI** : indicateur de qualité de modulation de 802.15.4, de 0 à 255.\n- [[Sécurité des réseaux de capteurs]] — **AES-CCM\\*** : mode de chiffrement authentifié de 802.15.4. **MIC** : code d'intégrité (4, 8 ou 16 octets). **DTLS** : TLS sur UDP (RFC 6347 / 9147). **OSCORE** : sécurité au niveau objet pour CoAP (RFC 8613), qui traverse les proxies. **OTAA / ABP** : les deux modes d'activation LoRaWAN.\n\n## Sigles à connaître sans note dédiée\n\n- **CAN** — convertisseur analogique-numérique, dernier étage de l'[[Unité de captation]].\n- **DODAG** — Destination Oriented Directed Acyclic Graph : l'arbre orienté construit par [[RPL]].\n- **DIO / DIS / DAO** — les messages de contrôle de [[RPL]] : construction de l'arbre, sollicitation, annonce de destination.\n- **IPHC / NHC** — les deux mécanismes de compression d'en-tête de [[6LoWPAN]] (RFC 6282) : en-tête IPv6 et en-tête de niveau supérieur.\n- **MTU** — Maximum Transmission Unit : 1280 octets minimum en IPv6, contre 127 octets pour une trame [[IEEE 802.15.4]]. Toute la raison d'être de 6LoWPAN.\n- **SF / DR** — facteur d'étalement et *data rate* en [[LoRa et LoRaWAN]] : SF12/DR0 pour la portée, SF7/DR5 pour le débit.\n- **LPWAN** — Low-Power Wide-Area Network : la famille longue portée et bas débit (LoRaWAN, NB-IoT, LTE-M).\n- **GTS** — Guaranteed Time Slot du mode *beacon-enabled* de 802.15.4, voir [[Couche MAC et accès au canal (CSMA-CA)]].\n\n## Voir aussi\n\n- [[Accueil]]\n- [[Compléments hors support]]","excerpt":"Sigles et acronymes clés du cours, avec un lien vers leur notion. Vue condensée du glossaire du support de cours, complétée des sigles introduits par les notes du dossier 05-Comple","links":["6LoWPAN","Protocoles réactifs (AODV)","Bluetooth Low Energy (BLE)","Pile protocolaire de l'IoT contraint","RPL","IEEE 802.15.4","IPv6","LoRa et LoRaWAN","NB-IoT et LTE-M","Réseau ad-hoc (MANET)","Protocoles proactifs (OLSR)","Duty cycling","Récupération d'énergie (energy harvesting)","SLAAC","Zigbee","Thread","NDP (Neighbor Discovery Protocol)","Passerelle (gateway)","CoAP","Couche MAC et accès au canal (CSMA-CA)","TSCH","LEACH","Qualité de lien (PRR, ETX, RSSI, LQI)","Sécurité des réseaux de capteurs","Unité de captation","Accueil","Compléments hors support"]},{"title":"Chapitre 1 - Introduction, architectures et applications","folder":"01-Introduction-et-architectures","type":"moc","chapter":"","tags":["reseaux-de-capteurs","moc","chapitre-1"],"body":"# Chapitre 1 - Introduction, architectures et applications\n\nNotions du chapitre 1 — *Introduction, architectures et applications*.\n\n- [[Réseau de capteurs sans fil (WSN)]] — Ensemble de nœuds capteurs autonomes, spatialement distribués, qui coopèrent pour mesurer des grandeurs physiques, traiter localement ces mesures, et les acheminer sans fil de proche en proche jusqu'à une passerelle.\n- [[Nœud capteur (mote)]] — Système embarqué contraint constitué de quatre sous-ensembles fonctionnels : unité de captation, de traitement, de communication et d'alimentation.\n- [[Unité de captation]] — Sous-ensemble du nœud capteur : un ou plusieurs capteurs, leur conditionnement de signal et un convertisseur analogique-numérique (CAN). L'interface avec le monde physique.\n- [[Unité de traitement]] — Microcontrôleur (ARM Cortex-M, ESP32, MSP430...) et sa mémoire, volontairement limités pour économiser l'énergie.\n- [[Unité de communication (transceiver)]] — Émetteur-récepteur radio du nœud capteur : de loin le composant le plus gourmand en énergie.\n- [[Unité d'alimentation]] — Batterie, pile, ou dispositif de récupération d'énergie (energy harvesting). Conditionne la durée de vie de tout le nœud.\n- [[Passerelle (gateway)]] — Nœud particulier (sink/gateway) disposant de plus de ressources (alimentation secteur, liaison Internet, IP publique), qui fait le pont entre le réseau de capteurs et une infrastructure classique.\n- [[Topologie en étoile]] — Tous les nœuds communiquent directement avec la passerelle, en un seul saut (single-hop). La topologie la plus simple.\n- [[Topologie maillée (mesh)]] — Les nœuds peuvent relayer les messages les uns des autres. L'information chemine en plusieurs sauts (multi-hop) jusqu'à la passerelle.\n- [[Topologie hiérarchique (clusters)]] — Les nœuds sont regroupés en clusters ; chaque cluster élit un chef de cluster (cluster head) qui agrège les données de ses membres et les transmet vers la passerelle.\n- [[Contraintes des réseaux de capteurs]] — Ce qui distingue un WSN d'un réseau informatique classique : énergie limitée, ressources de calcul/mémoire réduites, bande passante faible, environnement hostile, passage à l'échelle, coût.\n- [[Domaines d'application des WSN]] — Les réseaux de capteurs se déploient dès qu'il faut observer un phénomène étendu dans l'espace, en continu, à coût raisonnable.\n\n## Compléments rattachés à ce chapitre\n\n- [[LEACH]] — la rotation du rôle de chef de cluster, qui répond au défaut de la topologie hiérarchique.\n- [[Le fil rouge de l'énergie]] — note transversale sur le principe directeur du cours.\n\n## Voir aussi\n\n- [[Accueil]]\n- [[Chapitre 2 - Adressage et protocole IPv6]]\n- [[Chapitre 3 - La communication dans les réseaux de capteurs]]\n- [[Chapitre 4 - Économie d'énergie et tolérance aux pannes]]\n- [[Compléments hors support]]","excerpt":"Notions du chapitre 1 — Introduction, architectures et applications.","links":["Réseau de capteurs sans fil (WSN)","Nœud capteur (mote)","Unité de captation","Unité de traitement","Unité de communication (transceiver)","Unité d'alimentation","Passerelle (gateway)","Topologie en étoile","Topologie maillée (mesh)","Topologie hiérarchique (clusters)","Contraintes des réseaux de capteurs","Domaines d'application des WSN","LEACH","Le fil rouge de l'énergie","Accueil","Chapitre 2 - Adressage et protocole IPv6","Chapitre 3 - La communication dans les réseaux de capteurs","Chapitre 4 - Économie d'énergie et tolérance aux pannes","Compléments hors support"]},{"title":"Contraintes des réseaux de capteurs","folder":"01-Introduction-et-architectures","type":"concept","chapter":"1 - Introduction, architectures et applications","tags":["reseaux-de-capteurs","chapitre-1","concept"],"body":"# Contraintes des réseaux de capteurs\n\n> **Définition.** Ce qui distingue un WSN d'un réseau informatique classique : énergie limitée, ressources de calcul/mémoire réduites, bande passante faible, environnement hostile, passage à l'échelle, coût.\n\n- **Énergie limitée** : nœuds alimentés par pile, souvent en lieux difficiles d'accès. L'énergie est *la* ressource critique.\n- **Ressources de calcul et de mémoire réduites** : quelques dizaines à quelques centaines de kilo-octets de mémoire, microcontrôleur à quelques MHz. Les protocoles doivent être légers.\n- **Bande passante faible** : de quelques centaines de bits/s (LoRa) à quelques centaines de kbit/s (Zigbee).\n- **Environnement de déploiement hostile** : extérieur, intempéries, interférences, lien radio intrinsèquement peu fiable.\n- **Passage à l'échelle et auto-organisation** : un réseau peut compter des milliers de nœuds qu'on ne peut configurer un par un.\n- **Contrainte de coût** : le nœud doit être bon marché pour être déployé en grand nombre, ce qui limite la qualité des composants.\n\nComprendre ces contraintes, c'est comprendre pourquoi tous les protocoles étudiés dans le cours (6LoWPAN, routage ad-hoc, RPL...) sont conçus comme ils le sont.\n\n## Notions liées\n\n- [[Réseau de capteurs sans fil (WSN)]]\n- [[Unité d'alimentation]]\n- [[6LoWPAN]]\n- [[Duty cycling]]\n- [[Budget énergétique d'un nœud]]\n\n---\n*Chapitre 1 — Introduction, architectures et applications. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Ce qui distingue un WSN d'un réseau informatique classique : énergie limitée, ressources de calcul/mémoire réduites, bande passante faible, environnement hostile, passage à l'échel","links":["Réseau de capteurs sans fil (WSN)","Unité d'alimentation","6LoWPAN","Duty cycling","Budget énergétique d'un nœud"]},{"title":"Domaines d'application des WSN","folder":"01-Introduction-et-architectures","type":"concept","chapter":"1 - Introduction, architectures et applications","tags":["reseaux-de-capteurs","chapitre-1","concept"],"body":"# Domaines d'application des WSN\n\n> **Définition.** Les réseaux de capteurs se déploient dès qu'il faut observer un phénomène étendu dans l'espace, en continu, à coût raisonnable.\n\n- **Agriculture et viticulture de précision** : humidité du sol, pilotage de l'irrigation, aide à la décision.\n- **Surveillance environnementale et prévention des risques** : détection précoce d'incendies de forêt, qualité de l'air/eau, glissements de terrain. \n- **Industrie 4.0 et bâtiment intelligent** : maintenance prédictive, supervision énergétique, confort/sécurité des bâtiments. \n- **Santé et e-santé** : télésurveillance de patients, capteurs corporels (Body Area Networks).\n- **Ville intelligente** : stationnement, éclairage adaptatif, gestion des déchets, comptage de trafic.\n- **Logistique et traçabilité** : chaîne du froid, localisation d'actifs.\n\n## Notions liées\n\n- [[Réseau de capteurs sans fil (WSN)]]\n- [[LoRa et LoRaWAN]]\n- [[Mécanismes de résilience]]\n\n---\n*Chapitre 1 — Introduction, architectures et applications. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Les réseaux de capteurs se déploient dès qu'il faut observer un phénomène étendu dans l'espace, en continu, à coût raisonnable.","links":["Réseau de capteurs sans fil (WSN)","LoRa et LoRaWAN","Mécanismes de résilience"]},{"title":"Nœud capteur (mote)","folder":"01-Introduction-et-architectures","type":"concept","chapter":"1 - Introduction, architectures et applications","tags":["reseaux-de-capteurs","chapitre-1","concept"],"body":"# Nœud capteur (mote)\n\n> **Définition.** Système embarqué contraint constitué de quatre sous-ensembles fonctionnels : unité de captation, de traitement, de communication et d'alimentation.\n\nUn nœud capteur (souvent appelé *mote*) comporte quatre briques : la captation (interface avec le monde physique), le traitement (microcontrôleur et mémoire), la communication (émetteur-récepteur radio, le composant le plus gourmand en énergie) et l'alimentation (batterie ou récupération d'énergie, qui conditionne la durée de vie de tout le nœud).\n\nÀ cela s'ajoutent parfois un système de localisation (GPS ou méthode par la portée radio), un actionneur (vanne, relais), et un système de mobilité pour les nœuds embarqués.\n\n## Schéma\n\n```mermaid\nflowchart TB\n    P([Phénomène physique]) --> C\n    subgraph N[\"Nœud capteur (mote)\"]\n        C[\"CAPTATION\u003cbr/>capteur + conditionnement + CAN\"] --> T[\"TRAITEMENT\u003cbr/>MCU qq MHz, qq 10 à 100 ko\"]\n        T --> R[\"COMMUNICATION\u003cbr/>transceiver radio\u003cbr/>poste énergétique dominant\"]\n        T -.- O[\"Optionnel : localisation,\u003cbr/>actionneur, mobilité\"]\n        A[\"ALIMENTATION\u003cbr/>pile, batterie ou harvesting\"] ==> C\n        A ==> T\n        A ==> R\n    end\n    R --> V([Voisins, puis passerelle])\n```\n\nLes flèches épaisses rappellent que l'alimentation irrigue les trois autres blocs : c'est elle qui fixe la durée de vie de l'ensemble, et c'est pourquoi le bloc de communication — le plus gourmand — commande toute la conception. La chaîne de la mesure, elle, va de haut en bas : captation, traitement, communication.\n\n## Notions liées\n\n- [[Réseau de capteurs sans fil (WSN)]]\n- [[Unité de captation]]\n- [[Unité de traitement]]\n- [[Unité de communication (transceiver)]]\n- [[Unité d'alimentation]]\n- [[Nœuds fixes et nœuds mobiles]]\n\n---\n*Chapitre 1 — Introduction, architectures et applications. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Système embarqué contraint constitué de quatre sous-ensembles fonctionnels : unité de captation, de traitement, de communication et d'alimentation.","links":["Réseau de capteurs sans fil (WSN)","Unité de captation","Unité de traitement","Unité de communication (transceiver)","Unité d'alimentation","Nœuds fixes et nœuds mobiles"]},{"title":"Passerelle (gateway)","folder":"01-Introduction-et-architectures","type":"concept","chapter":"1 - Introduction, architectures et applications","tags":["reseaux-de-capteurs","chapitre-1","concept"],"body":"# Passerelle (gateway)\n\n> **Définition.** Nœud particulier (sink/gateway) disposant de plus de ressources (alimentation secteur, liaison Internet, IP publique), qui fait le pont entre le réseau de capteurs et une infrastructure classique.\n\nLes nœuds ne dialoguent en général pas directement avec l'utilisateur : l'information remonte vers la passerelle, qui la relaie vers Internet, un serveur cloud, une base de données ou un tableau de bord. La passerelle est un point critique du réseau : si elle tombe, tout le réseau devient aveugle, d'où l'intérêt d'une redondance de passerelle pour les systèmes critiques.\n\n## Notions liées\n\n- [[Réseau de capteurs sans fil (WSN)]]\n- [[Topologie en étoile]]\n- [[Mécanismes de résilience]]\n- [[RPL]]\n\n---\n*Chapitre 1 — Introduction, architectures et applications. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Nœud particulier (sink/gateway) disposant de plus de ressources (alimentation secteur, liaison Internet, IP publique), qui fait le pont entre le réseau de capteurs et une infrastru","links":["Réseau de capteurs sans fil (WSN)","Topologie en étoile","Mécanismes de résilience","RPL"]},{"title":"Réseau de capteurs sans fil (WSN)","folder":"01-Introduction-et-architectures","type":"concept","chapter":"1 - Introduction, architectures et applications","tags":["reseaux-de-capteurs","chapitre-1","concept"],"body":"# Réseau de capteurs sans fil (WSN)\n\n> **Définition.** Ensemble de nœuds capteurs autonomes, spatialement distribués, qui coopèrent pour mesurer des grandeurs physiques, traiter localement ces mesures, et les acheminer sans fil de proche en proche jusqu'à une passerelle.\n\nL'idée centrale est celle d'une **instrumentation distribuée et communicante**. Là où la métrologie classique installe un capteur relié par câble à un enregistreur, le réseau de capteurs disperse l'intelligence : chaque nœud est à la fois un instrument de mesure, un petit calculateur et un émetteur-récepteur radio. Le réseau tire sa valeur non pas d'un capteur isolé, mais de la **densité** et de la **coopération** de nombreux nœuds couvrant une zone.\n\nLe chemin type de la donnée : phénomène physique → capteur → nœud → (relais par d'autres nœuds) → passerelle → serveur/cloud → utilisateur.\n\n## Schéma\n\n```mermaid\nflowchart LR\n    A[Phénomène physique] --> B[Capteur + CAN]\n    B --> C[Nœud : mesure, calcul local]\n    C -->|multi-saut| D[Nœuds relais]\n    D --> E[Passerelle]\n    E -->|IP / Internet| F[Serveur, base, cloud]\n    F --> G[Tableau de bord, alerte, décision]\n```\n\nCette chaîne est aussi le plan du cours : le chapitre 1 décrit le nœud et la topologie, le chapitre 2 l'adressage qui rend chaque nœud joignable, le chapitre 3 le trajet multi-saut, le chapitre 4 ce qui permet à la chaîne de durer et de survivre aux pannes.\n\nL'idée naît dans les années 1980 (surveillance militaire acoustique), puis se démocratise à la fin des années 1990 grâce à la miniaturisation des microcontrôleurs et des MEMS, à la baisse du coût des radios faible puissance, et à des OS embarqués dédiés (TinyOS, Contiki). La normalisation IEEE 802.15.4 (2003) puis l'essor du LPWAN (LoRaWAN, NB-IoT) l'inscrivent définitivement dans l'Internet des objets.\n\n**À retenir.** Sur un nœud capteur, ce n'est pas le calcul qui coûte le plus cher en énergie, mais la communication radio. Une bonne conception cherche donc à calculer localement pour transmettre le moins possible : ce principe gouverne l'ensemble du cours.\n\n## Notions liées\n\n- [[Nœud capteur (mote)]]\n- [[Passerelle (gateway)]]\n- [[Topologie en étoile]]\n- [[Topologie maillée (mesh)]]\n- [[Topologie hiérarchique (clusters)]]\n- [[Contraintes des réseaux de capteurs]]\n- [[Domaines d'application des WSN]]\n- [[Le fil rouge de l'énergie]]\n\n---\n*Chapitre 1 — Introduction, architectures et applications. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Ensemble de nœuds capteurs autonomes, spatialement distribués, qui coopèrent pour mesurer des grandeurs physiques, traiter localement ces mesures, et les acheminer sans fil de proc","links":["Nœud capteur (mote)","Passerelle (gateway)","Topologie en étoile","Topologie maillée (mesh)","Topologie hiérarchique (clusters)","Contraintes des réseaux de capteurs","Domaines d'application des WSN","Le fil rouge de l'énergie"]},{"title":"Topologie en étoile","folder":"01-Introduction-et-architectures","type":"concept","chapter":"1 - Introduction, architectures et applications","tags":["reseaux-de-capteurs","chapitre-1","concept"],"body":"# Topologie en étoile\n\n> **Définition.** Tous les nœuds communiquent directement avec la passerelle, en un seul saut (single-hop). La topologie la plus simple.\n\n**Avantages** : simplicité, latence faible et prévisible, nœuds simples (pas de fonction de routage), consommation maîtrisée.\n\n**Inconvénients** : portée limitée à la portée radio d'un nœud ; si la passerelle tombe, tout le réseau tombe (point unique de défaillance) ; passage à l'échelle limité.\n\nC'est la topologie typique des réseaux LPWAN (LoRaWAN, NB-IoT), où chaque capteur atteint directement une antenne de plusieurs kilomètres de portée.\n\n## Schéma\n\n```mermaid\nflowchart TB\n    subgraph P[\"Portée radio de la passerelle — 1 saut\"]\n        direction TB\n        n1[n] --- GW((GW))\n        n2[n] --- GW\n        n3[n] --- GW\n        n4[n] --- GW\n        n5[n] --- GW\n    end\n    nx[n] -. hors portée : inatteignable .-> GW\n    GW -->|IP / Internet| S[Serveur, base, cloud]\n```\n\n`n` : nœud capteur. `GW` : passerelle.\n\nChaque nœud atteint la passerelle **en un seul saut** : aucun nœud ne relaie le\ntrafic d'un autre. D'où les deux limites visibles sur le schéma — un nœud au-delà\nde la portée radio n'a aucun moyen d'être raccordé, et la passerelle est le\n**point unique de défaillance** par lequel transite tout le trafic.\n\n## Notions liées\n\n- [[Réseau de capteurs sans fil (WSN)]]\n- [[Passerelle (gateway)]]\n- [[LoRa et LoRaWAN]]\n- [[Topologie maillée (mesh)]]\n- [[Topologie hiérarchique (clusters)]]\n\n## Mentionné par\n\n- [[Bluetooth Low Energy (BLE)]]\n\n---\n*Chapitre 1 — Introduction, architectures et applications. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Tous les nœuds communiquent directement avec la passerelle, en un seul saut (single-hop). La topologie la plus simple.","links":["Réseau de capteurs sans fil (WSN)","Passerelle (gateway)","LoRa et LoRaWAN","Topologie maillée (mesh)","Topologie hiérarchique (clusters)","Bluetooth Low Energy (BLE)"]},{"title":"Topologie hiérarchique (clusters)","folder":"01-Introduction-et-architectures","type":"concept","chapter":"1 - Introduction, architectures et applications","tags":["reseaux-de-capteurs","chapitre-1","concept"],"body":"# Topologie hiérarchique (clusters)\n\n> **Définition.** Les nœuds sont regroupés en clusters ; chaque cluster élit un chef de cluster (cluster head) qui agrège les données de ses membres et les transmet vers la passerelle.\n\n**Avantages** : excellente efficacité énergétique (transmissions courtes distances, agrégation qui réduit le volume de données) ; bon passage à l'échelle.\n\n**Inconvénients** : le chef de cluster se décharge plus vite, d'où la nécessité de faire tourner le rôle ([[LEACH]]) ; complexité de l'élection et de la maintenance des clusters.\n\nTrois topologies de référence à connaître : **étoile** (simple, mono-saut, longue portée), **maillée** (robuste, multi-saut, dense) et **hiérarchique** (économe en énergie grâce à l'agrégation par clusters). Le choix découle de la zone à couvrir, de la portée radio et de la contrainte énergétique.\n\n## Schéma\n\n```mermaid\nflowchart LR\n    subgraph S1[\"1 · Étoile — 1 saut\"]\n        direction TB\n        a1[n] --- G1((GW))\n        a2[n] --- G1\n        a3[n] --- G1\n    end\n    subgraph S2[\"2 · Maillée — multi-saut\"]\n        direction TB\n        b1[n] --- b2[n]\n        b1 --- b3[n]\n        b3 --- b4[n]\n        b2 --- G2((GW))\n        b4 --- G2\n    end\n    subgraph S3[\"3 · Hiérarchique — clusters\"]\n        direction TB\n        c1[n] --- H1{{CH1}}\n        c2[n] --- H1\n        c3[n] --- H2{{CH2}}\n        c4[n] --- H2\n        H1 --- G3((GW))\n        H2 --- G3\n    end\n    S1 ~~~ S2 ~~~ S3\n```\n\n`GW` : passerelle. `CH` : chef de cluster. Les trois topologies sont numérotées pour fixer l'ordre de lecture. Elles n'ont pas le même point de fragilité — c'est le critère qui décide le plus souvent.\n\n## Repères chiffrés\n\n| Critère | Étoile | Maillée | Hiérarchique |\n|---|---|---|---|\n| Sauts | 1 | plusieurs | 2 (nœud → CH → GW) |\n| Portée utile | celle d'un nœud | cumulée sur la chaîne | intermédiaire |\n| Complexité du nœud | minimale | routage embarqué | élection de chef |\n| Énergie | maîtrisée, mais émissions longue portée | les relais surconsomment | la meilleure, grâce à l'agrégation |\n| Point unique de défaillance | la passerelle | aucun | le chef de cluster |\n| Latence | faible et prévisible | variable | intermédiaire |\n| Passage à l'échelle | limité | bon | très bon |\n| Exemples | LoRaWAN, NB-IoT | Zigbee, Thread | LEACH |\n\n## Notions liées\n\n- [[Réseau de capteurs sans fil (WSN)]]\n- [[Agrégation de données]]\n- [[Topologie en étoile]]\n- [[Topologie maillée (mesh)]]\n- [[LEACH]]\n\n---\n*Chapitre 1 — Introduction, architectures et applications. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Les nœuds sont regroupés en clusters ; chaque cluster élit un chef de cluster (cluster head) qui agrège les données de ses membres et les transmet vers la passerelle.","links":["LEACH","Réseau de capteurs sans fil (WSN)","Agrégation de données","Topologie en étoile","Topologie maillée (mesh)"]},{"title":"Topologie maillée (mesh)","folder":"01-Introduction-et-architectures","type":"concept","chapter":"1 - Introduction, architectures et applications","tags":["reseaux-de-capteurs","chapitre-1","concept"],"body":"# Topologie maillée (mesh)\n\n> **Définition.** Les nœuds peuvent relayer les messages les uns des autres. L'information chemine en plusieurs sauts (multi-hop) jusqu'à la passerelle.\n\n**Avantages** : couverture étendue au-delà de la portée d'un seul nœud ; robustesse (si un chemin est coupé, un autre est trouvé) ; pas de point unique de défaillance.\n\n**Inconvénients** : complexité (chaque nœud doit router) ; consommation accrue des nœuds relais ; latence variable ; protocoles de routage nécessaires.\n\nC'est la topologie de Zigbee et de Thread, adaptée aux déploiements denses où la portée individuelle est faible mais la couverture globale doit être grande.\n\n## Schéma\n\n```mermaid\nflowchart TB\n    A[\"A · source\"] --- B[\"B\"]\n    A ---|secours| C[\"C\"]\n    B -. lien coupé .- GW((GW))\n    C --- D[\"D\"]\n    D --- GW\n    GW -->|IP / Internet| S[Serveur, base, cloud]\n```\n\n`A`, `B`, `C`, `D` : nœuds capteurs. `GW` : passerelle.\n\nA est hors de portée de la passerelle : ses données\ntransitent par des nœuds relais, en **plusieurs sauts** — c'est ce qui étend la\ncouverture bien au-delà de la portée d'un seul nœud. Quand le lien B–GW tombe,\nle trafic bascule sur A–C–D–GW : il n'y a **pas de point unique de défaillance**.\nEn contrepartie, chaque relais dépense son énergie pour le compte des autres et\nla latence dépend du chemin retenu.\n\n## Notions liées\n\n- [[Réseau de capteurs sans fil (WSN)]]\n- [[Zigbee]]\n- [[Thread]]\n- [[Réseau ad-hoc (MANET)]]\n- [[Mécanismes de résilience]]\n- [[Topologie en étoile]]\n- [[Topologie hiérarchique (clusters)]]\n\n## Mentionné par\n\n- [[Tolérance aux pannes]]\n\n---\n*Chapitre 1 — Introduction, architectures et applications. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Les nœuds peuvent relayer les messages les uns des autres. L'information chemine en plusieurs sauts (multi-hop) jusqu'à la passerelle.","links":["Réseau de capteurs sans fil (WSN)","Zigbee","Thread","Réseau ad-hoc (MANET)","Mécanismes de résilience","Topologie en étoile","Topologie hiérarchique (clusters)","Tolérance aux pannes"]},{"title":"Unité d'alimentation","folder":"01-Introduction-et-architectures","type":"concept","chapter":"1 - Introduction, architectures et applications","tags":["reseaux-de-capteurs","chapitre-1","concept"],"body":"# Unité d'alimentation\n\n> **Définition.** Batterie, pile, ou dispositif de récupération d'énergie (energy harvesting). Conditionne la durée de vie de tout le nœud.\n\nSur le terrain, remplacer une batterie coûte cher, voire est impossible (lieux difficiles d'accès). L'énergie est donc *la* ressource critique à optimiser avant toutes les autres.\n\n## Notions liées\n\n- [[Nœud capteur (mote)]]\n- [[Budget énergétique d'un nœud]]\n- [[Récupération d'énergie (energy harvesting)]]\n- [[Contraintes des réseaux de capteurs]]\n\n---\n*Chapitre 1 — Introduction, architectures et applications. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Batterie, pile, ou dispositif de récupération d'énergie (energy harvesting). Conditionne la durée de vie de tout le nœud.","links":["Nœud capteur (mote)","Budget énergétique d'un nœud","Récupération d'énergie (energy harvesting)","Contraintes des réseaux de capteurs"]},{"title":"Unité de captation","folder":"01-Introduction-et-architectures","type":"concept","chapter":"1 - Introduction, architectures et applications","tags":["reseaux-de-capteurs","chapitre-1","concept"],"body":"# Unité de captation\n\n> **Définition.** Sous-ensemble du nœud capteur : un ou plusieurs capteurs, leur conditionnement de signal et un convertisseur analogique-numérique (CAN). L'interface avec le monde physique.\n\nC'est le point d'entrée de la mesure physique (température, humidité, vibration, luminosité, gaz...) dans le nœud. Le coût énergétique de la capture varie fortement selon le capteur : un capteur de gaz chauffé consomme beaucoup, un thermistor très peu.\n\n## Notions liées\n\n- [[Nœud capteur (mote)]]\n- [[Budget énergétique d'un nœud]]\n\n---\n*Chapitre 1 — Introduction, architectures et applications. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Sous-ensemble du nœud capteur : un ou plusieurs capteurs, leur conditionnement de signal et un convertisseur analogique-numérique (CAN). L'interface avec le monde physique.","links":["Nœud capteur (mote)","Budget énergétique d'un nœud"]},{"title":"Unité de communication (transceiver)","folder":"01-Introduction-et-architectures","type":"concept","chapter":"1 - Introduction, architectures et applications","tags":["reseaux-de-capteurs","chapitre-1","concept"],"body":"# Unité de communication (transceiver)\n\n> **Définition.** Émetteur-récepteur radio du nœud capteur : de loin le composant le plus gourmand en énergie.\n\nL'émission (TX) est coûteuse, mais l'écoute (RX, être à l'affût d'un message) l'est presque autant, car la radio est alors allumée en permanence — point contre-intuitif capital qui gouverne toute la stratégie d'économie d'énergie : éteindre la radio le plus souvent possible.\n\n## Notions liées\n\n- [[Nœud capteur (mote)]]\n- [[Budget énergétique d'un nœud]]\n- [[Duty cycling]]\n- [[Compromis portée-débit-consommation]]\n\n---\n*Chapitre 1 — Introduction, architectures et applications. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Émetteur-récepteur radio du nœud capteur : de loin le composant le plus gourmand en énergie.","links":["Nœud capteur (mote)","Budget énergétique d'un nœud","Duty cycling","Compromis portée-débit-consommation"]},{"title":"Unité de traitement","folder":"01-Introduction-et-architectures","type":"concept","chapter":"1 - Introduction, architectures et applications","tags":["reseaux-de-capteurs","chapitre-1","concept"],"body":"# Unité de traitement\n\n> **Définition.** Microcontrôleur (ARM Cortex-M, ESP32, MSP430...) et sa mémoire, volontairement limités pour économiser l'énergie.\n\nElle exécute le protocole réseau et un éventuel pré-traitement des données (filtrage, seuillage, agrégation). Comparé à la radio, le calcul est relativement peu coûteux en énergie — un nœud a donc toujours intérêt à calculer plutôt qu'à transmettre.\n\n## Notions liées\n\n- [[Nœud capteur (mote)]]\n- [[Agrégation de données]]\n- [[Budget énergétique d'un nœud]]\n\n---\n*Chapitre 1 — Introduction, architectures et applications. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Microcontrôleur (ARM Cortex-M, ESP32, MSP430...) et sa mémoire, volontairement limités pour économiser l'énergie.","links":["Nœud capteur (mote)","Agrégation de données","Budget énergétique d'un nœud"]},{"title":"6LoWPAN","folder":"02-Adressage-et-IPv6","type":"protocole","chapter":"2 - Adressage et protocole IPv6","tags":["reseaux-de-capteurs","chapitre-2","protocole"],"body":"# 6LoWPAN\n\n> **Définition.** IPv6 over Low-power Wireless Personal Area Networks : couche d'adaptation, définie par l'IETF, qui permet de faire transiter des paquets IPv6 sur des réseaux radio contraints de type IEEE 802.15.4.\n\nTension fondamentale : IPv6 exige une MTU minimale de 1280 octets par lien, alors qu'une trame IEEE 802.15.4 ne fait que 127 octets au total (une centaine d'octets utiles une fois les en-têtes de liaison et la sécurité déduits). Transporter directement une adresse IPv6 (32 octets rien que pour source + destination) est inenvisageable tel quel.\n\n6LoWPAN s'intercale entre la couche liaison (802.15.4) et la couche réseau (IPv6), et apporte trois mécanismes :\n- **Compression d'en-tête** : les champs redondants ou déductibles du contexte local sont élidés — un en-tête IPv6 de 40 octets peut être réduit à quelques octets.\n- **Fragmentation et réassemblage** : quand un paquet dépasse la capacité d'une trame 802.15.4, il est découpé à l'émission et réassemblé à la réception. L'en-tête de fragmentation coûte 4 octets sur le premier fragment et 5 sur les suivants.\n- **Transmission dans le réseau maillé** (*mesh addressing*) : en-tête permettant le relayage multi-saut.\n\nEn pratique, un capteur IPv6 moderne empile souvent : IEEE 802.15.4 → 6LoWPAN → IPv6 → UDP → CoAP, avec un routage multi-saut assuré par RPL.\n\n**Exemple.** Sur un même PAN, tous les nœuds partagent le préfixe /64. Plutôt que de répéter ce préfixe (8 octets) dans chaque paquet, 6LoWPAN le déduit du contexte : là où l'en-tête IPv6 brut consommerait la quasi-totalité d'une trame de 127 octets, la version compressée en laisse l'essentiel disponible pour les données utiles.\n\n## Repères chiffrés\n\nLe budget d'octets d'une trame, poste par poste :\n\n| Poste | Sans 6LoWPAN | Avec 6LoWPAN |\n|---|---|---|\n| Trame PHY 802.15.4 | 127 o | 127 o |\n| En-tête MAC + FCS | − 25 o | − 25 o |\n| **Charge utile MAC** | **102 o** | **102 o** |\n| En-tête IPv6 | − 40 o | − 7 o (IPHC, cas multi-saut) |\n| En-tête UDP | − 8 o | − 4 o (NHC) |\n| **Données applicatives** | **54 o** | **91 o** |\n| Idem avec AES-CCM* (− 21 o) | 33 o | 70 o |\n\nDeux chiffres à retenir : la compression IPHC descend l'en-tête IPv6 à **2 octets** dans le cas le plus favorable (lien local, adresses dérivées de l'EUI-64, octet de dispatch inclus) et à **7 octets** dans le cas multi-saut de référence. La compression NHC ramène l'en-tête UDP de 8 octets à 2 au mieux, 4 lorsque la somme de contrôle est transportée. Avec la sécurité activée, 6LoWPAN **double** la charge utile disponible : 33 → 70 octets.\n\n## Références\n\n- RFC 4919 — cas d'usage et exigences.\n- RFC 4944 — transmission d'IPv6 sur 802.15.4, fragmentation, *mesh addressing*.\n- RFC 6282 — compression d'en-tête IPHC et NHC.\n\n## Notions liées\n\n- [[IPv6]]\n- [[En-tête IPv6]]\n- [[IEEE 802.15.4]]\n- [[Pile protocolaire de l'IoT contraint]]\n- [[RPL]]\n- [[Contraintes des réseaux de capteurs]]\n- [[Sécurité des réseaux de capteurs]]\n\n---\n*Chapitre 2 — Adressage et protocole IPv6. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"IPv6 over Low-power Wireless Personal Area Networks : couche d'adaptation, définie par l'IETF, qui permet de faire transiter des paquets IPv6 sur des réseaux radio contraints de ty","links":["IPv6","En-tête IPv6","IEEE 802.15.4","Pile protocolaire de l'IoT contraint","RPL","Contraintes des réseaux de capteurs","Sécurité des réseaux de capteurs"]},{"title":"Chapitre 2 - Adressage et protocole IPv6","folder":"02-Adressage-et-IPv6","type":"moc","chapter":"","tags":["reseaux-de-capteurs","moc","chapitre-2"],"body":"# Chapitre 2 - Adressage et protocole IPv6\n\nNotions du chapitre 2 — *Adressage et protocole IPv6*.\n\n- [[IPv4 et pénurie d'adresses]] — Protocole d'adressage historique sur 32 bits (≈ 4,3 milliards d'adresses), aujourd'hui épuisé face à l'explosion des objets connectés.\n- [[IPv6]] — Protocole d'adressage successeur d'IPv4, sur 128 bits (≈ 3,4 × 10³⁸ adresses), qui permet d'attribuer une adresse unique et publique à chaque objet, même à l'échelle de milliards de capteurs.\n- [[Structure d'une adresse IPv6]] — Adresse de 128 bits écrite en hexadécimal, huit groupes de 16 bits séparés par ':', décomposée en préfixe réseau (64 bits) et identifiant d'interface (64 bits).\n- [[Types d'adresses IPv6]] — IPv6 abandonne le broadcast d'IPv4 au profit de trois modes : unicast, multicast et anycast.\n- [[SLAAC]] — StateLess Address AutoConfiguration : mécanisme qui permet à un nœud de se fabriquer lui-même une adresse IPv6, sans serveur central.\n- [[DHCPv6]] — Version IPv6 du protocole DHCP : un serveur centralise l'attribution des adresses et tient à jour la liste des baux (leases).\n- [[En-tête IPv6]] — En-tête simplifié par rapport à IPv4, de 40 octets de taille fixe, pour accélérer le traitement par les routeurs.\n- [[NDP (Neighbor Discovery Protocol)]] — Protocole central d'IPv6, transporté par ICMPv6, qui remplace et étend ARP d'IPv4.\n- [[6LoWPAN]] — IPv6 over Low-power Wireless Personal Area Networks : couche d'adaptation, définie par l'IETF, qui permet de faire transiter des paquets IPv6 sur des réseaux radio contraints de type IEEE 802.15.4.\n- [[Pile protocolaire de l'IoT contraint]] — Empilement protocolaire typique d'un capteur IPv6 moderne : IEEE 802.15.4 → 6LoWPAN → IPv6 → UDP → CoAP, avec RPL pour le routage multi-saut.\n\n## Compléments rattachés à ce chapitre\n\n- [[CoAP]] — le dernier étage de la pile contrainte, cité dans le chapitre sans y avoir de page.\n- [[Sécurité des réseaux de capteurs]] — le coût de la sécurité en octets, à croiser avec le budget de trame de 6LoWPAN.\n\n## Voir aussi\n\n- [[Accueil]]\n- [[Chapitre 1 - Introduction, architectures et applications]]\n- [[Chapitre 3 - La communication dans les réseaux de capteurs]]\n- [[Chapitre 4 - Économie d'énergie et tolérance aux pannes]]\n- [[Compléments hors support]]","excerpt":"Notions du chapitre 2 — Adressage et protocole IPv6.","links":["IPv4 et pénurie d'adresses","IPv6","Structure d'une adresse IPv6","Types d'adresses IPv6","SLAAC","DHCPv6","En-tête IPv6","NDP (Neighbor Discovery Protocol)","6LoWPAN","Pile protocolaire de l'IoT contraint","CoAP","Sécurité des réseaux de capteurs","Accueil","Chapitre 1 - Introduction, architectures et applications","Chapitre 3 - La communication dans les réseaux de capteurs","Chapitre 4 - Économie d'énergie et tolérance aux pannes","Compléments hors support"]},{"title":"DHCPv6","folder":"02-Adressage-et-IPv6","type":"protocole","chapter":"2 - Adressage et protocole IPv6","tags":["reseaux-de-capteurs","chapitre-2","protocole"],"body":"# DHCPv6\n\n> **Définition.** Version IPv6 du protocole DHCP : un serveur centralise l'attribution des adresses et tient à jour la liste des baux (leases).\n\n- **DHCPv6 avec état** (*stateful*) : le serveur attribue l'adresse complète et mémorise l'association — contrôle centralisé et traçabilité.\n- **DHCPv6 sans état** (*stateless*) : l'adresse est obtenue par SLAAC, DHCPv6 ne fournissant que des informations complémentaires (serveur DNS, NTP...).\n\n**À retenir.** SLAAC est autonome, léger, sans serveur : idéal pour un grand parc de capteurs homogènes. DHCPv6 avec état offre contrôle et traçabilité centralisés, au prix d'un serveur à maintenir. Les deux peuvent coexister.\n\n## Notions liées\n\n- [[IPv6]]\n- [[SLAAC]]\n\n---\n*Chapitre 2 — Adressage et protocole IPv6. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Version IPv6 du protocole DHCP : un serveur centralise l'attribution des adresses et tient à jour la liste des baux (leases).","links":["IPv6","SLAAC"]},{"title":"En-tête IPv6","folder":"02-Adressage-et-IPv6","type":"concept","chapter":"2 - Adressage et protocole IPv6","tags":["reseaux-de-capteurs","chapitre-2","concept"],"body":"# En-tête IPv6\n\n> **Définition.** En-tête simplifié par rapport à IPv4, de 40 octets de taille fixe, pour accélérer le traitement par les routeurs.\n\nIl contient notamment : la version, une classe de trafic (priorité), un *flow label*, la longueur des données utiles, le champ *Next Header* (protocole de niveau supérieur ou extension), le champ *Hop Limit* (équivalent du TTL d'IPv4), et les adresses source et destination sur 128 bits chacune. Les fonctions optionnelles sont reportées dans des en-têtes d'extension chaînés plutôt que dans un en-tête de taille variable. C'est ce poids fixe de 40 octets qui pose problème face à une trame IEEE 802.15.4 de 127 octets — d'où la compression d'en-tête de 6LoWPAN.\n\n## Repères chiffrés\n\n| | IPv6 | IPv4 |\n|---|---|---|\n| Taille | 40 octets, **fixe** | 20 à 60 octets, variable |\n| Nombre de champs | 8 | 12 champs fixes + champ Options |\n| Somme de contrôle d'en-tête | supprimée | présente, à recalculer à chaque saut |\n| Fragmentation par les routeurs | interdite (reportée sur la source) | autorisée |\n| Options | en-têtes d'extension chaînés | dans l'en-tête lui-même |\n\n**À retenir.** Le gain de traitement vient moins de la taille que du caractère **fixe** de l'en-tête : un routeur sait à l'avance où lire chaque champ, n'a pas de somme de contrôle à recalculer et n'a pas à fragmenter. Mais pour un lien de 127 octets, ces 40 octets fixes restent un coût net — c'est exactement la tension que résout [[6LoWPAN]].\n\n## Notions liées\n\n- [[IPv6]]\n- [[6LoWPAN]]\n- [[IPv4 et pénurie d'adresses]]\n\n---\n*Chapitre 2 — Adressage et protocole IPv6. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"En-tête simplifié par rapport à IPv4, de 40 octets de taille fixe, pour accélérer le traitement par les routeurs.","links":["6LoWPAN","IPv6","IPv4 et pénurie d'adresses"]},{"title":"IPv4 et pénurie d'adresses","folder":"02-Adressage-et-IPv6","type":"concept","chapter":"2 - Adressage et protocole IPv6","tags":["reseaux-de-capteurs","chapitre-2","concept"],"body":"# IPv4 et pénurie d'adresses\n\n> **Définition.** Protocole d'adressage historique sur 32 bits (≈ 4,3 milliards d'adresses), aujourd'hui épuisé face à l'explosion des objets connectés.\n\nL'adresse IP identifie de façon unique une interface réseau et permet le routage des paquets. IPv4 note ses adresses en décimal pointé (ex. 192.168.1.10). Avec plusieurs dizaines de milliards d'objets connectés estimés, IPv4 ne peut structurellement pas leur attribuer une adresse à chacun. Le NAT (Network Address Translation) partage une adresse publique entre plusieurs machines mais complique la communication de bout en bout : un serveur ne peut pas facilement initier un dialogue vers un objet caché derrière un NAT — problème pour piloter un actionneur ou interroger un capteur à la demande.\n\n## Notions liées\n\n- [[IPv6]]\n\n---\n*Chapitre 2 — Adressage et protocole IPv6. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Protocole d'adressage historique sur 32 bits (≈ 4,3 milliards d'adresses), aujourd'hui épuisé face à l'explosion des objets connectés.","links":["IPv6"]},{"title":"IPv6","folder":"02-Adressage-et-IPv6","type":"protocole","chapter":"2 - Adressage et protocole IPv6","tags":["reseaux-de-capteurs","chapitre-2","protocole"],"body":"# IPv6\n\n> **Définition.** Protocole d'adressage successeur d'IPv4, sur 128 bits (≈ 3,4 × 10³⁸ adresses), qui permet d'attribuer une adresse unique et publique à chaque objet, même à l'échelle de milliards de capteurs.\n\nCet espace est si vaste que la question de la pénurie d'adresses disparaît totalement pour un réseau de capteurs. Mais IPv6 est trop « lourd » pour les trames radio minuscules des objets contraints : c'est **6LoWPAN** qui résout ce conflit.\n\n**À retenir.** IPv6 rend chaque capteur adressable de bout en bout, ce que la pénurie d'adresses IPv4 interdisait. Mais IPv6 est trop lourd pour les trames radio minuscules des objets contraints : 6LoWPAN résout ce conflit par la compression d'en-tête, la fragmentation et le support du maillage.\n\n## Notions liées\n\n- [[IPv4 et pénurie d'adresses]]\n- [[Structure d'une adresse IPv6]]\n- [[Types d'adresses IPv6]]\n- [[SLAAC]]\n- [[DHCPv6]]\n- [[En-tête IPv6]]\n- [[NDP (Neighbor Discovery Protocol)]]\n- [[6LoWPAN]]\n\n## Mentionné par\n\n- [[Pile protocolaire de l'IoT contraint]]\n\n---\n*Chapitre 2 — Adressage et protocole IPv6. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Protocole d'adressage successeur d'IPv4, sur 128 bits (≈ 3,4 × 10³⁸ adresses), qui permet d'attribuer une adresse unique et publique à chaque objet, même à l'échelle de milliards d","links":["IPv4 et pénurie d'adresses","Structure d'une adresse IPv6","Types d'adresses IPv6","SLAAC","DHCPv6","En-tête IPv6","NDP (Neighbor Discovery Protocol)","6LoWPAN","Pile protocolaire de l'IoT contraint"]},{"title":"NDP (Neighbor Discovery Protocol)","folder":"02-Adressage-et-IPv6","type":"protocole","chapter":"2 - Adressage et protocole IPv6","tags":["reseaux-de-capteurs","chapitre-2","protocole"],"body":"# NDP (Neighbor Discovery Protocol)\n\n> **Définition.** Protocole central d'IPv6, transporté par ICMPv6, qui remplace et étend ARP d'IPv4.\n\n- **Découverte des routeurs** : messages Router Solicitation / Router Advertisement (utilisés par SLAAC).\n- **Résolution d'adresse** : associer une adresse IPv6 de voisin à son adresse matérielle, via Neighbor Solicitation (NS) / Neighbor Advertisement (NA).\n- **Détection d'inaccessibilité de voisin** (NUD).\n- **Détection d'adresse dupliquée** (DAD) : garantir l'unicité d'une adresse avant de l'utiliser.\n\n## Notions liées\n\n- [[IPv6]]\n- [[SLAAC]]\n- [[Types d'adresses IPv6]]\n\n---\n*Chapitre 2 — Adressage et protocole IPv6. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Protocole central d'IPv6, transporté par ICMPv6, qui remplace et étend ARP d'IPv4.","links":["IPv6","SLAAC","Types d'adresses IPv6"]},{"title":"Pile protocolaire de l'IoT contraint","folder":"02-Adressage-et-IPv6","type":"concept","chapter":"2 - Adressage et protocole IPv6","tags":["reseaux-de-capteurs","chapitre-2","concept"],"body":"# Pile protocolaire de l'IoT contraint\n\n> **Définition.** Empilement protocolaire typique d'un capteur IPv6 moderne : IEEE 802.15.4 → 6LoWPAN → IPv6 → UDP → CoAP, avec RPL pour le routage multi-saut.\n\n**CoAP** (Constrained Application Protocol) est un équivalent allégé de HTTP pour objets contraints, transporté sur UDP plutôt que TCP pour rester léger. Cette pile complète illustre comment chaque couche résout un problème spécifique de la contrainte radio : la physique et la liaison (802.15.4), l'adressage compressé (6LoWPAN/IPv6), le transport léger (UDP), l'application (CoAP) et le routage vers la passerelle (RPL).\n\n## Schéma\n\n```mermaid\nflowchart LR\n    subgraph CLASSIQUE[\"Pile Internet classique\"]\n        direction TB\n        c5[HTTP / TLS] --> c4[TCP] --> c3[IPv4 ou IPv6] --> c1[Ethernet 802.3 / Wi-Fi 802.11]\n    end\n    subgraph CONTRAINT[\"Pile IoT contraint\"]\n        direction TB\n        d5[CoAP] --> d4[UDP] --> d3[IPv6] --> d2[\"6LoWPAN\u003cbr/>compression, fragmentation, mesh\"] --> d1[\"IEEE 802.15.4\u003cbr/>PHY + MAC, trame de 127 octets\"]\n        d3 -.- RPL[\"RPL\u003cbr/>routage multi-saut\"]\n    end\n    CLASSIQUE ~~~ CONTRAINT\n```\n\nLa mise en regard fait apparaître l'essentiel : **6LoWPAN est une couche en plus**, absente de la pile classique, insérée uniquement parce que le lien radio est trop petit pour IPv6. Trois autres substitutions suivent la même logique de frugalité — UDP au lieu de TCP, CoAP au lieu de HTTP, multicast au lieu de broadcast.\n\n## Notions liées\n\n- [[6LoWPAN]]\n- [[IPv6]]\n- [[IEEE 802.15.4]]\n- [[RPL]]\n- [[CoAP]]\n- [[Couche MAC et accès au canal (CSMA-CA)]]\n\n---\n*Chapitre 2 — Adressage et protocole IPv6. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Empilement protocolaire typique d'un capteur IPv6 moderne : IEEE 802.15.4 → 6LoWPAN → IPv6 → UDP → CoAP, avec RPL pour le routage multi-saut.","links":["6LoWPAN","IPv6","IEEE 802.15.4","RPL","CoAP","Couche MAC et accès au canal (CSMA-CA)"]},{"title":"SLAAC","folder":"02-Adressage-et-IPv6","type":"protocole","chapter":"2 - Adressage et protocole IPv6","tags":["reseaux-de-capteurs","chapitre-2","protocole"],"body":"# SLAAC\n\n> **Définition.** StateLess Address AutoConfiguration : mécanisme qui permet à un nœud de se fabriquer lui-même une adresse IPv6, sans serveur central.\n\n1. Le nœud génère une adresse *link-local* et vérifie qu'elle n'est pas déjà utilisée (DAD, Duplicate Address Detection).\n2. Il émet un message **Router Solicitation** (RS).\n3. Un routeur répond par un **Router Advertisement** (RA) contenant le préfixe réseau (`/64`) à utiliser.\n4. Le nœud combine ce préfixe avec son identifiant d'interface pour former son adresse globale.\n\nMécanisme « sans état » : aucun équipement ne tient de table des adresses attribuées, chaque nœud est autonome. Léger et bien adapté aux capteurs.\n\n## Schéma\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant N as Nœud capteur\n    participant M as Multicast ff02::1 / ff02::2\n    participant R as Routeur / passerelle\n    N->>N: Fabrique fe80:: + identifiant d'interface (EUI-64 ou aléatoire)\n    N->>M: Neighbor Solicitation — DAD sur l'adresse link-local\n    Note over N,M: Pas de réponse, donc adresse libre\n    N->>R: Router Solicitation (RS)\n    R-->>N: Router Advertisement (RA) : préfixe 2001:db8:1::/64\n    N->>N: Adresse globale = préfixe /64 + identifiant d'interface\n    N->>M: Neighbor Solicitation — DAD sur l'adresse globale\n    Note over N,R: Sans état : aucun équipement ne tient de table de baux\n```\n\nDeux points que la liste d'étapes ne montre pas et que le diagramme rend visibles : le DAD s'exécute **deux fois** — sur l'adresse link-local puis sur l'adresse globale — et l'essentiel du dialogue passe par des adresses de **multicast**, jamais par du broadcast.\n\n## Notions liées\n\n- [[IPv6]]\n- [[Structure d'une adresse IPv6]]\n- [[DHCPv6]]\n- [[NDP (Neighbor Discovery Protocol)]]\n- [[Types d'adresses IPv6]]\n\n---\n*Chapitre 2 — Adressage et protocole IPv6. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"StateLess Address AutoConfiguration : mécanisme qui permet à un nœud de se fabriquer lui-même une adresse IPv6, sans serveur central.","links":["IPv6","Structure d'une adresse IPv6","DHCPv6","NDP (Neighbor Discovery Protocol)","Types d'adresses IPv6"]},{"title":"Structure d'une adresse IPv6","folder":"02-Adressage-et-IPv6","type":"concept","chapter":"2 - Adressage et protocole IPv6","tags":["reseaux-de-capteurs","chapitre-2","concept"],"body":"# Structure d'une adresse IPv6\n\n> **Définition.** Adresse de 128 bits écrite en hexadécimal, huit groupes de 16 bits séparés par ':', décomposée en préfixe réseau (64 bits) et identifiant d'interface (64 bits).\n\nDeux règles de simplification allègent l'écriture : on peut omettre les zéros de tête de chaque groupe, et remplacer une seule suite de groupes nuls consécutifs par `::` (une seule fois par adresse). Exemple : `2001:0db8:0000:0000:0000:ff00:0042:8329` se réduit à `2001:db8::ff00:42:8329`.\n\nLes 64 bits de poids fort forment le **préfixe réseau** (noté en CIDR, ex. `/64`), qui identifie le sous-réseau. Les 64 bits de poids faible forment l'**identifiant d'interface**, qui identifie l'hôte. Il peut être dérivé de l'adresse MAC par le procédé **EUI-64**, ou tiré aléatoirement pour des raisons de vie privée.\n\n## Repères chiffrés\n\nDécoupage courant des 128 bits :\n\n| Champ | Longueur | Rôle |\n|---|---|---|\n| Préfixe global | 48 bits | délégué par l'opérateur ou le RIR |\n| Identifiant de sous-réseau | 16 bits | découpage interne, jusqu'à 65 536 sous-réseaux |\n| Identifiant d'interface | 64 bits | identifie le nœud sur le lien |\n\n**Le procédé EUI-64**, à savoir appliquer. À partir d'une adresse MAC de 48 bits :\n1. Couper la MAC en deux moitiés de 24 bits.\n2. Insérer `FFFE` entre les deux.\n3. Inverser le 7ᵉ bit du premier octet (bit U/L, *Universal/Local*).\n\nExemple : MAC `00:1A:2B:3C:4D:5E` donne l'identifiant `021A:2BFF:FE3C:4D5E`, et donc l'adresse link-local `fe80::21a:2bff:fe3c:4d5e`.\n\n**Point de vigilance pour les capteurs.** Un identifiant dérivé de l'EUI-64 est déductible du contexte, donc élidable par la compression IPHC de [[6LoWPAN]] : c'est ce qui permet de descendre l'en-tête IPv6 à 2 octets sur le lien local. Un identifiant tiré aléatoirement protège mieux la vie privée mais coûte des octets dans chaque trame. Le compromis vie privée / énergie est ici direct.\n\n## Notions liées\n\n- [[IPv6]]\n- [[SLAAC]]\n- [[6LoWPAN]]\n- [[Types d'adresses IPv6]]\n\n---\n*Chapitre 2 — Adressage et protocole IPv6. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Adresse de 128 bits écrite en hexadécimal, huit groupes de 16 bits séparés par ':', décomposée en préfixe réseau (64 bits) et identifiant d'interface (64 bits).","links":["6LoWPAN","IPv6","SLAAC","Types d'adresses IPv6"]},{"title":"Types d'adresses IPv6","folder":"02-Adressage-et-IPv6","type":"concept","chapter":"2 - Adressage et protocole IPv6","tags":["reseaux-de-capteurs","chapitre-2","concept"],"body":"# Types d'adresses IPv6\n\n> **Définition.** IPv6 abandonne le broadcast d'IPv4 au profit de trois modes : unicast, multicast et anycast.\n\n- **Unicast** : identifie une interface unique. On distingue les adresses *link-local* (préfixe `fe80::/10`, valables uniquement sur le lien local, auto-configurées systématiquement) et les adresses *globales* (routables sur Internet, préfixe `2000::/3`).\n- **Multicast** : identifie un groupe d'interfaces (préfixe `ff00::/8`) ; le paquet est livré à tous les membres. IPv6 s'appuie fortement sur le multicast, notamment pour la découverte de voisins.\n- **Anycast** : identifie un groupe d'interfaces, mais le paquet n'est livré qu'au membre le plus « proche » au sens du routage.\n\n**À retenir.** Il n'y a pas de broadcast en IPv6 : il est remplacé par le multicast, plus économe car seuls les nœuds concernés traitent le paquet. Point important pour les réseaux de capteurs, où réveiller inutilement tous les nœuds gaspillerait de l'énergie.\n\n## Notions liées\n\n- [[IPv6]]\n- [[NDP (Neighbor Discovery Protocol)]]\n\n---\n*Chapitre 2 — Adressage et protocole IPv6. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"IPv6 abandonne le broadcast d'IPv4 au profit de trois modes : unicast, multicast et anycast.","links":["IPv6","NDP (Neighbor Discovery Protocol)"]},{"title":"Bluetooth Low Energy (BLE)","folder":"03-Communication-et-routage","type":"technologie","chapter":"3 - La communication dans les réseaux de capteurs","tags":["reseaux-de-capteurs","chapitre-3","technologie"],"body":"# Bluetooth Low Energy (BLE)\n\n> **Définition.** Technologie radio à 2,4 GHz, débit de l'ordre du Mbit/s sur courte portée (quelques mètres à quelques dizaines de mètres), consommation très faible au repos.\n\nExcelle dans les échanges brefs et peu fréquents. Historiquement en étoile autour d'un smartphone ou d'une passerelle, propose désormais un mode maillé (BLE Mesh). Usages typiques : capteurs corporels, balises (beacons), objets grand public.\n\n## Notions liées\n\n- [[Compromis portée-débit-consommation]]\n- [[Topologie en étoile]]\n\n---\n*Chapitre 3 — La communication dans les réseaux de capteurs. Cours [IM5RC] Réseaux de capteurs, MIRA 3A.*","excerpt":"Technologie radio à 2,4 GHz, débit de l'ordre du Mbit/s sur courte portée (quelques mètres à quelques dizaines de mètres), consommation très faible au repos.","links":["Compromis portée-débit-consommation","Topologie en étoile"]},{"title":"Chapitre 3 - La communication dans les réseaux de capteurs","folder":"03-Communication-et-routage","type":"moc","chapter":"","tags":["reseaux-de-capteurs","moc","chapitre-3"],"body":"# Chapitre 3 - La communication dans les réseaux de capteurs\n\nNotions du chapitre 3 — *La communication dans les réseaux de capteurs*.\n\n- [[Compromis portée-débit-consommation]] — Toute communication sans fil repose sur un compromis entre portée, débit, consommation et coût, qu'on ne peut pas tous optimiser en même temps.\n- [[Comparaison des technologies radio]] — Tableau de synthèse des cinq familles étudiées, à lire comme un outil de choix : quoi éliminer, et dans quel ordre.\n- [[IEEE 802.15.4]] — Norme qui définit les couches physique et liaison des réseaux personnels sans fil basse consommation (LR-WPAN). Bande 2,4 GHz, ~250 kbit/s, portée de quelques dizaines de mètres.\n- [[Zigbee]] — Pile réseau construite sur IEEE 802.15.4, ajoutant les couches réseau et application avec un routage mesh.\n- [[Thread]] — Technologie plus récente, construite sur 802.15.4 et 6LoWPAN, qui offre un maillage IPv6 natif sans point unique de défaillance.\n- [[Bluetooth Low Energy (BLE)]] — Technologie radio à 2,4 GHz, débit de l'ordre du Mbit/s sur courte portée (quelques mètres à quelques dizaines de mètres), consommation très faible au repos.\n- [[LoRa et LoRaWAN]] — LoRa : modulation longue portée en bande sub-gigahertz libre (868 MHz en Europe), plusieurs kilomètres de portée, débit très faible. LoRaWAN : protocole réseau construit au-dessus, organisé en étoile.\n- [[NB-IoT et LTE-M]] — Technologies LPWAN cellulaires, appuyées sur les infrastructures des opérateurs mobiles (4G/5G).\n- [[Nœuds fixes et nœuds mobiles]] — Un nœud fixe, posé une fois, donne une topologie stable ; un nœud mobile rend la topologie dynamique et le routage difficile.\n- [[Réseau ad-hoc (MANET)]] — Réseau sans fil qui se forme spontanément, sans infrastructure préexistante, les nœuds jouant eux-mêmes le rôle de routeurs. Mobile Ad-hoc NETwork (MANET) quand les nœuds sont mobiles.\n- [[Routage dans les réseaux ad-hoc]] — Détermination du chemin de nœuds relais qu'un paquet doit emprunter pour atteindre sa destination, rendue difficile par une topologie changeante et des ressources rares.\n- [[Protocoles proactifs (OLSR)]] — Protocoles table-driven qui maintiennent en permanence, dans chaque nœud, une table de routage à jour vers toutes les destinations possibles.\n- [[Protocoles réactifs (AODV)]] — Protocoles on-demand qui ne calculent une route que lorsqu'un nœud a effectivement quelque chose à envoyer.\n- [[Protocoles hybrides (ZRP)]] — Combinent les deux approches : proactif à l'intérieur d'une zone locale, réactif au-delà, pour les destinations lointaines et rares.\n- [[RPL]] — Routing Protocol for Low-power and Lossy networks : protocole de routage standardisé par l'IET
